<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Full Features</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0; background-color: #111; color: #fff;
            font-family: 'Press Start 2P', cursive;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden; user-select: none;
        }

        #game-container {
            position: relative; width: 800px; height: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            overflow: hidden;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: rgba(0, 0, 0, 0.7); z-index: 10;
        }

        h1 { color: #00ffcc; text-shadow: 2px 2px 0px #ff0055; font-size: 32px; margin-bottom: 20px; }
        
        button {
            padding: 15px 30px; font-family: 'Press Start 2P', cursive; font-size: 16px;
            color: #fff; background-color: #ff0055; border: 4px solid #fff; cursor: pointer;
        }
        button:hover { background-color: #ff3377; transform: scale(1.05); }

        canvas { display: block; }
        .hidden { display: none !important; }
        .controls { font-size: 10px; color: #aaa; margin-top: 20px; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="lobby" class="screen">
        <h1>GEO-DASH</h1>
        <button id="start-btn">START STAGE</button>
        <div class="controls">
            [조작법]<br>
            마우스 클릭 또는 스페이스바 누르기<br>
            - 큐브: 점프<br>
            - 비행기(Ship): 누르고 있으면 상승<br>
            - 웨이브(Wave): 누르면 대각선 상승, 떼면 대각선 하락
        </div>
    </div>

    <div id="game-over" class="screen hidden">
        <h1 id="result-title">CRASHED!</h1>
        <p id="progress-text" style="color: #ffeb3b; margin-bottom: 30px;">Progress: 0%</p>
        <button id="restart-btn">RETRY</button>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiLobby = document.getElementById('lobby');
    const uiGameOver = document.getElementById('game-over');
    const uiResultTitle = document.getElementById('result-title');
    const uiProgress = document.getElementById('progress-text');

    // 게임 설정
    const BLOCK_SIZE = 40;
    let gameSpeed = 7;
    let isPlaying = false;
    let isHolding = false;
    let animationId;
    let cameraX = 0;

    // 플레이어 상태
    const player = {
        x: 150, y: 0, size: 30, dy: 0,
        mode: 'cube', // cube, ship, wave
        gravity: 1, // 1 (normal), -1 (inverted)
        rotation: 0, grounded: false, dead: false
    };

    // 스테이지 디자인 배열 (20행, 각 문자 1블록)
    // . = 빈공간 / X = 벽,바닥 / ^, v = 가시
    // S = 비행기 포탈 / C = 큐브 포탈 / W = 웨이브 포탈
    // U = 중력 반전 포탈 / D = 정상 중력 포탈 / F = 도착 지점
    const levelMap = [
        "........................................................................................................................................................................................................",
        "........................................................................................................................................................................................................",
        "..................................................................................................XXXXXXXXXXXXX...XXXXXXXXXX............................................................................",
        "..........................................................XXXXXXXXXXXXXXXXXXXX....................X...........X...X........X............................................................................",
        "..........................................................X..................X....................X...v.......X...X........X....................................................X.......................",
        "..........................................................X.......v..........X...U................X.......v...X...X........X....................v..................W............X.......................",
        ".................................................S........X..................X....................X...........X...X........X....................................................X.......................",
        "..........................................................X.............^....X....................X...^.......X...X........X.................C..................................X......F................",
        "................................XXXXX.....................X...^..............X....................X...........X...X........X...................................X................X.......................",
        "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
    ];

    let blocks = [], spikes = [], portals = [], finishLine = null;
    let maxLevelWidth = levelMap[0].length * BLOCK_SIZE;

    // 맵 파싱 함수
    function loadLevel() {
        blocks = []; spikes = []; portals = []; finishLine = null;
        for (let r = 0; r < levelMap.length; r++) {
            for (let c = 0; c < levelMap[r].length; c++) {
                let char = levelMap[r][c];
                let x = c * BLOCK_SIZE;
                let y = r * BLOCK_SIZE;
                
                if (char === 'X') blocks.push({ x, y, size: BLOCK_SIZE });
                else if (char === '^' || char === 'v') spikes.push({ x, y, size: BLOCK_SIZE, dir: char });
                else if (char === 'S' || char === 'C' || char === 'W' || char === 'U' || char === 'D') portals.push({ x, y, type: char });
                else if (char === 'F') finishLine = { x, y };
            }
        }
    }

    // 입력 처리
    function handleInput(e, state) {
        if (e.type === 'keydown' && (e.code === 'Space' || e.code === 'ArrowUp')) e.preventDefault();
        if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
        isHolding = state;

        if (state && !player.dead && isPlaying && player.mode === 'cube' && player.grounded) {
            player.dy = -13 * player.gravity;
            player.grounded = false;
        }
    }
    window.addEventListener('keydown', (e) => handleInput(e, true), { passive: false });
    window.addEventListener('keyup', (e) => handleInput(e, false));
    window.addEventListener('mousedown', (e) => handleInput(e, true));
    window.addEventListener('mouseup', (e) => handleInput(e, false));

    // 게임 초기화
    function initGame() {
        loadLevel();
        player.y = 200; player.dy = 0; player.rotation = 0;
        player.mode = 'cube'; player.gravity = 1;
        player.dead = false; player.grounded = false;
        cameraX = 0;
        isHolding = false;
    }

    // AABB 충돌 검사
    function checkAABB(rect1, rect2, padding = 0) {
        return (
            rect1.x + padding < rect2.x + rect2.width - padding &&
            rect1.x + rect1.width - padding > rect2.x + padding &&
            rect1.y + padding < rect2.y + rect2.height - padding &&
            rect1.y + rect1.height - padding > rect2.y + padding
        );
    }

    function updatePhysics() {
        if (player.dead) return;

        // 모드별 물리 로직
        if (player.mode === 'cube') {
            player.dy += 1.2 * player.gravity; // 큐브 중력
        } else if (player.mode === 'ship') {
            if (isHolding) player.dy -= 0.6 * player.gravity;
            else player.dy += 0.6 * player.gravity;
            player.dy = Math.max(-8, Math.min(player.dy, 8)); // 속도 제한
        } else if (player.mode === 'wave') {
            if (isHolding) player.dy = -8 * player.gravity;
            else player.dy = 8 * player.gravity;
        }

        // Y축 이동
        player.y += player.dy;
        player.grounded = false;
        let hitWall = false;

        // 벽 & 바닥 충돌 검사 (블록)
        const pRect = { x: player.x, y: player.y, width: player.size, height: player.size };
        
        for (let b of blocks) {
            let bRect = { x: b.x - cameraX, y: b.y, width: b.size, height: b.size };
            if (checkAABB(pRect, bRect)) {
                // 이전 프레임 위치 기반으로 바닥/천장인지, 벽인지 판별
                let prevY = player.y - player.dy;
                if (player.gravity === 1) {
                    if (player.dy > 0 && prevY + player.size <= bRect.y + 10) { // 바닥 착지
                        player.y = bRect.y - player.size;
                        player.dy = 0; player.grounded = true;
                    } else if (player.dy < 0 && prevY >= bRect.y + bRect.height - 10) { // 천장 충돌
                        player.y = bRect.y + bRect.height;
                        player.dy = 0;
                    } else { hitWall = true; } // 옆면 충돌 (벽)
                } else {
                    // 중력 반전 상태의 충돌
                    if (player.dy < 0 && prevY >= bRect.y + bRect.height - 10) { // 역-바닥 착지 (천장)
                        player.y = bRect.y + bRect.height;
                        player.dy = 0; player.grounded = true;
                    } else if (player.dy > 0 && prevY + player.size <= bRect.y + 10) { // 역-천장 충돌 (바닥)
                        player.y = bRect.y - player.size;
                        player.dy = 0;
                    } else { hitWall = true; }
                }
            }
        }

        if (hitWall) die();

        // 화면 밖 추락사 방지
        if (player.y < -50 || player.y > canvas.height + 50) die();

        // 가시 충돌
        pRect.y = player.y; // 갱신된 Y 좌표
        for (let s of spikes) {
            let sRect = { x: s.x - cameraX, y: s.y, width: s.size, height: s.size };
            // 가시는 히트박스를 작게 (억울함 방지)
            if (checkAABB(pRect, sRect, 8)) die();
        }

        // 포탈 충돌
        for (let i = 0; i < portals.length; i++) {
            let pt = portals[i];
            let ptRect = { x: pt.x - cameraX, y: pt.y, width: BLOCK_SIZE, height: BLOCK_SIZE * 2 }; // 포탈은 길게
            if (checkAABB(pRect, ptRect)) {
                if (pt.type === 'S') player.mode = 'ship';
                if (pt.type === 'C') player.mode = 'cube';
                if (pt.type === 'W') player.mode = 'wave';
                if (pt.type === 'U') player.gravity = -1; // 중력 반전
                if (pt.type === 'D') player.gravity = 1;  // 정상 중력
                portals.splice(i, 1); // 한 번 먹으면 사라짐
            }
        }

        // 골인 지점 체크
        if (finishLine && finishLine.x - cameraX < player.x) {
            winGame();
        }
    }

    function die() {
        player.dead = true;
        setTimeout(() => gameOver("CRASHED!"), 50);
    }

    // 그리기 로직
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 배경 그리드 (시차 스크롤)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.beginPath(); ctx.moveTo(i - (cameraX * 0.5 % 40), 0); ctx.lineTo(i - (cameraX * 0.5 % 40), canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        // 블록 그리기
        ctx.fillStyle = '#111'; ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2;
        for (let b of blocks) {
            if (b.x - cameraX > canvas.width || b.x - cameraX < -BLOCK_SIZE) continue;
            ctx.fillRect(b.x - cameraX, b.y, b.size, b.size);
            ctx.strokeRect(b.x - cameraX, b.y, b.size, b.size);
        }

        // 가시 그리기
        ctx.fillStyle = '#ff0055'; ctx.strokeStyle = '#fff';
        for (let s of spikes) {
            if (s.x - cameraX > canvas.width || s.x - cameraX < -BLOCK_SIZE) continue;
            ctx.beginPath();
            if (s.dir === '^') {
                ctx.moveTo(s.x - cameraX + s.size / 2, s.y);
                ctx.lineTo(s.x - cameraX + s.size, s.y + s.size);
                ctx.lineTo(s.x - cameraX, s.y + s.size);
            } else {
                ctx.moveTo(s.x - cameraX, s.y);
                ctx.lineTo(s.x - cameraX + s.size, s.y);
                ctx.lineTo(s.x - cameraX + s.size / 2, s.y + s.size);
            }
            ctx.closePath(); ctx.fill(); ctx.stroke();
        }

        // 포탈 그리기
        for (let pt of portals) {
            if (pt.x - cameraX > canvas.width || pt.x - cameraX < -BLOCK_SIZE) continue;
            ctx.lineWidth = 4;
            if (pt.type === 'S') ctx.strokeStyle = '#ff00ff'; // 비행기 핑크
            if (pt.type === 'C') ctx.strokeStyle = '#00ff00'; // 큐브 초록
            if (pt.type === 'W') ctx.strokeStyle = '#00ffff'; // 웨이브 하늘색
            if (pt.type === 'U') ctx.strokeStyle = '#ffff00'; // 반전 중력 노랑
            if (pt.type === 'D') ctx.strokeStyle = '#0000ff'; // 정상 중력 파랑
            
            ctx.beginPath();
            ctx.ellipse(pt.x - cameraX + BLOCK_SIZE/2, pt.y + BLOCK_SIZE, 15, BLOCK_SIZE, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        // 도착 지점 그리기
        if (finishLine) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(finishLine.x - cameraX, 0, 10, canvas.height);
        }

        // 플레이어 그리기
        if (!player.dead) {
            ctx.save();
            ctx.translate(player.x + player.size / 2, player.y + player.size / 2);

            // 모드별 회전 및 형태
            if (player.mode === 'cube') {
                if (!player.grounded) player.rotation += 8 * player.gravity;
                else player.rotation = Math.round(player.rotation / 90) * 90;
                ctx.rotate((player.rotation * Math.PI) / 180);
                
                ctx.fillStyle = player.gravity === 1 ? '#00ffcc' : '#ffff00';
                ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
            } 
            else if (player.mode === 'ship') {
                // 진행 방향에 따라 살짝 기울어짐
                ctx.rotate((player.dy * 2 * Math.PI) / 180);
                ctx.fillStyle = '#ff00ff';
                ctx.beginPath();
                ctx.moveTo(player.size/2, 0); ctx.lineTo(-player.size/2, -player.size/2); ctx.lineTo(-player.size/2, player.size/2);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            }
            else if (player.mode === 'wave') {
                // 위아래 45도 기울기
                let targetAngle = (player.dy < 0 ? -45 : 45) * player.gravity;
                ctx.rotate((targetAngle * Math.PI) / 180);
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.moveTo(player.size/2, 0); ctx.lineTo(-player.size/2, -player.size/3); ctx.lineTo(-player.size/2, player.size/3);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            }
            ctx.restore();
        }

        // UI 표시
        let progress = Math.min(100, Math.floor(((player.x + cameraX) / maxLevelWidth) * 100));
        ctx.fillStyle = '#fff'; ctx.font = '14px "Press Start 2P"';
        ctx.fillText(`Progress: ${progress}%`, 20, 30);
    }

    function animate() {
        if (!isPlaying) return;
        
        if (!player.dead) cameraX += gameSpeed; // 카메라(맵) 우측으로 스크롤
        updatePhysics();
        draw();

        animationId = requestAnimationFrame(animate);
    }

    function startGame() {
        uiLobby.classList.add('hidden');
        uiGameOver.classList.add('hidden');
        initGame();
        isPlaying = true;
        animate();
    }

    function gameOver(msg) {
        isPlaying = false;
        cancelAnimationFrame(animationId);
        uiResultTitle.innerText = msg;
        let progress = Math.min(100, Math.floor(((player.x + cameraX) / maxLevelWidth) * 100));
        uiProgress.innerText = `Progress: ${progress}%`;
        uiGameOver.classList.remove('hidden');
    }

    function winGame() {
        gameOver("LEVEL CLEARED!");
        uiResultTitle.style.color = "#00ffcc";
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

</script>
</body>
</html>
