<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초고퀄리티 끝말잇기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap');

        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --admin-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
        }

        /* 어드민 사이드바 */
        #admin-sidebar {
            width: 350px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(239, 68, 68, 0.3);
            display: none;
            flex-direction: column;
            padding: 20px;
            box-shadow: 5px 0 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            z-index: 10;
        }

        #admin-sidebar h2 {
            color: var(--admin-color);
            font-size: 1.2rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #admin-sidebar h2::before {
            content: "👑";
        }

        .db-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        #cheat-word-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 스크롤바 커스텀 */
        #cheat-word-list::-webkit-scrollbar { width: 6px; }
        #cheat-word-list::-webkit-scrollbar-thumb { background: var(--admin-color); border-radius: 3px; }

        .cheat-word-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .cheat-word-btn:hover {
            background: rgba(239, 68, 68, 0.4);
            transform: translateX(5px);
        }

        /* 메인 컨텐츠 영역 */
        #main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 로그인 화면 */
        #login-screen, #game-screen {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 1.1rem;
            margin-bottom: 20px;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button.btn-primary {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.btn-primary:hover {
            background: var(--primary-hover);
        }

        /* 게임 화면 전용 */
        #game-screen {
            display: none;
        }

        .word-display {
            font-size: 4rem;
            font-weight: 700;
            margin: 20px 0;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .history-box {
            margin-top: 30px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .history-tag {
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .history-tag:last-child {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.5);
        }

        #message {
            margin-top: 15px;
            height: 20px;
            color: #ef4444;
            font-weight: 500;
        }

    </style>
</head>
<body>

    <!-- 어드민(Endloki17) 전용 사이드바 -->
    <div id="admin-sidebar">
        <h2>GOD MODE 활성화</h2>
        <div class="db-status">연동된 단어 DB: 1,000,000개 로드 완료<br>클릭하여 즉시 입력하세요.</div>
        <div id="cheat-word-list">
            <!-- 치트 단어들이 여기에 동적으로 생성됨 -->
        </div>
    </div>

    <!-- 메인 컨텐츠 영역 -->
    <div id="main-wrapper">
        
        <!-- 1. 로그인 화면 -->
        <div id="login-screen">
            <h1>끝말잇기</h1>
            <div class="subtitle">궁극의 두뇌 게임에 오신 것을 환영합니다.</div>
            <input type="text" id="username" placeholder="닉네임을 입력하세요" onkeypress="if(event.key === 'Enter') login()">
            <button class="btn-primary" onclick="login()">게임 시작</button>
        </div>

        <!-- 2. 게임 화면 -->
        <div id="game-screen">
            <div class="subtitle" id="welcome-msg"></div>
            
            <div class="word-display" id="current-word">끝말잇기</div>
            
            <div style="display: flex; gap: 10px;">
                <input type="text" id="word-input" placeholder="다음 단어를 입력하세요" onkeypress="if(event.key === 'Enter') submitWord()" style="margin-bottom: 0;">
                <button class="btn-primary" onclick="submitWord()" style="width: 100px;">입력</button>
            </div>
            
            <div id="message"></div>

            <div class="history-box" id="history-box">
                <!-- 기록 태그들이 추가됨 -->
            </div>
        </div>

    </div>

    <script>
        let currentWord = "끝말잇기";
        let usedWords = ["끝말잇기"];
        let isAdmin = false;

        // 자주 쓰이는 한국어 더미 음절 (치트키 단어 생성용)
        const korSyllables = ['가','나','다','라','마','바','사','아','자','차','카','타','파','하', '기','니','디','리','미','비','시','이','지','치','키','티','피','히', '구','누','두','루','무','부','수','우','주','추','쿠','투','푸','후', '고','노','도','로','모','보','소','오','조','초','코','토','포','호', '력','산','강','바','다','별','달','해','빛','꽃','풀','새','돌','물','불'];

        function login() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                alert("닉네임을 입력해주세요!");
                return;
            }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('welcome-msg').innerText = `${username}님, 환영합니다!`;
            
            // 어드민 체크 (Endloki17)
            if (username === "Endloki17") {
                isAdmin = true;
                document.getElementById('admin-sidebar').style.display = 'flex';
                updateCheatPanel();
            }

            updateUI();
            document.getElementById('word-input').focus();
        }

        function submitWord(forcedWord = null) {
            const inputField = document.getElementById('word-input');
            const newWord = forcedWord ? forcedWord : inputField.value.trim();
            const msgBox = document.getElementById('message');

            // 1. 글자 수 체크
            if (newWord.length < 2) {
                msgBox.innerText = "2글자 이상 입력해주세요.";
                return;
            }

            // 2. 끝말잇기 룰 체크 (이전 단어의 끝 글자와 현재 단어의 첫 글자)
            const lastChar = currentWord.charAt(currentWord.length - 1);
            const firstChar = newWord.charAt(0);

            // (두음법칙 등 복잡한 룰은 제외하고 직관적인 글자 일치만 확인)
            if (lastChar !== firstChar) {
                msgBox.innerText = `'${lastChar}'(으)로 시작하는 단어를 입력해야 합니다!`;
                return;
            }

            // 3. 중복 단어 체크
            if (usedWords.includes(newWord)) {
                msgBox.innerText = "이미 사용한 단어입니다!";
                return;
            }

            // 통과
            msgBox.innerText = "";
            currentWord = newWord;
            usedWords.push(currentWord);
            inputField.value = "";
            
            updateUI();

            if (isAdmin) {
                updateCheatPanel();
            }
        }

        function updateUI() {
            // 현재 단어 업데이트
            document.getElementById('current-word').innerText = currentWord;

            // 히스토리 업데이트
            const historyBox = document.getElementById('history-box');
            historyBox.innerHTML = "";
            usedWords.forEach(word => {
                const span = document.createElement('span');
                span.className = 'history-tag';
                span.innerText = word;
                historyBox.appendChild(span);
            });
            // 스크롤 맨 아래로
            historyBox.scrollTop = historyBox.scrollHeight;
        }

        // 관리자 전용 무한 단어 생성기
        function updateCheatPanel() {
            const cheatList = document.getElementById('cheat-word-list');
            cheatList.innerHTML = ""; // 초기화
            
            const targetChar = currentWord.charAt(currentWord.length - 1);

            // 100만개 DB 연출을 위해 리스트에 50개 정도의 필터링된 "필승 단어"를 즉시 생성
            for (let i = 0; i < 50; i++) {
                // 랜덤 글자 조합으로 단어 생성 (실제 사전 단어처럼 보이게 연출)
                const randomLen = Math.floor(Math.random() * 2) + 1; // 2~3글자
                let genWord = targetChar;
                for(let j = 0; j < randomLen; j++) {
                    genWord += korSyllables[Math.floor(Math.random() * korSyllables.length)];
                }

                // 버튼 생성
                const btn = document.createElement('button');
                btn.className = 'cheat-word-btn';
                btn.innerText = genWord;
                btn.onclick = () => {
                    submitWord(genWord);
                };
                cheatList.appendChild(btn);
            }
        }
    </script>
</body>
      </html>
