v<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>현철 망겜 (Hyunchul Mang-gem)</title>
    <style>
        @font-face {
            font-family: 'DungGeunMo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
        }

        :root {
            --pixel-border: 4px solid #000;
            --panel-bg: rgba(20, 20, 25, 0.95);
            --rarity-common: #ffffff;
            --rarity-rare: #4fa7ff;
            --rarity-legendary: #ffcc00;
            --rarity-secret: #e066ff;
            --rarity-eternal: #ff0055;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #050505;
            color: #fff;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* 메인 컨테이너 */
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            background: #111;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border-left: 2px solid #333;
            border-right: 2px solid #333;
        }

        /* 캔버스 및 레이어 */
        #render-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 70%;
            z-index: 1;
            image-rendering: pixelated;
        }

        #entity-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 70%;
            pointer-events: none;
            z-index: 2;
        }

        /* 고퀄리티 UI 패널 */
        .ui-panel {
            background: var(--panel-bg);
            border: var(--pixel-border);
            box-shadow: inset -4px -4px 0px #333, inset 4px 4px 0px #666;
            padding: 10px;
            box-sizing: border-box;
        }

        #top-hud {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 0 20px;
        }

        #bottom-ui {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 30%;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 10px;
            gap: 10px;
            box-sizing: border-box;
            background: #1a1a1a;
            border-top: 4px solid #444;
        }

        /* 버튼 디자인 */
        .pixel-btn {
            background: #444;
            border: var(--pixel-border);
            box-shadow: inset -4px -4px 0px #222, inset 4px 4px 0px #777;
            color: white;
            padding: 10px;
            font-family: 'DungGeunMo';
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .pixel-btn:active { transform: scale(0.95); background: #333; }
        .pixel-btn.primary { background: #2a52be; box-shadow: inset -4px -4px 0px #1a328e, inset 4px 4px 0px #4a72de; }

        /* 타이틀 화면 */
        #screen-title {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, #000, #1a0a2a);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .main-logo {
            font-size: 4rem;
            color: var(--rarity-eternal);
            text-shadow: 6px 6px 0px #000;
            margin-bottom: 40px;
            animation: pulse 2s infinite;
        }

        /* 몬스터 & 영웅 스프라이트 (GIF 적용) */
        .entity {
            position: absolute;
            transform: translate(-50%, -100%);
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            transition: top 0.1s linear, left 0.1s linear;
        }

        .hp-bar-wrap {
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 6px;
            background: #000;
            border: 1px solid #fff;
        }
        .hp-bar-fill { height: 100%; background: #ff3e3e; }

        /* 모달 (수학 문제) */
        #modal-overlay {
            position: absolute;
            inset: 0; background: rgba(0,0,0,0.8);
            z-index: 200; display: none;
            align-items: center; justify-content: center;
        }

        #math-modal {
            width: 85%;
            max-width: 400px;
            text-align: center;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .hidden { display: none !important; }
        .stat-label { font-size: 0.8rem; color: #aaa; margin-right: 5px; }
        .stat-value { font-size: 1.2rem; color: var(--rarity-legendary); }

    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- 타이틀 화면 -->
    <div id="screen-title">
        <div class="main-logo">현철 망겜</div>
        <div style="font-size: 1.2rem; color: #ccc; margin-bottom: 50px;">ANOTHER PIXEL DEFENSE</div>
        <div class="pixel-btn primary" style="width: 250px; margin-bottom: 15px;" onclick="startGame('student')">학생 모드 (수학)</div>
        <div class="pixel-btn" style="width: 250px;" onclick="startGame('normal')">일반 모드</div>
    </div>

    <!-- 학년/단원 선택 (학생 모드용) -->
    <div id="screen-setup" class="screen-title hidden" style="background: rgba(0,0,0,0.9); z-index: 90;">
        <h2 id="setup-title">단원 선택</h2>
        <div id="setup-options" style="display: grid; grid-template-columns: 1fr; gap: 10px; width: 80%;"></div>
    </div>

    <!-- 인게임 HUD -->
    <div id="top-hud" class="ui-panel">
        <div><span class="stat-label">WAVE</span><span id="wave-val" class="stat-value">1</span></div>
        <div><span class="stat-label">GOLD</span><span id="gold-val" class="stat-value" style="color: gold;">500</span></div>
        <div><span class="stat-label">HP</span><span id="hp-val" class="stat-value" style="color: #ff3e3e;">10</span></div>
    </div>

    <!-- 게임 렌더링 영역 -->
    <canvas id="render-layer"></canvas>
    <div id="entity-layer"></div>

    <!-- 하단 컨트롤 -->
    <div id="bottom-ui">
        <div class="pixel-btn primary" onclick="handleSummonClick()">
            <div style="text-align: center;">
                <div style="font-size: 0.8rem;">영웅 소환</div>
                <div style="font-size: 1.2rem;">✨ 200 G</div>
            </div>
        </div>
        <div class="pixel-btn" onclick="cycleSpeed()">
            <div id="speed-btn-txt">속도 x1</div>
        </div>
        <div class="pixel-btn" style="grid-column: span 2;" onclick="location.reload()">
            데이터 초기화 및 종료
        </div>
    </div>

    <!-- 수학 문제 모달 -->
    <div id="modal-overlay">
        <div id="math-modal" class="ui-panel">
            <div style="color: #aaa; margin-bottom: 10px;">소환 검증 - 6학년 수학</div>
            <div id="question-text" style="font-size: 1.5rem; margin: 20px 0; color: #fff;"></div>
            <div id="answer-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
        </div>
    </div>
</div>

<script>
/**
 * DB & CONFIG
 */
const ASSETS = {
    hero_basic: "animation.gif",      // 나무검 용사
    hero_rare_1: "animation-10.gif",   // 어둠의 칼날
    hero_rare_2: "animation-11.gif",   // 그림자 추격자
    hero_legendary: "animation-9.gif", // 심연의 군주
    hero_secret_1: "animation-1.gif",  // 공허의 목격자
    hero_secret_2: "animation-8.gif",  // 밤의 지배자
    hero_eternal: "animation-2.gif"    // 절대적 암흑 성채
};

const HERO_DATA = [
    { id: 'basic', name: '나무검 용사', rarity: 'COMMON', color: '#fff', dmg: 15, range: 120, spd: 1.0, img: ASSETS.hero_basic },
    { id: 'rare1', name: '어둠의 칼날', rarity: 'RARE', color: '#4fa7ff', dmg: 35, range: 130, spd: 0.8, img: ASSETS.hero_rare_1 },
    { id: 'rare2', name: '그림자 추격자', rarity: 'RARE', color: '#4fa7ff', dmg: 28, range: 220, spd: 0.6, img: ASSETS.hero_rare_2 },
    { id: 'legendary', name: '심연의 군주', rarity: 'LEGENDARY', color: '#ffcc00', dmg: 85, range: 160, spd: 1.2, img: ASSETS.hero_legendary },
    { id: 'secret1', name: '공허의 목격자', rarity: 'SECRET', color: '#e066ff', dmg: 160, range: 200, spd: 1.4, img: ASSETS.hero_secret_1 },
    { id: 'secret2', name: '밤의 지배자', rarity: 'SECRET', color: '#e066ff', dmg: 190, range: 150, spd: 0.9, img: ASSETS.hero_secret_2 },
    { id: 'eternal', name: '절대적 암흑', rarity: 'ETERNAL', color: '#ff0055', dmg: 600, range: 280, spd: 0.4, img: ASSETS.hero_eternal }
];

/**
 * GAME ENGINE STATE
 */
let state = {
    mode: 'normal',
    unit: 'all',
    gold: 500,
    hp: 10,
    wave: 1,
    speed: 1,
    isGameOver: false,
    enemies: [],
    heroes: [],
    projectiles: [],
    lastTime: performance.now(),
    spawnCount: 0,
    maxSpawn: 5,
    spawnTimer: 0,
    slots: [
        {x: 100, y: 150, occupied: false}, {x: 300, y: 150, occupied: false}, {x: 500, y: 150, occupied: false},
        {x: 150, y: 380, occupied: false}, {x: 450, y: 380, occupied: false}
    ]
};

const canvas = document.getElementById('render-layer');
const ctx = canvas.getContext('2d');
const entityLayer = document.getElementById('entity-layer');

function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
}
window.addEventListener('resize', resize);
resize();

/**
 * MATH SYSTEM
 */
function getQuestion() {
    let q = "", a = "", opts = [];
    const type = Math.random() > 0.5 ? 'frac' : 'dec';
    
    if (type === 'frac') {
        let n1 = rInt(1, 5), d1 = rInt(2, 6), n2 = rInt(1, 5), d2 = rInt(2, 6);
        q = `(${n1}/${d1}) ÷ (${n2}/${d2}) = ?`;
        let upper = n1 * d2, lower = d1 * n2;
        a = `${upper}/${lower}`;
        opts = [a, `${n1*n2}/${d1*d2}`, `${upper+1}/${lower}`, `${upper}/${lower+2}`];
    } else {
        let v1 = (Math.random() * 5 + 1).toFixed(1);
        let v2 = rInt(2, 5);
        q = `${v1} ÷ ${v2} = ?`;
        a = (v1 / v2).toFixed(2);
        opts = [a, (v1/v2 + 0.1).toFixed(2), (v1*v2).toFixed(1), "0.25"];
    }
    return { q, a, opts: opts.sort(() => Math.random() - 0.5) };
}

function rInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

/**
 * GAME CORE FUNCTIONS
 */
function startGame(mode) {
    state.mode = mode;
    document.getElementById('screen-title').classList.add('hidden');
    
    if (mode === 'student') {
        showSetup();
    } else {
        initGame();
    }
}

function showSetup() {
    const setup = document.getElementById('screen-setup');
    const opts = document.getElementById('setup-options');
    setup.classList.remove('hidden');
    opts.innerHTML = '';
    
    ['분수의 나눗셈', '소수의 나눗셈', '비와 비율', '전체 단원'].forEach(u => {
        const b = document.createElement('div');
        b.className = 'pixel-btn';
        b.innerText = u;
        b.onclick = () => {
            state.unit = u;
            setup.classList.add('hidden');
            initGame();
        };
        opts.appendChild(b);
    });
}

function initGame() {
    updateHUD();
    requestAnimationFrame(gameLoop);
}

function handleSummonClick() {
    if (state.gold < 200) return alert("골드가 부족합니다!");
    
    if (state.mode === 'student') {
        const quest = getQuestion();
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('question-text').innerText = quest.q;
        const grid = document.getElementById('answer-grid');
        grid.innerHTML = '';
        quest.opts.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'pixel-btn';
            b.innerText = opt;
            b.onclick = () => {
                if (opt == quest.a) {
                    state.gold -= 200;
                    summonHero();
                } else {
                    alert("오답입니다! 소환 실패.");
                }
                document.getElementById('modal-overlay').style.display = 'none';
                updateHUD();
            };
            grid.appendChild(b);
        });
    } else {
        state.gold -= 200;
        summonHero();
        updateHUD();
    }
}

function summonHero() {
    const slot = state.slots.find(s => !s.occupied);
    if (!slot) return alert("배치 공간이 부족합니다!");

    const rand = Math.random() * 100;
    let template;
    if (rand < 2) template = HERO_DATA[6];      // Eternal 2%
    else if (rand < 8) template = HERO_DATA[rInt(4, 5)]; // Secret 6%
    else if (rand < 18) template = HERO_DATA[3]; // Legendary 10%
    else if (rand < 45) template = HERO_DATA[rInt(1, 2)]; // Rare 27%
    else template = HERO_DATA[0];               // Common 55%

    const el = document.createElement('img');
    el.src = template.img;
    el.className = 'entity';
    el.style.left = slot.x + 'px';
    el.style.top = slot.y + 'px';
    entityLayer.appendChild(el);

    state.heroes.push({
        ...template,
        x: slot.x, y: slot.y,
        el: el,
        lastAttack: 0
    });
    slot.occupied = true;
}

function cycleSpeed() {
    state.speed = state.speed >= 3 ? 1 : state.speed + 1;
    document.getElementById('speed-btn-txt').innerText = `속도 x${state.speed}`;
}

/**
 * MAIN LOOP
 */
function gameLoop(now) {
    const dt = (now - state.lastTime) / 1000 * state.speed;
    state.lastTime = now;

    if (!state.isGameOver) {
        update(dt);
    }
    render();
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    // 적 생성
    state.spawnTimer += dt;
    if (state.spawnCount < state.maxSpawn && state.spawnTimer > 2.0) {
        spawnEnemy();
        state.spawnTimer = 0;
    }

    // 적 이동
    state.enemies.forEach((en, i) => {
        en.x += en.speed * dt;
        en.el.style.left = en.x + 'px';
        if (en.x > canvas.width) {
            state.hp--;
            en.el.remove();
            state.enemies.splice(i, 1);
            updateHUD();
        }
    });

    // 영웅 공격
    state.heroes.forEach(h => {
        h.lastAttack += dt;
        if (h.lastAttack >= h.spd) {
            const target = state.enemies.find(en => Math.hypot(en.x - h.x, en.y - h.y) < h.range);
            if (target) {
                shoot(h, target);
                h.lastAttack = 0;
            }
        }
    });

    // 투사체 처리
    state.projectiles.forEach((p, i) => {
        const dx = p.tx - p.x, dy = p.ty - p.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 10) {
            p.target.hp -= p.dmg;
            p.target.hpEl.style.width = Math.max(0, (p.target.hp / p.target.maxHp) * 100) + '%';
            if (p.target.hp <= 0) {
                const enIdx = state.enemies.indexOf(p.target);
                if (enIdx > -1) {
                    p.target.el.remove();
                    state.enemies.splice(enIdx, 1);
                    state.gold += 30;
                    updateHUD();
                }
            }
            state.projectiles.splice(i, 1);
        } else {
            p.x += (dx/dist) * 400 * dt;
            p.y += (dy/dist) * 400 * dt;
        }
    });

    // 웨이브 클리어
    if (state.spawnCount >= state.maxSpawn && state.enemies.length === 0) {
        state.wave++;
        state.maxSpawn += 2;
        state.spawnCount = 0;
        state.gold += 150;
        updateHUD();
    }
}

function spawnEnemy() {
    const el = document.createElement('div');
    el.className = 'entity';
    el.style.background = '#555';
    el.style.border = '2px solid #f00';
    el.style.width = '30px'; el.style.height = '30px';
    el.innerHTML = `<div class="hp-bar-wrap"><div class="hp-bar-fill"></div></div>`;
    entityLayer.appendChild(el);

    const hp = 50 + state.wave * 40;
    state.enemies.push({
        x: 0, y: 280, speed: 50 + state.wave * 5,
        hp: hp, maxHp: hp,
        el: el, hpEl: el.querySelector('.hp-bar-fill')
    });
    state.spawnCount++;
}

function shoot(h, t) {
    state.projectiles.push({
        x: h.x, y: h.y - 30, tx: t.x, ty: t.y - 15,
        dmg: h.dmg, target: t
    });
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 배경 길 그리기
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 250, canvas.width, 60);
    ctx.strokeStyle = "#444";
    ctx.setLineDash([10, 5]);
    ctx.strokeRect(0, 250, canvas.width, 60);

    // 슬롯 그리기
    state.slots.forEach(s => {
        ctx.fillStyle = s.occupied ? "rgba(255,255,255,0.1)" : "rgba(255,255,255,0.3)";
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, 30, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    });

    // 투사체 그리기
    state.projectiles.forEach(p => {
        ctx.fillStyle = "#ffff00";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "yellow";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    });
}

function updateHUD() {
    document.getElementById('wave-val').innerText = state.wave;
    document.getElementById('gold-val').innerText = state.gold;
    document.getElementById('hp-val').innerText = state.hp;
}

</script>
</body>
</html>
