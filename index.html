<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ECLIPSE ONLINE</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070d;
    color:white;
    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
}

button,input{
    font:inherit;
}

button{
    border:0;
    color:white;
    cursor:pointer;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#08131a;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ================================
   START SCREEN
================================ */

#startScreen{
    position:absolute;
    inset:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 35%,
            #263d75 0%,
            #11182e 35%,
            #05070e 75%
        );
}

.startBox{
    width:min(430px,92vw);
    padding:34px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            #111a2df5,
            #070c17f5
        );

    border:1px solid #405071;

    box-shadow:
        0 30px 100px #000c,
        inset 0 1px #ffffff12;

    text-align:center;
}

.logo{
    font-size:45px;
    font-weight:1000;
    letter-spacing:7px;

    background:
        linear-gradient(
            90deg,
            #53dfff,
            #8e6cff,
            #ff6baf
        );

    -webkit-background-clip:text;
    color:transparent;
}

.logoSub{
    margin-top:8px;
    color:#7d8ba9;
    font-size:11px;
    letter-spacing:5px;
}

.nameInput{
    width:100%;
    height:52px;

    margin-top:30px;

    border-radius:15px;

    border:1px solid #34415e;

    background:#070c16;

    outline:none;

    color:white;

    padding:0 15px;

    text-align:center;
}

.nameInput:focus{
    border-color:#6b7dff;
}

.startButton{
    width:100%;
    height:54px;

    margin-top:12px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #506cff,
            #7d55ff
        );

    font-weight:900;

    box-shadow:
        0 12px 35px #596cff44;
}

.startButton:active{
    transform:scale(.98);
}

.connectionInfo{
    margin-top:18px;

    font-size:10px;
    color:#65718a;
    line-height:1.7;
}

/* ================================
   HUD
================================ */

#hud{
    position:absolute;
    inset:0;
    z-index:20;
    pointer-events:none;
}

.playerCard{
    position:absolute;
    top:14px;
    left:14px;

    width:285px;

    padding:12px;

    border-radius:18px;

    background:#0a1220dd;

    border:1px solid #293854;

    box-shadow:0 15px 40px #0008;

    backdrop-filter:blur(12px);
}

.playerTop{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:44px;
    height:44px;

    border-radius:14px;

    display:grid;
    place-items:center;

    background:
        linear-gradient(
            135deg,
            #4d8cff,
            #774fff
        );

    font-size:23px;
}

.playerName{
    font-weight:900;
    font-size:14px;
}

.level{
    color:#8490aa;
    font-size:10px;
    margin-top:3px;
}

.bar{
    height:7px;
    margin-top:8px;

    border-radius:20px;

    background:#252d40;
    overflow:hidden;
}

.fill{
    height:100%;
    transition:.2s;
}

.hp{
    background:linear-gradient(
        90deg,
        #ff405d,
        #ff7588
    );
}

.mp{
    background:linear-gradient(
        90deg,
        #3c87ff,
        #65c0ff
    );
}

.exp{
    background:linear-gradient(
        90deg,
        #9a58ff,
        #e15dff
    );
}

.barInfo{
    display:flex;
    justify-content:space-between;

    color:#71809d;
    font-size:9px;

    margin-top:3px;
}

/* ================================
   ONLINE
================================ */

.online{
    position:absolute;
    top:14px;
    right:14px;

    padding:9px 13px;

    border-radius:99px;

    background:#09111ddd;

    border:1px solid #293650;

    display:flex;
    align-items:center;
    gap:8px;

    font-size:10px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#747b8a;
}

.dot.on{
    background:#37e590;
    box-shadow:0 0 12px #37e590;
}

/* ================================
   QUEST
================================ */

.quest{
    position:absolute;
    top:105px;
    right:14px;

    width:250px;

    padding:14px;

    border-radius:17px;

    background:#091221dd;

    border:1px solid #2a3752;

    box-shadow:0 15px 35px #0007;
}

.questTitle{
    color:#ffd65c;
    font-size:10px;
    font-weight:900;
}

.questName{
    margin-top:7px;
    font-weight:900;
}

.questDesc{
    margin-top:5px;

    color:#7987a3;
    font-size:10px;
    line-height:1.5;
}

/* ================================
   BOTTOM
================================ */

.bottom{
    position:absolute;
    left:14px;
    right:14px;
    bottom:14px;

    display:flex;
    justify-content:space-between;
    align-items:end;
}

/* ================================
   SKILLS
================================ */

.skills{
    display:flex;
    gap:7px;

    pointer-events:auto;
}

.skill{
    width:59px;
    height:59px;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            #1b2944,
            #0c1424
        );

    border:1px solid #394967;

    box-shadow:
        0 10px 30px #000a,
        inset 0 1px #ffffff10;

    position:relative;

    display:grid;
    place-items:center;

    font-size:23px;
}

.skill:active{
    transform:scale(.9);
}

.skillKey{
    position:absolute;
    bottom:4px;
    left:6px;

    color:#8290aa;
    font-size:8px;
}

/* ================================
   MENU
================================ */

.menu{
    width:55px;
    height:55px;

    border-radius:17px;

    background:#0d1728e8;

    border:1px solid #34415d;

    pointer-events:auto;

    font-size:21px;
}

/* ================================
   JOYSTICK
================================ */

#mobile{
    position:absolute;
    inset:0;
    z-index:30;

    pointer-events:none;
}

.joystick{
    position:absolute;

    left:20px;
    bottom:100px;

    width:115px;
    height:115px;

    border-radius:50%;

    background:#ffffff0b;

    border:1px solid #ffffff16;

    pointer-events:auto;

    touch-action:none;
}

.knob{
    position:absolute;

    left:50%;
    top:50%;

    width:50px;
    height:50px;

    border-radius:50%;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            #ffffff45,
            #ffffff10
        );

    border:1px solid #ffffff25;
}

.actions{
    position:absolute;

    right:18px;
    bottom:95px;

    display:grid;
    grid-template-columns:repeat(2,62px);

    gap:9px;

    pointer-events:auto;
}

.action{
    width:62px;
    height:62px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #344c7a,
            #10192d
        );

    border:1px solid #4a5a7c;

    box-shadow:0 10px 30px #000a;

    font-size:21px;
}

.action:active{
    transform:scale(.88);
}

/* ================================
   CHAT
================================ */

.chat{
    position:absolute;

    left:14px;
    bottom:88px;

    width:300px;

    pointer-events:auto;
}

.chatList{
    max-height:120px;

    overflow:hidden;

    display:flex;
    flex-direction:column;
    gap:4px;
}

.chatMsg{
    width:max-content;
    max-width:100%;

    padding:5px 9px;

    border-radius:8px;

    background:#060d18d9;

    color:#ccd4e5;

    font-size:10px;
}

.chatInput{
    display:flex;
    gap:5px;
    margin-top:5px;
}

.chatInput input{
    flex:1;

    height:31px;

    background:#070e19e8;

    border:1px solid #293752;

    border-radius:9px;

    color:white;

    outline:none;

    padding:0 9px;

    font-size:10px;
}

.chatInput button{
    width:40px;
    border-radius:9px;

    background:#536dff;
}

/* ================================
   LOGIN / ROOM
================================ */

#roomPanel{
    position:absolute;
    inset:0;

    z-index:500;

    display:none;
    align-items:center;
    justify-content:center;

    background:#03060caa;

    backdrop-filter:blur(8px);

    pointer-events:auto;
}

.roomBox{
    width:min(420px,92vw);

    padding:25px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #121c31fa,
            #070d18fa
        );

    border:1px solid #3b4a6b;

    box-shadow:0 30px 100px #000d;
}

.roomTitle{
    font-size:20px;
    font-weight:1000;
}

.roomText{
    margin-top:7px;
    color:#75829e;
    font-size:11px;
}

.roomInput{
    width:100%;
    height:45px;

    margin-top:16px;

    border-radius:12px;

    background:#070d17;

    border:1px solid #33425e;

    color:white;

    outline:none;

    padding:0 12px;

    text-align:center;
}

.roomButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;

    margin-top:9px;
}

.roomBtn{
    height:45px;

    border-radius:12px;

    background:#1b2942;

    border:1px solid #344866;
}

.roomBtn.primary{
    background:
        linear-gradient(
            135deg,
            #506dff,
            #7954ff
        );
}

/* ================================
   NOTIFICATION
================================ */

#notice{
    position:absolute;

    left:50%;
    top:45%;

    transform:
        translate(-50%,-50%)
        scale(.9);

    opacity:0;

    z-index:900;

    padding:14px 24px;

    border-radius:15px;

    background:#111b2ef5;

    border:1px solid #4a5d84;

    box-shadow:0 25px 70px #000b;

    font-size:13px;
    font-weight:900;

    pointer-events:none;

    transition:.2s;
}

#notice.show{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

/* ================================
   DAMAGE
================================ */

.damage{
    position:absolute;

    z-index:100;

    color:#ffe06b;

    font-weight:1000;

    font-size:17px;

    pointer-events:none;

    text-shadow:0 2px 6px #000;

    animation:damage .7s forwards;
}

@keyframes damage{
    from{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1);
    }

    to{
        opacity:0;
        transform:
            translate(-50%,-55px)
            scale(1.2);
    }
}

/* ================================
   RESPONSIVE
================================ */

@media(max-width:700px){

    .playerCard{
        width:215px;
        top:9px;
        left:9px;
    }

    .quest{
        width:185px;
        right:9px;
        top:88px;
    }

    .chat{
        display:none;
    }

    .skill{
        width:50px;
        height:50px;
    }

    .skills{
        gap:5px;
    }

    .actions{
        right:12px;
        bottom:90px;

        grid-template-columns:
            repeat(2,56px);
    }

    .action{
        width:56px;
        height:56px;
    }

    .joystick{
        width:105px;
        height:105px;
        bottom:90px;
        left:15px;
    }
}

</style>
</head>

<body>

<script>

/* =========================================================
   CORE
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W =
    innerWidth;

let H =
    innerHeight;

function resize(){

    W=innerWidth;
    H=innerHeight;

    const dpr =
        Math.min(
            devicePixelRatio || 1,
            2
        );

    canvas.width =
        W*dpr;

    canvas.height =
        H*dpr;

    canvas.style.width =
        W+"px";

    canvas.style.height =
        H+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   GAME
========================================================= */

const game={

    started:false,

    peer:null,

    connections:[],

    isHost:false,

    roomId:null,

    world:{
        width:2400,
        height:1600
    },

    camera:{
        x:0,
        y:0
    },

    keys:{},

    joystick:{
        x:0,
        y:0
    },

    player:{

        id:null,

        name:"모험가",

        x:1200,

        y:450,

        speed:230,

        hp:100,

        maxHp:100,

        mp:50,

        maxMp:50,

        level:1,

        exp:0,

        need:100,

        gold:250,

        attack:12,

        defense:5,

        attackCooldown:0,

        invincible:0

    },

    otherPlayers:new Map(),

    monsters:[],

    effects:[],

    questKills:0,

    monsterTimer:0

};


/* =========================================================
   SAFE STORAGE
========================================================= */

const SafeStorage={

    memory:{},

    enabled:false,

    init(){

        try{

            const key=
                "__eclipse_test__";

            window.localStorage
                .setItem(
                    key,
                    "1"
                );

            window.localStorage
                .removeItem(key);

            this.enabled=true;

        }catch{

            this.enabled=false;
        }
    },

    get(key){

        if(this.enabled){

            try{

                return localStorage
                    .getItem(key);

            }catch{}
        }

        return this.memory[key] || null;
    },

    set(key,value){

        if(this.enabled){

            try{

                localStorage
                    .setItem(
                        key,
                        value
                    );

                return;

            }catch{}
        }

        this.memory[key]=value;
    }

};

SafeStorage.init();


/* =========================================================
   ENTER GAME
========================================================= */

function enterGame(){

    let name =
        document
        .getElementById(
            "nameInput"
        )
        .value
        .trim();

    if(!name)
        name="모험가";

    game.player.name =
        name;

    game.player.id =
        "p_"+Math.random()
        .toString(36)
        .slice(2,10);

    document
        .getElementById(
            "playerName"
        )
        .textContent=name;

    document
        .getElementById(
            "startScreen"
        )
        .style.display="none";

    game.started=true;

    spawnInitialMonsters();

    showNotice(
        "🌙 ECLIPSE ONLINE에 입장했습니다."
    );

    addChat(
        "SYSTEM",
        "숲의 모험을 시작하세요!"
    );

    updateHUD();
}


/* =========================================================
   WORLD
========================================================= */

function drawWorld(){

    ctx.fillStyle=
        "#102f2a";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const tile=80;


    for(
        let y=
            Math.floor(
                game.camera.y/tile
            )*tile;

        y<
            game.camera.y+
            H+
            tile;

        y+=tile
    ){

        for(
            let x=
                Math.floor(
                    game.camera.x/tile
                )*tile;

            x<
                game.camera.x+
                W+
                tile;

            x+=tile
        ){

            const sx=
                x-game.camera.x;

            const sy=
                y-game.camera.y;


            ctx.fillStyle=
                ((x/tile+y/tile)%2===0)
                ?
                "#12372f"
                :
                "#11332e";

            ctx.fillRect(
                sx,
                sy,
                tile,
                tile
            );


            ctx.fillStyle=
                "#1d4a3c";

            for(
                let i=0;
                i<3;
                i++
            ){

                const gx=
                    sx+
                    ((x*17+
                      i*31)%70);

                const gy=
                    sy+
                    ((y*11+
                      i*17)%70);

                ctx.fillRect(
                    gx,
                    gy,
                    2,
                    7
                );
            }
        }
    }


    /*
        길
    */

    const road=
        1120-
        game.camera.x;

    ctx.fillStyle=
        "#675747";

    ctx.fillRect(
        road,
        -game.camera.y,
        160,
        game.world.height
    );


    ctx.fillStyle=
        "#89725a";

    for(
        let y=0;
        y<game.world.height;
        y+=65
    ){

        ctx.fillRect(
            road+74,

/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(dt){

    const p=
        game.player;

    let dx=0;
    let dy=0;


    if(
        game.keys.w ||
        game.keys.arrowup
    )
        dy--;

    if(
        game.keys.s ||
        game.keys.arrowdown
    )
        dy++;

    if(
        game.keys.a ||
        game.keys.arrowleft
    )
        dx--;

    if(
        game.keys.d ||
        game.keys.arrowright
    )
        dx++;


    dx+=
        game.joystick.x;

    dy+=
        game.joystick.y;


    if(
        dx!==0 ||
        dy!==0
    ){

        const length=
            Math.hypot(
                dx,
                dy
            );

        dx/=length;
        dy/=length;


        p.x+=
            dx*
            p.speed*
            dt;

        p.y+=
            dy*
            p.speed*
            dt;


        p.x=
            Math.max(
                30,
                Math.min(
                    game.world.width-30,
                    p.x
                )
            );

        p.y=
            Math.max(
                30,
                Math.min(
                    game.world.height-30,
                    p.y
                )
            );
    }


    p.attackCooldown=
        Math.max(
            0,
            p.attackCooldown-dt
        );

    p.invincible=
        Math.max(
            0,
            p.invincible-dt
        );


    /*
        camera
    */

    game.camera.x=
        p.x-W/2;

    game.camera.y=
        p.y-H/2;


    game.camera.x=
        Math.max(
            0,
            Math.min(
                game.world.width-W,
                game.camera.x
            )
        );

    game.camera.y=
        Math.max(
            0,
            Math.min(
                game.world.height-H,
                game.camera.y
            )
        );
}


/* =========================================================
   MONSTER AI
========================================================= */

function updateMonsters(dt){

    const p=
        game.player;


    for(
        const m of game.monsters
    ){

        const dx=
            p.x-m.x;

        const dy=
            p.y-m.y;

        const distance=
            Math.hypot(
                dx,
                dy
            );


        if(
            distance<500 &&
            distance>45
        ){

            m.x+=
                dx/distance*
                m.speed*
                dt;

            m.y+=
                dy/distance*
                m.speed*
                dt;
        }


        if(
            distance<=45 &&
            m.attackCooldown<=0
        ){

            const damage=
                Math.max(
                    1,
                    8-p.defense
                );

            damagePlayer(
                damage
            );

            m.attackCooldown=
                1.2;
        }


        m.attackCooldown=
            Math.max(
                0,
                m.attackCooldown-dt
            );
    }
}


/* =========================================================
   DAMAGE PLAYER
========================================================= */

function damagePlayer(
    damage
){

    const p=
        game.player;

    if(
        p.invincible>0
    )
        return;


    p.hp=
        Math.max(
            0,
            p.hp-damage
        );

    p.invincible=
        .35;


    updateHUD();


    if(
        p.hp<=0
    ){

        p.x=1200;
        p.y=450;

        p.hp=p.maxHp;
        p.mp=p.maxMp;

        showNotice(
            "💀 쓰러졌습니다!"
        );
    }
}


/* =========================================================
   ATTACK
========================================================= */

function attack(){

    const p=
        game.player;


    if(
        p.attackCooldown>0
    )
        return;


    p.attackCooldown=
        .4;


    let target=null;
    let distance=Infinity;


    for(
        const m
        of game.monsters
    ){

        const d=
            Math.hypot(
                m.x-p.x,
                m.y-p.y
            );


        if(
            d<90 &&
            d<distance
        ){

            distance=d;
            target=m;
        }
    }


    addEffect(
        p.x,
        p.y,
        "slash"
    );


    if(!target)
        return;


    const damage=
        p.attack+
        Math.floor(
            Math.random()*6
        );


    target.hp-=
        damage;


    damagePopup(
        target.x,
        target.y,
        damage
    );


    if(
        target.hp<=0
    ){

        killMonster(
            target
        );
    }
}


/* =========================================================
   KILL
========================================================= */

function killMonster(
    monster
){

    const index=
        game.monsters.indexOf(
            monster
        );


    if(index!==-1){

        game.monsters.splice(
            index,
            1
        );
    }


    const gold=
        15+
        Math.floor(
            Math.random()*20
        );


    const exp=
        25+
        Math.floor(
            Math.random()*15
        );


    game.player.gold+=
        gold;


    gainExp(
        exp
    );


    game.questKills++;


    if(
        game.questKills>=5
    ){

        game.questKills=0;

        game.player.gold+=100;

        gainExp(100);

        showNotice(
            "📜 퀘스트 완료! +100 Gold"
        );
    }


    updateHUD();


    setTimeout(
        spawnMonster,
        500
    );
}


/* =========================================================
   EXP
========================================================= */

function gainExp(
    amount
){

    const p=
        game.player;


    p.exp+=amount;


    while(
        p.exp>=p.need
    ){

        p.exp-=
            p.need;

        p.level++;

        p.need=
            Math.floor(
                p.need*1.35
            );

        p.maxHp+=20;
        p.maxMp+=10;

        p.attack+=4;
        p.defense+=2;

        p.hp=p.maxHp;
        p.mp=p.maxMp;


        showNotice(
            "✨ LEVEL UP! Lv."+p.level
        );
    }
}


/* =========================================================
   SKILLS
========================================================= */

function skill(
    type
){

    const p=
        game.player;


    if(
        type==="attack"
    ){

        attack();

        return;
    }


    if(
        type==="fire"
    ){

        if(
            p.mp<15
        ){

            showNotice(
                "MP가 부족합니다."
            );

            return;
        }


        p.mp-=15;


        addEffect(
            p.x,
            p.y,
            "fire"
        );


        let target=null;
        let best=Infinity;


        for(
            const m
            of game.monsters
        ){

            const d=
                Math.hypot(
                    m.x-p.x,
                    m.y-p.y
                );


            if(
                d<280 &&
                d<best
            ){

                best=d;
                target=m;
            }
        }


        if(target){

            const damage=
                30+
                p.attack*2;


            target.hp-=
                damage;


            damagePopup(
                target.x,
                target.y,
                damage
            );


            if(
                target.hp<=0
            )
                killMonster(
                    target
                );
        }


        updateHUD();

        return;
    }


    if(
        type==="ice"
    ){

        if(
            p.mp<12
        ){

            showNotice(
                "MP가 부족합니다."
            );

            return;
        }


        p.mp-=12;


        addEffect(
            p.x,
            p.y,
            "ice"
        );


        for(
            const m
            of game.monsters
        ){

            if(
                Math.hypot(
                    m.x-p.x,
                    m.y-p.y
                )<190
            ){

                m.hp-=20;

                m.speed=20;

                setTimeout(
                    ()=>{
                        m.speed=55;
                    },
                    1500
                );


                damagePopup(
                    m.x,
                    m.y,
                    20
                );


                if(
                    m.hp<=0
                )
                    killMonster(
                        m
                    );
            }
        }


        updateHUD();

        return;
    }


    if(
        type==="heal"
    ){

        if(
            p.mp<20
        ){

            showNotice(
                "MP가 부족합니다."
            );

            return;
        }


        p.mp-=20;


        p.hp=
            Math.min(
                p.maxHp,
                p.hp+40
            );


        addEffect(
            p.x,
            p.y,
            "heal"
        );


        updateHUD();
    }
}


/* =========================================================
   EFFECT
========================================================= */

function addEffect(
    x,
    y,
    type
){

    game.effects.push({

        x,
        y,
        type,

        life:.5,
        maxLife:.5
    });
}


function drawEffects(){

    for(
        let i=
            game.effects.length-1;

        i>=0;

        i--
    ){

        const e=
            game.effects[i];


        e.life-=.016;


        if(
            e.life<=0
        ){

            game.effects.splice(
                i,
                1
            );

            continue;
        }


        const x=
            e.x-game.camera.x;

        const y=
            e.y-game.camera.y;


        ctx.globalAlpha=
            e.life/e.maxLife;


        if(
            e.type==="slash"
        ){

            ctx.strokeStyle=
                "#ffffff";

            ctx.lineWidth=6;

            ctx.beginPath();

            ctx.moveTo(
                x-30,
                y+25
            );

            ctx.lineTo(
                x+30,
                y-25
            );

            ctx.stroke();
        }


        if(
            e.type==="fire"
        ){

            ctx.strokeStyle=
                "#ff653c";

            ctx.lineWidth=6;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                100*
                (1-e.life/e.maxLife),
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        if(
            e.type==="ice"
        ){

            ctx.strokeStyle=
                "#60ddff";

            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                180*
                (1-e.life/e.maxLife),
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        if(
            e.type==="heal"
        ){

            ctx.strokeStyle=
                "#55ff9b";

            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                70*
                (1-e.life/e.maxLife),
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        ctx.globalAlpha=1;
    }
}

/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const knob=
    document.getElementById(
        "knob"
    );


let joystickActive=false;


function moveJoystick(
    x,
    y
){

    const rect=
        joystick.getBoundingClientRect();


    const cx=
        rect.left+
        rect.width/2;

    const cy=
        rect.top+
        rect.height/2;


    let dx=
        x-cx;

    let dy=
        y-cy;


    const max=
        rect.width/2-25;


    const distance=
        Math.hypot(
            dx,
            dy
        );


    if(
        distance>max
    ){

        dx=
            dx/distance*max;

        dy=
            dy/distance*max;
    }


    game.joystick.x=
        dx/max;

    game.joystick.y=
        dy/max;


    knob.style.transform=
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;
}


joystick.addEventListener(
    "pointerdown",
    e=>{

        joystickActive=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        moveJoystick(
            e.clientX,
            e.clientY
        );
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            !joystickActive
        )
            return;


        moveJoystick(
            e.clientX,
            e.clientY
        );
    }
);


function resetJoystick(){

    joystickActive=false;

    game.joystick.x=0;
    game.joystick.y=0;

    knob.style.transform=
        "translate(-50%,-50%)";
}


joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


/* =========================================================
   CHAT
========================================================= */

function addChat(
    name,
    text
){

    const list=
        document
        .getElementById(
            "chatList"
        );


    const el=
        document.createElement(
            "div"
        );


    el.className=
        "chatMsg";


    el.textContent=
        `${name}: ${text}`;


    list.appendChild(el);


    while(
        list.children.length>6
    ){

        list.firstChild.remove();
    }
}


function sendChat(){

    const input=
        document
        .getElementById(
            "chatInput"
        );


    const text=
        input.value.trim();


    if(!text)
        return;


    /*
        온라인 상태면 PeerJS로 전송
    */

    broadcastPeer({

        type:"chat",

        name:
            game.player.name,

        text
    });


    addChat(
        game.player.name,
        text
    );


    input.value="";
}


document
.getElementById(
    "chatInput"
)
.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="Enter"
        )
            sendChat();
    }
);


/* =========================================================
   PEERJS
========================================================= */

function setOnline(
    state,
    text
){

    document
        .getElementById(
            "onlineDot"
        )
        .classList.toggle(
            "on",
            state
        );


    document
        .getElementById(
            "onlineText"
        )
        .textContent=
        text;
}


/* =========================================================
   ROOM
========================================================= */

function openRoom(){

    document
        .getElementById(
            "roomPanel"
        )
        .style.display=
        "flex";
}


function closeRoom(){

    document
        .getElementById(
            "roomPanel"
        )
        .style.display=
        "none";
}


/* =========================================================
   CREATE ROOM
========================================================= */

function createRoom(){

    const roomInput=
        document
        .getElementById(
            "roomId"
        );


    let room=
        roomInput.value.trim();


    if(!room){

        room=
            Math.random()
            .toString(36)
            .substring(
                2,
                8
            )
            .toUpperCase();

        roomInput.value=
            room;
    }


    if(
        game.peer
    ){

        game.peer.destroy();
    }


    const peerId=
        "ECLIPSE_"+room;


    game.isHost=true;

    game.roomId=room;


    game.peer=
        new Peer(
            peerId
        );


    game.peer.on(
        "open",
        id=>{

            setOnline(
                true,
                "방 생성됨"
            );


            showNotice(
                "🌐 방 생성 완료: "+room
            );


            closeRoom();
        }
    );


    game.peer.on(
        "connection",
        conn=>{

            setupConnection(
                conn
            );
        }
    );


    game.peer.on(
        "error",
        err=>{

            console.error(err);

            showNotice(
                "방을 만들 수 없습니다."
            );
        }
    );
}


/* =========================================================
   JOIN ROOM
========================================================= */

function joinRoom(){

    const room=
        document
        .getElementById(
            "roomId"
        )
        .value
        .trim()
        .toUpperCase();


    if(!room){

        showNotice(
            "방 ID를 입력하세요."
        );

        return;
    }


    if(
        game.peer
    )
        game.peer.destroy();


    game.isHost=false;

    game.roomId=room;


    game.peer=
        new Peer();


    game.peer.on(
        "open",
        ()=>{

            const conn=
                game.peer.connect(
                    "ECLIPSE_"+room,
                    {
                        reliable:true
                    }
                );


            setupConnection(
                conn
            );
        }
    );


    game.peer.on(
        "error",
        err=>{

            console.error(err);

            showNotice(
                "방에 참가할 수 없습니다."
            );
        }
    );
}


/* =========================================================
   CONNECTION
========================================================= */

function setupConnection(
    conn
){

    game.connections.push(
        conn
    );


    conn.on(
        "open",
        ()=>{

            setOnline(
                true,
                "온라인"
            );


            conn.send({

                type:"player",

                player:{
                    id:
                        game.player.id,

                    name:
                        game.player.name,

                    x:
                        game.player.x,

                    y:
                        game.player.y
                }
            });


            addChat(
                "SYSTEM",
                "플레이어가 연결되었습니다."
            );
        }
    );


    conn.on(
        "data",
        data=>{

            handlePeerData(
                data,
                conn
            );
        }
    );


    conn.on(
        "close",
        ()=>{

            setOnline(
                game.connections.some(
                    c =>
                        c.open
                ),
                "온라인"
            );
        }
    );
}


/* =========================================================
   PEER DATA
========================================================= */

function handlePeerData(
    data,
    conn
){

    if(
        !data ||
        !data.type
    )
        return;


    if(
        data.type==="player"
    ){

        if(
            data.player.id===
            game.player.id
        )
            return;


        game.otherPlayers.set(
            data.player.id,
            data.player
        );


        /*
            상대방에게 자신의 정보도
            한번 더 전달
        */

        if(
            conn &&
            conn.open
        ){

            conn.send({

                type:"player",

                player:{
                    id:
                        game.player.id,

                    name:
                        game.player.name,

                    x:
                        game.player.x,

                    y:
                        game.player.y
                }
            });
        }

        return;
    }


    if(
        data.type==="position"
    ){

        if(
            data.id===
            game.player.id
        )
            return;


        const p=
            game.otherPlayers.get(
                data.id
            );


        if(p){

            p.x=data.x;
            p.y=data.y;

        }else{

            game.otherPlayers.set(
                data.id,
                {

                    id:data.id,

                    name:
                        data.name ||
                        "플레이어",

                    x:data.x,

                    y:data.y
                }
            );
        }

        return;
    }


    if(
        data.type==="chat"
    ){

        if(
            data.name===
            game.player.name
        )
            return;


        addChat(
            data.name,
            data.text
        );

        return;
    }


    if(
        data.type==="remove"
    ){

        game.otherPlayers.delete(
            data.id
        );
    }
}


/* =========================================================
   BROADCAST PEER
========================================================= */

function broadcastPeer(
    data
){

    for(
        const conn
        of game.connections
    ){

        if(
            conn.open
        ){

            try{

                conn.send(
                    data
                );

            }catch{}
        }
    }
}


/* =========================================================
   POSITION SYNC
========================================================= */

let syncTimer=0;


function syncPosition(dt){

    syncTimer+=dt;


    if(
        syncTimer<.08
    )
        return;


    syncTimer=0;


    broadcastPeer({

        type:"position",

        id:
            game.player.id,

        name:
            game.player.name,

        x:
            game.player.x,

        y:
            game.player.y
    });
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();


function loop(now){

    const dt=
        Math.min(
            .05,
            (now-lastTime)/1000
        );


    lastTime=now;


    if(
        game.started
    ){

        updatePlayer(dt);

        updateMonsters(dt);

        syncPosition(dt);

        updateHUD();

        render();
    }


    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);


/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawWorld();

    drawMonsters();

    drawOtherPlayers();

    drawPlayer();

    drawEffects();
}

    showNotice(

    );
}

updateHUD();
