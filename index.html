<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>현철 망겜: 리마스터 (Merge Defense)</title>
    <style>
        @font-face {
            font-family: 'DungGeunMo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
        }

        :root {
            --bg-color: #0c0c14;
            --panel-bg: #1e1e2e;
            --pixel-border: 4px solid #000;
            --gold: #ffcc00;
            --rarity-0: #ffffff; /* Common */
            --rarity-1: #4fa7ff; /* Rare */
            --rarity-2: #ffcc00; /* Legendary */
            --rarity-3: #e066ff; /* Secret */
            --rarity-4: #ff0055; /* Eternal */
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'DungGeunMo', sans-serif;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* 메인 게임 컨테이너 (데스크탑 대응) */
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px; /* 모바일 비율 고정 */
            background: var(--bg-color);
            border: 4px solid #333;
            box-sizing: border-box;
            display: flex; flex-direction: column;
        }

        /* 상단 HUD */
        #top-hud {
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            background: #252535;
            border-bottom: 4px solid #000;
        }

        .stat-box {
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border: 2px solid #444;
        }

        .stat-label { font-size: 0.7rem; color: #aaa; display: block; }
        .stat-val { font-size: 1.1rem; color: #fff; }

        /* 게임 화면 (전투 구역) */
        #battle-area {
            position: relative;
            flex: 1;
            background: #151520;
            overflow: hidden;
            image-rendering: pixelated;
        }

        #render-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        #entity-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* 하단 인벤토리 (영웅 배치 및 합체 구역) */
        #inventory-area {
            height: 220px;
            background: #252535;
            border-top: 4px solid #000;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            padding: 10px;
        }

        .slot {
            background: #151520;
            border: 3px solid #3f3f51;
            position: relative;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            image-rendering: pixelated;
        }

        .slot.selected { border-color: var(--gold); background: #2a2a40; }
        .slot img { width: 80%; height: 80%; object-fit: contain; }
        .slot .lv-badge {
            position: absolute; bottom: 2px; right: 2px;
            font-size: 0.6rem; background: #000; padding: 2px 4px;
        }

        /* 컨트롤바 */
        #controls {
            padding: 10px;
            display: grid; grid-template-columns: 2fr 1fr; gap: 10px;
            background: #1a1a25;
        }

        .pixel-btn {
            background: #444;
            border: var(--pixel-border);
            box-shadow: inset -4px -4px 0px #222, inset 4px 4px 0px #666;
            color: white; padding: 12px;
            font-family: 'DungGeunMo';
            cursor: pointer; text-align: center;
            transition: transform 0.05s;
        }
        .pixel-btn:active { transform: scale(0.95); }
        .pixel-btn.primary { background: #2a52be; box-shadow: inset -4px -4px 0px #1a328e, inset 4px 4px 0px #4a72de; }

        /* 타이틀 & 모달 */
        .overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
        }

        .hidden { display: none !important; }

        .math-card {
            background: var(--panel-bg);
            border: var(--pixel-border);
            padding: 20px; width: 90%; text-align: center;
        }

        /* 몬스터 체력바 */
        .hp-bar {
            position: absolute; top: -10px; left: 0; width: 32px; height: 4px;
            background: #000; border: 1px solid #fff;
        }
        .hp-fill { height: 100%; background: #ff3e3e; }

    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- 타이틀 화면 -->
    <div id="screen-title" class="overlay">
        <h1 style="font-size: 3rem; color: var(--rarity-4); text-shadow: 4px 4px #000;">현철 망겜</h1>
        <p style="color: #888; margin-bottom: 40px;">MERGE PIXEL DEFENSE</p>
        <button class="pixel-btn primary" style="width: 200px; margin-bottom: 10px;" onclick="startGame('student')">학생 모드 (수학)</button>
        <button class="pixel-btn" style="width: 200px;" onclick="startGame('normal')">일반 모드</button>
    </div>

    <!-- 수학 문제 모달 -->
    <div id="modal-math" class="overlay hidden">
        <div class="math-card">
            <div id="math-type" style="color: var(--gold); margin-bottom: 10px;">소환 검증</div>
            <div id="math-question" style="font-size: 1.5rem; margin-bottom: 20px;">1/2 + 1/4 = ?</div>
            <div id="math-options" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
        </div>
    </div>

    <!-- HUD -->
    <div id="top-hud">
        <div class="stat-box"><span class="stat-label">WAVE</span><span id="txt-wave" class="stat-val">1</span></div>
        <div class="stat-box"><span class="stat-label">GOLD</span><span id="txt-gold" class="stat-val" style="color:var(--gold)">500</span></div>
        <div class="stat-box"><span class="stat-label">LIFE</span><span id="txt-life" class="stat-val" style="color:#ff3e3e">20</span></div>
    </div>

    <!-- 전투 필드 -->
    <div id="battle-area">
        <canvas id="render-canvas"></canvas>
        <div id="entity-layer"></div>
    </div>

    <!-- 영웅 인벤토리 (합체 구역) -->
    <div id="inventory-area">
        <!-- 8개의 슬롯 -->
        <div class="slot" onclick="clickSlot(0)" id="slot-0"></div>
        <div class="slot" onclick="clickSlot(1)" id="slot-1"></div>
        <div class="slot" onclick="clickSlot(2)" id="slot-2"></div>
        <div class="slot" onclick="clickSlot(3)" id="slot-3"></div>
        <div class="slot" onclick="clickSlot(4)" id="slot-4"></div>
        <div class="slot" onclick="clickSlot(5)" id="slot-5"></div>
        <div class="slot" onclick="clickSlot(6)" id="slot-6"></div>
        <div class="slot" onclick="clickSlot(7)" id="slot-7"></div>
    </div>

    <!-- 하단 메뉴 -->
    <div id="controls">
        <button class="pixel-btn primary" onclick="trySummon()">영웅 소환 (G 200)</button>
        <button class="pixel-btn" onclick="toggleSpeed()" id="btn-speed">x1</button>
    </div>
</div>

<script>
/**
 * 설정 및 데이터
 */
const HERO_TEMPLATES = [
    { rank: 0, name: "수습 기사", dmg: 15, range: 120, spd: 1.0, color: '#fff', img: 'https://img.itch.zone/aW1nLzExMzkyMzA3LmdpZg==/original/H6m6m8.gif' },
    { rank: 1, name: "강철 검사", dmg: 40, range: 140, spd: 0.9, color: '#4fa7ff', img: 'https://img.itch.zone/aW1nLzExMzkyMzEwLmdpZg==/original/I%2B6D%2B6.gif' },
    { rank: 2, name: "심연 군주", dmg: 100, range: 160, spd: 0.8, color: '#ffcc00', img: 'https://img.itch.zone/aW1nLzExMzkyMzE1LmdpZg==/original/2Y0f%2BR.gif' },
    { rank: 3, name: "차원 학살자", dmg: 250, range: 190, spd: 1.2, color: '#e066ff', img: 'https://img.itch.zone/aW1nLzExMzkyMzE5LmdpZg==/original/n2R6m4.gif' },
    { rank: 4, name: "절대 신", dmg: 800, range: 250, spd: 0.5, color: '#ff0055', img: 'https://img.itch.zone/aW1nLzExMzkyMzI0LmdpZg==/original/R7%2F7v1.gif' }
];

let gameState = {
    mode: 'normal',
    gold: 500,
    life: 20,
    wave: 1,
    speed: 1,
    slots: Array(8).fill(null), // 슬롯 데이터
    selectedSlot: null,
    enemies: [],
    projectiles: [],
    spawnedInWave: 0,
    maxSpawn: 5,
    timer: 0,
    lastTime: performance.now()
};

const canvas = document.getElementById('render-canvas');
const ctx = canvas.getContext('2d');
const entityLayer = document.getElementById('entity-layer');

/**
 * 초기화 및 엔진
 */
function startGame(mode) {
    gameState.mode = mode;
    document.getElementById('screen-title').classList.add('hidden');
    resize();
    requestAnimationFrame(gameLoop);
}

function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
}
window.addEventListener('resize', resize);

function gameLoop(now) {
    const dt = (now - gameState.lastTime) / 1000 * gameState.speed;
    gameState.lastTime = now;

    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}

/**
 * 게임 로직
 */
function update(dt) {
    if (gameState.life <= 0) return;

    // 몬스터 소환
    gameState.timer += dt;
    if (gameState.spawnedInWave < gameState.maxSpawn && gameState.timer > 2.0) {
        spawnEnemy();
        gameState.timer = 0;
    }

    // 몬스터 이동
    gameState.enemies.forEach((en, i) => {
        en.x += en.spd * dt;
        en.el.style.left = en.x + 'px';
        en.el.style.top = en.y + 'px';
        
        if (en.x > canvas.width) {
            gameState.life--;
            en.el.remove();
            gameState.enemies.splice(i, 1);
            updateHUD();
        }
    });

    // 영웅 공격 (슬롯에 있는 영웅들)
    gameState.slots.forEach((hero, idx) => {
        if (!hero) return;
        hero.reload -= dt;
        if (hero.reload <= 0) {
            // 사거리 내 가장 가까운 적 탐색
            const target = gameState.enemies.find(en => 
                Math.hypot(en.x - (idx * 60 + 50), en.y - 150) < hero.range
            );
            if (target) {
                fireProjectile(idx, hero, target);
                hero.reload = hero.spd;
            }
        }
    });

    // 투사체 이동
    gameState.projectiles.forEach((p, i) => {
        const dx = p.tx - p.x;
        const dy = p.ty - p.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 10) {
            p.target.hp -= p.dmg;
            p.target.hpEl.style.width = Math.max(0, (p.target.hp / p.target.maxHp) * 100) + '%';
            if (p.target.hp <= 0) {
                const enIdx = gameState.enemies.indexOf(p.target);
                if (enIdx > -1) {
                    p.target.el.remove();
                    gameState.enemies.splice(enIdx, 1);
                    gameState.gold += 40;
                    updateHUD();
                }
            }
            gameState.projectiles.splice(i, 1);
        } else {
            p.x += (dx/dist) * 500 * dt;
            p.y += (dy/dist) * 500 * dt;
        }
    });

    // 웨이브 클리어
    if (gameState.spawnedInWave >= gameState.maxSpawn && gameState.enemies.length === 0) {
        gameState.wave++;
        gameState.maxSpawn += 2;
        gameState.spawnedInWave = 0;
        gameState.gold += 200;
        updateHUD();
    }
}

/**
 * 합체 & 소환 시스템
 */
function clickSlot(idx) {
    const slotEl = document.getElementById(`slot-${idx}`);
    
    if (gameState.selectedSlot === null) {
        if (gameState.slots[idx]) {
            gameState.selectedSlot = idx;
            slotEl.classList.add('selected');
        }
    } else {
        const prevIdx = gameState.selectedSlot;
        const prevSlotEl = document.getElementById(`slot-${prevIdx}`);
        
        if (prevIdx === idx) {
            // 선택 해제
            gameState.selectedSlot = null;
            slotEl.classList.remove('selected');
        } else if (gameState.slots[idx] && gameState.slots[idx].rank === gameState.slots[prevIdx].rank && gameState.slots[idx].rank < 4) {
            // 합체!
            mergeHeroes(prevIdx, idx);
            gameState.selectedSlot = null;
            prevSlotEl.classList.remove('selected');
        } else {
            // 선택 변경
            prevSlotEl.classList.remove('selected');
            gameState.selectedSlot = idx;
            slotEl.classList.add('selected');
        }
    }
}

function mergeHeroes(idx1, idx2) {
    const nextRank = gameState.slots[idx1].rank + 1;
    gameState.slots[idx1] = null; // 1번 비움
    gameState.slots[idx2] = { ...HERO_TEMPLATES[nextRank], reload: 0 }; // 2번 진화
    
    updateInventoryUI();
    showEffect(idx2, 'LEVEL UP!');
}

function trySummon() {
    if (gameState.gold < 200) return alert("골드가 부족합니다!");
    
    if (gameState.mode === 'student') {
        askMathProblem();
    } else {
        executeSummon();
    }
}

function executeSummon() {
    const emptyIdx = gameState.slots.findIndex(s => s === null);
    if (emptyIdx === -1) return alert("슬롯이 꽉 찼습니다!");

    gameState.gold -= 200;
    gameState.slots[emptyIdx] = { ...HERO_TEMPLATES[0], reload: 0 };
    updateInventoryUI();
    updateHUD();
}

/**
 * 수학 문제 시스템
 */
function askMathProblem() {
    const modal = document.getElementById('modal-math');
    const qText = document.getElementById('math-question');
    const oGrid = document.getElementById('math-options');
    
    // 6학년 수준 분수/소수 문제 생성
    const isFrac = Math.random() > 0.5;
    let question, answer, options = [];

    if (isFrac) {
        let n1 = rInt(1, 4), d1 = rInt(2, 5), n2 = rInt(1, 4), d2 = rInt(2, 5);
        question = `(${n1}/${d1}) ÷ (${n2}/${d2}) = ?`;
        let up = n1 * d2, down = d1 * n2;
        answer = `${up}/${down}`;
        options = [answer, `${n1*n2}/${d1*d2}`, `${up+1}/${down}`, `${up}/${down+1}`];
    } else {
        let v1 = (Math.random() * 5 + 1).toFixed(1);
        let v2 = rInt(2, 5);
        question = `${v1} ÷ ${v2} = ?`;
        answer = (v1 / v2).toFixed(2);
        options = [answer, (v1/v2 + 0.1).toFixed(2), (v1*v2).toFixed(1), "0.5"];
    }

    qText.innerText = question;
    oGrid.innerHTML = '';
    modal.classList.remove('hidden');

    options.sort(() => Math.random() - 0.5).forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'pixel-btn';
        btn.innerText = opt;
        btn.onclick = () => {
            if (opt == answer) {
                executeSummon();
                modal.classList.add('hidden');
            } else {
                alert("오답입니다!");
                modal.classList.add('hidden');
            }
        };
        oGrid.appendChild(btn);
    });
}

/**
 * 기타 유틸리티
 */
function spawnEnemy() {
    const el = document.createElement('div');
    el.className = 'entity';
    el.style.width = '40px'; el.style.height = '40px';
    el.style.background = `url('https://img.itch.zone/aW1nLzExMzkyMzI3LmdpZg==/original/78fH6%2B.gif') no-repeat center/contain`;
    el.innerHTML = `<div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>`;
    entityLayer.appendChild(el);

    const hp = 100 + (gameState.wave * 50);
    gameState.enemies.push({
        x: -50, y: 150 + (Math.random() * 40),
        spd: 40 + (gameState.wave * 5),
        hp: hp, maxHp: hp,
        el: el, hpEl: el.querySelector('.hp-fill')
    });
    gameState.spawnedInWave++;
}

function fireProjectile(slotIdx, hero, target) {
    gameState.projectiles.push({
        x: slotIdx * 60 + 30, y: 350, 
        tx: target.x + 20, ty: target.y + 20,
        dmg: hero.dmg, target: target
    });
}

function updateInventoryUI() {
    gameState.slots.forEach((hero, i) => {
        const slot = document.getElementById(`slot-${i}`);
        slot.innerHTML = '';
        if (hero) {
            const img = document.createElement('img');
            img.src = hero.img;
            slot.appendChild(img);
            const badge = document.createElement('div');
            badge.className = 'lv-badge';
            badge.innerText = ['C','R','L','S','E'][hero.rank];
            badge.style.color = [ 'white', '#4fa7ff', '#ffcc00', '#e066ff', '#ff0055'][hero.rank];
            slot.appendChild(badge);
        }
    });
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 길 그리기
    ctx.fillStyle = "#2a2a35";
    ctx.fillRect(0, 140, canvas.width, 60);
    
    // 투사체 그리기
    gameState.projectiles.forEach(p => {
        ctx.fillStyle = "#ffff00";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
        ctx.fill();
    });
}

function updateHUD() {
    document.getElementById('txt-wave').innerText = gameState.wave;
    document.getElementById('txt-gold').innerText = gameState.gold;
    document.getElementById('txt-life').innerText = gameState.life;
}

function toggleSpeed() {
    gameState.speed = gameState.speed === 1 ? 2 : (gameState.speed === 2 ? 3 : 1);
    document.getElementById('btn-speed').innerText = 'x' + gameState.speed;
}

function rInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function showEffect(idx, text) {
    const slot = document.getElementById(`slot-${idx}`);
    const eff = document.createElement('div');
    eff.style.position = 'absolute';
    eff.style.color = var(--gold);
    eff.innerText = text;
    slot.appendChild(eff);
    setTimeout(() => eff.remove(), 1000);
}

</script>
</body>
</html>
