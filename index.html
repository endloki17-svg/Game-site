<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초고퀄리티 온라인 끝말잇기 (Gemini AI)</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap');

        :root {
            --bg-color: #0f172a; --panel-bg: rgba(30, 41, 59, 0.85);
            --primary: #3b82f6; --primary-hover: #2563eb;
            --secondary: #10b981; --danger: #ef4444; --admin-color: #a855f7;
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); }

        /* 👑 어드민 사이드바 */
        #admin-sidebar { width: 320px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); border-right: 1px solid rgba(168, 85, 247, 0.4); display: none; flex-direction: column; padding: 20px; box-shadow: 5px 0 20px rgba(0,0,0,0.5); z-index: 100; }
        #admin-sidebar h2 { color: var(--admin-color); font-size: 1.2rem; margin-bottom: 5px; }
        .db-status { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        #cheat-word-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        #cheat-word-list::-webkit-scrollbar { width: 6px; } #cheat-word-list::-webkit-scrollbar-thumb { background: var(--admin-color); border-radius: 3px; }
        .cheat-word-btn { background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.3); color: var(--text-main); padding: 10px; border-radius: 8px; cursor: pointer; text-align: left; transition: all 0.2s; font-size: 1rem; }
        .cheat-word-btn:hover { background: rgba(168, 85, 247, 0.4); transform: translateX(5px); }
        .cheat-generate-btn { background: var(--admin-color); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }

        /* 메인 영역 */
        #main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .screen { background: var(--panel-bg); backdrop-filter: blur(15px); padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 500px; text-align: center; display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 2.2rem; margin-bottom: 10px; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); margin-bottom: 25px; }

        input[type="text"], input[type="password"] { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-size: 1.1rem; margin-bottom: 15px; outline: none; transition: border 0.3s; text-align: center; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: var(--primary); }
        input[type="text"]:disabled { background: rgba(0,0,0,0.5); color: #666; cursor: not-allowed; }

        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; margin-bottom: 10px; }
        .btn-primary { background: var(--primary); } .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--secondary); }
        .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; }
        .button-group { display: flex; gap: 10px; margin-top: 10px; } .button-group .btn { margin-bottom: 0; }

        .room-code-box { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 10px; margin: 20px 0; font-size: 1.5rem; font-weight: bold; color: #fbbf24; border: 1px dashed #fbbf24; }

        /* 게임 UI */
        .status-header { display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .player-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .player-info { font-weight: bold; color: #f8fafc; display: flex; align-items: center; gap: 10px; }
        .hp-bar { color: #ef4444; font-size: 1.2rem; letter-spacing: 2px; } .hp-bar span { opacity: 0.3; } .hp-bar span.active { opacity: 1; }
        .turn-badge { padding: 5px 12px; border-radius: 15px; font-size: 0.9rem; font-weight: bold; }
        .turn-mine { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; } .turn-opponent { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

        .word-display { font-size: 4rem; font-weight: 700; margin: 30px 0; letter-spacing: 5px; text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .history-box { margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px; height: 120px; overflow-y: auto; text-align: left; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
        .history-tag { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; color: var(--text-muted); }
        #message { margin-top: 10px; height: 20px; color: var(--danger); font-weight: bold; font-size: 0.95rem; }

        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .shake-anim { animation: shake 0.3s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
        
        .api-key-section { margin-bottom: 20px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 10px; border: 1px dashed rgba(255,255,255,0.2); }
        .api-key-section p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; text-align: left; }
    </style>
</head>
<body>

    <!-- 👑 어드민 치트 사이드바 -->
    <div id="admin-sidebar">
        <h2>✨ Gemini 3.6 Flash 치트키</h2>
        <div class="db-status">AI 모델이 실시간으로 이을 수 있는 실제 명사를 생성합니다.</div>
        <button class="cheat-generate-btn" onclick="generateCheatWords()">단어 10개 AI 생성 요청</button>
        <div id="cheat-loader" style="display:none; color:white; font-size:0.9rem;"><div class="loader"></div> AI가 생각하는 중...</div>
        <div id="cheat-word-list"></div>
    </div>

    <div id="main-wrapper">
        <!-- 로그인 -->
        <div id="login-screen" class="screen active">
            <h1>온라인 끝말잇기</h1>
            <div class="subtitle">Powered by Gemini AI</div>
            
            <!-- 🛡️ 안전하게 웹상에서 키를 입력받는 구역 -->
            <div class="api-key-section">
                <p>🔒 <b>보안 모드:</b> 발급받은 Gemini API 키를 여기에 입력하세요. 이 키는 회원님의 브라우저에만 안전하게 저장되며 외부로 유출되지 않습니다.</p>
                <input type="password" id="api-key-input" placeholder="Gemini API 키 입력 (필수)" style="margin-bottom:0;">
            </div>

            <input type="text" id="username" placeholder="닉네임을 입력하세요 (Endloki17 = 관리자)">
            <div class="button-group">
                <button class="btn btn-primary" onclick="hostGame()">방 만들기</button>
                <button class="btn btn-secondary" onclick="showJoinMenu()">방 참가하기</button>
            </div>
            <div id="join-menu" style="display: none; margin-top: 15px;">
                <input type="text" id="room-code-input" placeholder="초대 코드 (예: AB12C)">
                <button class="btn btn-secondary" onclick="joinGame()">입장하기</button>
            </div>
            <div id="login-msg" style="color: var(--danger); margin-top: 10px; font-size: 0.9rem;"></div>
        </div>

        <!-- 대기실 -->
        <div id="waiting-screen" class="screen">
            <h1>대기실</h1>
            <div class="subtitle">친구에게 아래 코드를 공유하세요.</div>
            <div class="room-code-box" id="display-room-code">로딩중...</div>
        </div>

        <!-- 게임화면 -->
        <div id="game-screen" class="screen">
            <div class="status-header">
                <div class="player-row">
                    <div class="player-info" id="opponent-name-ui">상대방</div>
                    <div class="hp-bar" id="opponent-hp-ui">❤️❤️❤️</div>
                </div>
                <div class="player-row" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                    <div class="player-info">
                        <span id="my-name-ui">나</span>
                        <span class="turn-badge" id="turn-indicator">대기 중</span>
                    </div>
                    <div class="hp-bar" id="my-hp-ui">❤️❤️❤️</div>
                </div>
            </div>
            
            <div class="word-display" id="current-word">시작</div>
            
            <div style="display: flex; gap: 10px;">
                <input type="text" id="word-input" placeholder="단어 입력..." onkeypress="if(event.key === 'Enter') attemptSubmitWord()">
                <button class="btn btn-primary" id="submit-btn" onclick="attemptSubmitWord()" style="width: 100px; margin: 0;">전송</button>
            </div>
            
            <div id="message"></div>
            <div class="history-box" id="history-box"></div>
        </div>
    </div>

    <script>
        // 페이지 로드 시 이전에 저장해둔 키가 있다면 자동으로 불러오기
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) document.getElementById('api-key-input').value = savedKey;
        };

        // 실시간 생성될 Gemini 엔드포인트 가져오기 함수
        function getGeminiEndpoint() {
            const key = localStorage.getItem('gemini_api_key');
            if(!key) return null;
            return `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
        }

        let peer = null, conn = null;
        let myName = "", opponentName = "상대방";
        let isHost = false, isMyTurn = false, isAdmin = false, isThinking = false;

        const MAX_HP = 3;
        let myHP = MAX_HP, opponentHP = MAX_HP;
        let currentWord = "끝말잇기", usedWords = ["끝말잇기"];

        // --- Gemini AI 판별 로직 ---
        async function validateWordWithAI(prevWord, newWord) {
            const endpoint = getGeminiEndpoint();
            if(!endpoint) return null;

            const prompt = `당신은 한국어 끝말잇기 게임의 엄격한 심판입니다.
조건 1: '${newWord}'(이)가 국어사전에 등재된 올바른 명사인가요?
조건 2: 이전 단어 '${prevWord}'의 끝 글자로 시작하나요? (두음법칙 허용)
두 조건이 모두 맞다면 오직 'O' 하나만 출력하고, 틀렸거나 사전에 없는 단어라면 'X' 하나만 출력하세요.`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text.trim();
                return text === 'O';
            } catch (e) {
                console.error("AI API 에러:", e);
                return null;
            }
        }

        // --- Gemini AI 치트 단어 생성 로직 ---
        async function generateCheatWords() {
            if(!isMyTurn || isThinking) return;
            const endpoint = getGeminiEndpoint();
            if(!endpoint) { alert("API 키가 설정되지 않았습니다."); return; }

            isThinking = true;
            document.getElementById('cheat-loader').style.display = 'block';
            document.getElementById('cheat-word-list').innerHTML = "";

            const targetChar = currentWord.charAt(currentWord.length - 1);
            const prompt = `한국어 끝말잇기 게임입니다. '${targetChar}'(으)로 시작하는(두음법칙 허용) 실제로 존재하는 한국어 명사 10개를 쉼표(,)로 구분해서 알려주세요. 부가적인 말은 일절 하지 마세요. 예시형식: 단어1, 단어2, 단어3`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text.trim();
                const words = text.split(',').map(w => w.trim()).filter(w => !usedWords.includes(w));

                const cheatList = document.getElementById('cheat-word-list');
                words.forEach(word => {
                    const btn = document.createElement('button');
                    btn.className = 'cheat-word-btn';
                    btn.innerText = word;
                    btn.onclick = () => attemptSubmitWord(word);
                    cheatList.appendChild(btn);
                });
            } catch (e) {
                document.getElementById('cheat-word-list').innerHTML = "<div style='color:red;'>API 호출 에러가 발생했습니다. 키가 정확한지 확인하세요.</div>";
            } finally {
                isThinking = false;
                document.getElementById('cheat-loader').style.display = 'none';
            }
        }

        // --- 화면 전환 & UI ---
        function showScreen(id) { document.querySelectorAll('.screen').forEach(el => el.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function renderHP(id, hp) {
            const el = document.getElementById(id); el.innerHTML = "";
            for (let i = 0; i < MAX_HP; i++) { const heart = document.createElement("span"); heart.innerText = "❤️"; if (i < hp) heart.className = "active"; el.appendChild(heart); }
        }

        // --- 로그인 및 유효성 검사 ---
        function checkCredentials() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            const name = document.getElementById('username').value.trim();
            
            if (!apiKey) { document.getElementById('login-msg').innerText = "API 키를 입력해주세요."; return null; }
            if (!name) { document.getElementById('login-msg').innerText = "닉네임을 입력해주세요."; return null; }
            
            // 키를 브라우저 로컬 스토리지에 저장 (다음 접속 시 편리함)
            localStorage.setItem('gemini_api_key', apiKey);

            if (name === "Endloki17") { isAdmin = true; document.getElementById('admin-sidebar').style.display = 'flex'; }
            return name;
        }

        function showJoinMenu() { if (document.getElementById('username').value.trim()) document.getElementById('join-menu').style.display = 'block'; }

        function hostGame() {
            myName = checkCredentials(); if (!myName) return;
            isHost = true; showScreen('waiting-screen');
            const roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
            peer = new Peer("GMN-" + roomCode);
            peer.on('open', () => document.getElementById('display-room-code').innerText = roomCode);
            peer.on('connection', (connection) => { conn = connection; setupEvents(); isMyTurn = true; });
        }

        function joinGame() {
            myName = checkCredentials(); if (!myName) return;
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if(!code) return;
            isHost = false; peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect("GMN-" + code);
                conn.on('open', () => { setupEvents(); conn.send({ type: 'join', name: myName }); isMyTurn = false; });
            });
        }

        function setupEvents() {
            conn.on('data', (data) => {
                if (data.type === 'join') { opponentName = data.name; conn.send({ type: 'start', name: myName, word: currentWord, used: usedWords }); initGameUI(); }
                else if (data.type === 'start') { opponentName = data.name; currentWord = data.word; usedWords = data.used; initGameUI(); }
                else if (data.type === 'word') { applyNewWord(data.word, false); }
                else if (data.type === 'hp') { opponentHP = data.hp; renderHP('opponent-hp-ui', opponentHP); triggerShake('opponent-hp-ui'); }
                else if (data.type === 'over') { alert(`상대방 체력 0! 🎉 ${myName} 승리!`); location.reload(); }
            });
            conn.on('close', () => { alert("연결이 끊어졌습니다."); location.reload(); });
        }

        function initGameUI() {
            showScreen('game-screen');
            document.getElementById('my-name-ui').innerText = myName; document.getElementById('opponent-name-ui').innerText = opponentName;
            renderHP('my-hp-ui', myHP); renderHP('opponent-hp-ui', opponentHP); updateBoardUI();
        }

        function triggerShake(id) { const el = document.getElementById(id); el.classList.remove('shake-anim'); void el.offsetWidth; el.classList.add('shake-anim'); }

        function takeDamage(msg) {
            myHP -= 1; renderHP('my-hp-ui', myHP); triggerShake('my-hp-ui');
            document.getElementById('message').innerText = `${msg} (체력 -1)`; document.getElementById('word-input').value = "";
            if (myHP <= 0) { conn.send({ type: 'over' }); setTimeout(() => { alert("💀 게임 오버!"); location.reload(); }, 100); }
            else { conn.send({ type: 'hp', hp: myHP }); }
        }

        async function attemptSubmitWord(forcedWord = null) {
            if (!isMyTurn || isThinking) return;
            const inputField = document.getElementById('word-input');
            const newWord = forcedWord || inputField.value.trim();
            const msgBox = document.getElementById('message');

            if (newWord.length < 2) { takeDamage("2글자 이상 입력하세요."); return; }
            if (usedWords.includes(newWord)) { takeDamage("이미 사용한 단어입니다."); return; }

            isThinking = true; inputField.disabled = true;
            msgBox.innerHTML = '<span class="loader"></span> AI가 단어를 분석 중입니다...';

            const isValid = await validateWordWithAI(currentWord, newWord);
            
            isThinking = false; inputField.disabled = false; inputField.focus();

            if (isValid === null) { msgBox.innerText = "API 에러! 올바른 키인지 확인하세요."; return; }
            if (isValid === false) { takeDamage(`'${newWord}'은(는) 규칙에 맞지 않거나 사전에 없는 단어입니다.`); } 
            else { msgBox.innerText = ""; applyNewWord(newWord, true); conn.send({ type: 'word', word: newWord }); }
        }

        function applyNewWord(word, isItMyWord) { currentWord = word; usedWords.push(word); isMyTurn = !isItMyWord; updateBoardUI(); }

        function updateBoardUI() {
            const inputField = document.getElementById('word-input'), submitBtn = document.getElementById('submit-btn'), turnIndicator = document.getElementById('turn-indicator');
            document.getElementById('current-word').innerText = currentWord; inputField.value = ""; document.getElementById('message').innerText = "";
            document.getElementById('cheat-word-list').innerHTML = ""; 

            if (isMyTurn) { turnIndicator.innerText = "나의 차례!"; turnIndicator.className = "turn-badge turn-mine"; inputField.disabled = false; submitBtn.disabled = false; inputField.focus(); } 
            else { turnIndicator.innerText = "상대방 분석/입력 중..."; turnIndicator.className = "turn-badge turn-opponent"; inputField.disabled = true; submitBtn.disabled = true; }

            const historyBox = document.getElementById('history-box'); historyBox.innerHTML = "";
            usedWords.forEach((w, i) => {
                const span = document.createElement('span'); span.className = 'history-tag';
                if (i === usedWords.length - 1) { span.style.background = 'rgba(59, 130, 246, 0.2)'; span.style.color = '#60a5fa'; span.style.border = '1px solid rgba(59, 130, 246, 0.5)'; }
                span.innerText = w; historyBox.appendChild(span);
            });
            historyBox.scrollTop = historyBox.scrollHeight;
        }
    </script>
</body>
                </html>
