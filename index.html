<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Full Online Multiplayer</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0; background-color: #0b0b1a; color: #fff;
            font-family: 'Press Start 2P', cursive;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden; user-select: none;
        }

        #game-container {
            position: relative; width: 800px; height: 400px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            background: linear-gradient(to bottom, #10102b, #1a1a3a);
            overflow: hidden;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: rgba(0, 0, 0, 0.85); z-index: 10; backdrop-filter: blur(5px);
        }

        h1 { color: #00ffcc; text-shadow: 3px 3px 0px #ff0055; font-size: 30px; margin-bottom: 20px; text-align: center; line-height: 1.4;}
        h2 { color: #fff; font-size: 14px; margin-bottom: 20px; }

        .panel { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px;}
        
        input {
            padding: 10px; font-family: 'Press Start 2P', cursive; font-size: 12px;
            margin-bottom: 10px; width: 250px; text-align: center; border: 2px solid #00ffcc;
            background: #111; color: #00ffcc; outline: none;
        }

        button {
            padding: 12px 20px; font-family: 'Press Start 2P', cursive; font-size: 12px;
            color: #fff; background-color: #ff0055; border: 3px solid #fff;
            cursor: pointer; transition: transform 0.1s, background-color 0.2s; margin: 5px;
        }
        button:hover { background-color: #ff3377; transform: scale(1.05); }
        button:disabled { background-color: #555; border-color: #777; cursor: not-allowed; transform: none; }

        canvas { display: block; }
        .hidden { display: none !important; }
        #status-msg { color: #ffeb3b; font-size: 10px; margin-top: 15px; height: 15px; }
        
        .controls { font-size: 9px; color: #aaa; margin-top: 15px; text-align: center; line-height: 1.8; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="lobby" class="screen">
        <h1>GEO-DASH<br>MULTIPLAYER</h1>
        
        <div class="panel">
            <h2>내 ID: <span id="my-id">생성 중...</span></h2>
            <button id="host-btn" disabled>방 만들기 (Host)</button>
        </div>

        <div class="panel">
            <input type="text" id="target-id" placeholder="친구 ID 입력">
            <br>
            <button id="join-btn" disabled>접속하기 (Join)</button>
        </div>
        
        <button id="solo-btn" style="background-color: #00ffcc; color: #000; border-color: #000;">솔로 플레이</button>
        <p id="status-msg"></p>

        <div class="controls">
            [조작] 클릭 또는 스페이스바<br>
            큐브: 점프 / 비행기(Ship): 누르고 있으면 상승 / 배(Wave): 대각선 비행
        </div>
    </div>

    <div id="game-over" class="screen hidden">
        <h1 id="result-title">CRASHED!</h1>
        <p id="progress-text" style="color: #ffeb3b; margin-bottom: 30px; font-size: 16px;">Progress: 0%</p>
        <button id="lobby-btn">로비로 돌아가기</button>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiLobby = document.getElementById('lobby');
    const uiGameOver = document.getElementById('game-over');
    const statusMsg = document.getElementById('status-msg');

    // 게임 변수
    const BLOCK_SIZE = 40;
    let gameSpeed = 7;
    let isPlaying = false;
    let isHolding = false;
    let animationId;
    let cameraX = 0;
    let frame = 0;

    // 플레이어 (나)
    const player = { x: 150, y: 0, size: 30, dy: 0, mode: 'cube', gravity: 1, rotation: 0, grounded: false, dead: false };
    
    // 플레이어 (온라인 상대방)
    const peerPlayer = { active: false, camX: 0, y: 0, rot: 0, mode: 'cube', grav: 1, dead: false };

    // 네트워크 변수
    let peer = null, conn = null, isHost = false, isMultiplayer = false;

    // 맵 디자인 (S:비행기, C:큐브, W:웨이브, U:중력반전, D:정상중력, F:도착, ^v:가시, X:벽/바닥)
    const levelMap = [
        "........................................................................................................................................................................................................",
        "........................................................................................................................................................................................................",
        "..................................................................................................XXXXXXXXXXXXX...XXXXXXXXXX............................................................................",
        "..........................................................XXXXXXXXXXXXXXXXXXXX....................X...........X...X........X............................................................................",
        "..........................................................x......................................X...v.......X...X........X....................................................X.......................",
        ".................................................................v.............U................X.......v...X...X........X....................v..................W............X.......................",
        ".................................................S..............................................X...........X...X........X....................................................X.......................",
        ".......................................................................^........................X...^.......X...X........X.................C..................................X......F................",
        "................................XXXXX........................^..................................X...........X...X........X...................................X................X.......................",
        "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
    ];

    let blocks = [], spikes = [], portals = [], finishLine = null;
    let maxLevelWidth = levelMap[0].length * BLOCK_SIZE;

    function loadLevel() {
        blocks = []; spikes = []; portals = []; finishLine = null;
        for (let r = 0; r < levelMap.length; r++) {
            for (let c = 0; c < levelMap[r].length; c++) {
                let char = levelMap[r][c];
                let x = c * BLOCK_SIZE, y = r * BLOCK_SIZE;
                
                if (char === 'X') blocks.push({ x, y, size: BLOCK_SIZE });
                else if (char === '^' || char === 'v') spikes.push({ x, y, size: BLOCK_SIZE, dir: char });
                else if (['S', 'C', 'W', 'U', 'D'].includes(char)) portals.push({ x, y, type: char });
                else if (char === 'F') finishLine = { x, y };
            }
        }
    }

    // --- 네트워크 설정 (PeerJS) ---
    function initPeer() {
        peer = new Peer();
        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
            document.getElementById('host-btn').disabled = false;
            document.getElementById('join-btn').disabled = false;
        });

        peer.on('connection', (connection) => {
            conn = connection; setupConnection(); isHost = true;
            statusMsg.innerText = "상대방 접속 완료! 1.5초 후 시작합니다.";
            setTimeout(startGame, 1500);
        });
    }

    document.getElementById('host-btn').addEventListener('click', (e) => {
        statusMsg.innerText = "상대방 기다리는 중...";
        e.target.disabled = true; document.getElementById('join-btn').disabled = true;
    });

    document.getElementById('join-btn').addEventListener('click', () => {
        const target = document.getElementById('target-id').value.trim();
        if(!target) return;
        statusMsg.innerText = "접속 중...";
        conn = peer.connect(target);
        conn.on('open', () => {
            setupConnection(); isHost = false;
            statusMsg.innerText = "접속 성공! 방장의 시작을 기다립니다.";
        });
    });

    function setupConnection() {
        isMultiplayer = true; peerPlayer.active = true;
        conn.on('data', (data) => {
            if(data.type === 'start') startGame();
            else if (data.type === 'sync') {
                peerPlayer.camX = data.camX; peerPlayer.y = data.y;
                peerPlayer.rot = data.rot; peerPlayer.mode = data.mode;
                peerPlayer.grav = data.grav; peerPlayer.dead = data.dead;
            }
        });
    }

    document.getElementById('solo-btn').addEventListener('click', () => {
        isMultiplayer = false; peerPlayer.active = false; startGame();
    });

    // --- 입력 및 물리 ---
    function handleInput(e, state) {
        if (e.type === 'keydown' && (e.code === 'Space' || e.code === 'ArrowUp')) e.preventDefault();
        if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
        isHolding = state;

        if (state && !player.dead && isPlaying && player.mode === 'cube' && player.grounded) {
            player.dy = -13 * player.gravity; player.grounded = false;
        }
    }
    window.addEventListener('keydown', (e) => handleInput(e, true), { passive: false });
    window.addEventListener('keyup', (e) => handleInput(e, false));
    window.addEventListener('mousedown', (e) => handleInput(e, true));
    window.addEventListener('mouseup', (e) => handleInput(e, false));

    function checkAABB(r1, r2, pad = 0) {
        return (r1.x + pad < r2.x + r2.w - pad && r1.x + r1.w - pad > r2.x + pad &&
                r1.y + pad < r2.y + r2.h - pad && r1.y + r1.h - pad > r2.y + pad);
    }

    function updatePhysics() {
        if (player.dead) return;

        // 모드별 물리 법칙
        if (player.mode === 'cube') {
            player.dy += 1.2 * player.gravity;
            player.dy = Math.max(-15, Math.min(player.dy, 15));
        } else if (player.mode === 'ship') {
            player.dy += (isHolding ? -0.6 : 0.6) * player.gravity;
            player.dy = Math.max(-8, Math.min(player.dy, 8));
            player.rotation = player.dy * 2 * player.gravity;
        } else if (player.mode === 'wave') {
            player.dy = (isHolding ? -9 : 9) * player.gravity;
            player.rotation = (player.dy < 0 ? -45 : 45) * player.gravity;
        }

        player.y += player.dy;
        player.grounded = false;
        let hitWall = false;

        const pRect = { x: player.x, y: player.y, w: player.size, h: player.size };

        // [버그 수정됨] 견고한 4방향 충돌 판정
        for (let b of blocks) {
            let bRect = { x: b.x - cameraX, y: b.y, w: b.size, h: b.size };
            if (checkAABB(pRect, bRect)) {
                let overLeft = (pRect.x + pRect.w) - bRect.x;
                let overRight = (bRect.x + bRect.w) - pRect.x;
                let overTop = (pRect.y + pRect.h) - bRect.y;
                let overBot = (bRect.y + bRect.h) - pRect.y;

                let minOver = Math.min(overLeft, overRight, overTop, overBot);

                if (minOver === overTop && player.gravity === 1) { // 바닥
                    player.y = bRect.y - player.size; player.dy = 0; player.grounded = true;
                } else if (minOver === overBot && player.gravity === -1) { // 반전 바닥(천장)
                    player.y = bRect.y + bRect.h; player.dy = 0; player.grounded = true;
                } else if (minOver === overBot && player.gravity === 1) { // 천장 충돌
                    player.y = bRect.y + bRect.h; player.dy = 0;
                } else if (minOver === overTop && player.gravity === -1) { // 반전 천장 충돌
                    player.y = bRect.y - player.size; player.dy = 0;
                } else {
                    // Y축 겹침이 아주 미세할 때(이음새)는 벽돌진으로 처리하지 않음
                    if (overTop > 8 && overBot > 8) hitWall = true;
                }
                pRect.y = player.y;
            }
        }

        if (hitWall || player.y < -50 || player.y > canvas.height + 50) die();

        // 가시 충돌 (히트박스 작게)
        for (let s of spikes) {
            let sRect = { x: s.x - cameraX, y: s.y, w: s.size, h: s.size };
            if (checkAABB(pRect, sRect, 10)) die();
        }

        // 포탈 충돌
        for (let i = 0; i < portals.length; i++) {
            let pt = portals[i];
            let ptRect = { x: pt.x - cameraX, y: pt.y, w: BLOCK_SIZE, h: BLOCK_SIZE * 2 };
            if (checkAABB(pRect, ptRect)) {
                if (pt.type === 'S') player.mode = 'ship';
                if (pt.type === 'C') player.mode = 'cube';
                if (pt.type === 'W') player.mode = 'wave';
                if (pt.type === 'U') player.gravity = -1;
                if (pt.type === 'D') player.gravity = 1;
                portals.splice(i, 1);
            }
        }

        if (finishLine && finishLine.x - cameraX < player.x) winGame();
    }

    function die() {
        player.dead = true;
        if (!isMultiplayer) setTimeout(() => gameOver("CRASHED!"), 100);
    }

    // --- 그리기 로직 ---
    function drawPlayerShape(p, color, isGhost = false) {
        if (p.dead) return;
        ctx.save();
        ctx.translate(p.x + p.size / 2, p.y + p.size / 2);

        if (p.mode === 'cube') {
            if (!p.grounded && !isGhost) p.rot += 8 * p.grav;
            else if (!isGhost) p.rot = Math.round(p.rot / 90) * 90;
            ctx.rotate((p.rot * Math.PI) / 180);
            
            ctx.globalAlpha = isGhost ? 0.3 : 1;
            ctx.fillStyle = color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
            ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size);
        } else if (p.mode === 'ship') {
            ctx.rotate((p.rot * Math.PI) / 180);
            ctx.globalAlpha = isGhost ? 0.3 : 1;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(p.size/2, 0); ctx.lineTo(-p.size/2, -p.size/2); ctx.lineTo(-p.size/2, p.size/2);
            ctx.closePath(); ctx.fill(); ctx.stroke();
        } else if (p.mode === 'wave') {
            ctx.rotate((p.rot * Math.PI) / 180);
            ctx.globalAlpha = isGhost ? 0.3 : 1;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(p.size/2, 0); ctx.lineTo(-p.size/2, -p.size/3); ctx.lineTo(-p.size/2, p.size/3);
            ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 시차 스크롤 배경
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.beginPath(); ctx.moveTo(i - (cameraX * 0.5 % 40), 0); ctx.lineTo(i - (cameraX * 0.5 % 40), canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        // 맵 렌더링
        ctx.fillStyle = '#111'; ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2;
        for (let b of blocks) {
            if (b.x - cameraX > canvas.width || b.x - cameraX < -BLOCK_SIZE) continue;
            ctx.fillRect(b.x - cameraX, b.y, b.size, b.size);
            ctx.strokeRect(b.x - cameraX, b.y, b.size, b.size);
        }

        ctx.fillStyle = '#ff0055'; ctx.strokeStyle = '#fff';
        for (let s of spikes) {
            if (s.x - cameraX > canvas.width || s.x - cameraX < -BLOCK_SIZE) continue;
            ctx.beginPath();
            if (s.dir === '^') {
                ctx.moveTo(s.x - cameraX + s.size / 2, s.y); ctx.lineTo(s.x - cameraX + s.size, s.y + s.size); ctx.lineTo(s.x - cameraX, s.y + s.size);
            } else {
                ctx.moveTo(s.x - cameraX, s.y); ctx.lineTo(s.x - cameraX + s.size, s.y); ctx.lineTo(s.x - cameraX + s.size / 2, s.y + s.size);
            }
            ctx.closePath(); ctx.fill(); ctx.stroke();
        }

        for (let pt of portals) {
            if (pt.x - cameraX > canvas.width || pt.x - cameraX < -BLOCK_SIZE) continue;
            ctx.lineWidth = 4;
            ctx.strokeStyle = pt.type==='S'?'#ff00ff': pt.type==='C'?'#00ff00': pt.type==='W'?'#00ffff': pt.type==='U'?'#ffff00':'#0000ff';
            ctx.beginPath();
            ctx.ellipse(pt.x - cameraX + BLOCK_SIZE/2, pt.y + BLOCK_SIZE, 15, BLOCK_SIZE, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        if (finishLine) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(finishLine.x - cameraX, 0, 10, canvas.height);
        }

        // 상대방(고스트) 그리기 (네트워크 동기화 기반)
        if (isMultiplayer && peerPlayer.active) {
            let ghostX = 150 + (peerPlayer.camX - cameraX);
            drawPlayerShape({ x: ghostX, y: peerPlayer.y, size: 30, rot: peerPlayer.rot, mode: peerPlayer.mode, grav: peerPlayer.grav, dead: peerPlayer.dead }, '#ffeb3b', true);
        }

        // 나 그리기
        drawPlayerShape({ x: player.x, y: player.y, size: 30, rot: player.rotation, mode: player.mode, grav: player.gravity, dead: player.dead, grounded: player.grounded }, player.gravity === 1 ? '#00ffcc' : '#ffff00', false);

        // 진행도
        let progress = Math.min(100, Math.max(0, Math.floor(((player.x + cameraX) / maxLevelWidth) * 100)));
        ctx.fillStyle = '#fff'; ctx.font = '12px "Press Start 2P"';
        ctx.fillText(`Progress: ${progress}%`, 20, 30);
        
        // 멀티플레이 관전 텍스트
        if (isMultiplayer && player.dead && !peerPlayer.dead) {
            ctx.fillStyle = '#ff0055'; ctx.fillText("SPECTATING PEER...", canvas.width/2 - 100, 50);
        }
    }

    function animate() {
        if (!isPlaying) return;
        
        if (!player.dead) cameraX += gameSpeed;
        updatePhysics();
        draw();

        // 2프레임마다 내 위치 전송 (네트워크 트래픽 최적화)
        if (isMultiplayer && conn && frame % 2 === 0) {
            conn.send({ type: 'sync', camX: cameraX, y: player.y, rot: player.rotation, mode: player.mode, grav: player.gravity, dead: player.dead });
        }

        // 멀티플레이 게임 종료 체크 (둘 다 죽었을 때)
        if (isMultiplayer && player.dead && peerPlayer.dead) gameOver("BOTH CRASHED!");

        frame++;
        animationId = requestAnimationFrame(animate);
    }

    function initGame() {
        loadLevel();
        // 안전한 시작 위치 배정
        player.x = 150; player.y = 320; player.dy = 0; player.rotation = 0;
        player.mode = 'cube'; player.gravity = 1; player.dead = false; player.grounded = false;
        cameraX = 0; frame = 0; isHolding = false;
    }

    function startGame() {
        if (isHost && conn) conn.send({ type: 'start' });
        uiLobby.classList.add('hidden'); uiGameOver.classList.add('hidden');
        initGame(); isPlaying = true; animate();
    }

    function gameOver(msg) {
        isPlaying = false; cancelAnimationFrame(animationId);
        document.getElementById('result-title').innerText = msg;
        let progress = Math.min(100, Math.floor(((player.x + cameraX) / maxLevelWidth) * 100));
        document.getElementById('progress-text').innerText = `Progress: ${progress}%`;
        uiGameOver.classList.remove('hidden');
    }

    function winGame() {
        gameOver("LEVEL CLEARED!");
        document.getElementById('result-title').style.color = "#00ffcc";
    }

    document.getElementById('lobby-btn').addEventListener('click', () => {
        uiGameOver.classList.add('hidden'); uiLobby.classList.remove('hidden');
        statusMsg.innerText = "";
    });

    initPeer();

</script>
</body>
</html>
