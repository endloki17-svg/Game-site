<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Web Clone</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            overflow: hidden;
        }

        /* 로비 및 게임 오버 화면 UI */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 2px 2px 0px #ff0055;
            font-size: 36px;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.5;
        }

        button {
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            color: #fff;
            background-color: #ff0055;
            border: 4px solid #fff;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover {
            background-color: #ff3377;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        canvas {
            display: block;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="lobby" class="screen">
        <h1>JS DASH</h1>
        <button id="start-btn">PLAY</button>
    </div>

    <div id="game-over" class="screen hidden">
        <h1>CRASHED!</h1>
        <p id="final-score" style="margin-bottom: 30px; color: #ffeb3b;">Score: 0</p>
        <button id="restart-btn">RETRY</button>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI 요소
    const lobby = document.getElementById('lobby');
    const gameOverScreen = document.getElementById('game-over');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalScoreText = document.getElementById('final-score');

    // 게임 상태 변수
    let isPlaying = false;
    let animationId;
    let frame = 0;
    let score = 0;
    let gameSpeed = 6;

    // 플레이어 (큐브) 객체
    const player = {
        x: 100,
        y: 0,
        size: 30,
        dy: 0,
        gravity: 0.8,
        jumpPower: -12,
        grounded: false,
        rotation: 0
    };

    const groundHeight = 50;
    const floorY = canvas.height - groundHeight;

    // 장애물 배열
    let obstacles = [];

    // 키 입력 처리 (스페이스바, 마우스 클릭)
    function handleJump(e) {
        if ((e.type === 'keydown' && e.code === 'Space') || e.type === 'mousedown') {
            if (isPlaying && player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }
        }
    }

    window.addEventListener('keydown', handleJump);
    window.addEventListener('mousedown', handleJump);

    // 게임 초기화
    function initGame() {
        player.y = floorY - player.size;
        player.dy = 0;
        player.rotation = 0;
        player.grounded = true;
        obstacles = [];
        score = 0;
        frame = 0;
        gameSpeed = 6;
    }

    // 장애물 생성 클래스
    class Obstacle {
        constructor() {
            this.width = 30;
            this.height = Math.random() > 0.5 ? 30 : 50; // 랜덤 높이 (가시 또는 블록)
            this.x = canvas.width;
            this.y = floorY - this.height;
            this.color = '#ff0055';
        }

        draw() {
            ctx.fillStyle = this.color;
            // 가시 모양 그리기
            ctx.beginPath();
            ctx.moveTo(this.x + this.width / 2, this.y);
            ctx.lineTo(this.x + this.width, this.y + this.height);
            ctx.lineTo(this.x, this.y + this.height);
            ctx.closePath();
            ctx.fill();
            
            // 테두리
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        update() {
            this.x -= gameSpeed;
            this.draw();
        }
    }

    // 충돌 감지 로직 (AABB)
    function checkCollision(player, obs) {
        // 플레이어의 히트박스를 약간 작게 설정하여 억울한 죽음 방지
        const hitboxPadding = 4; 
        return (
            player.x + hitboxPadding < obs.x + obs.width &&
            player.x + player.size - hitboxPadding > obs.x &&
            player.y + hitboxPadding < obs.y + obs.height &&
            player.y + player.size - hitboxPadding > obs.y
        );
    }

    // 배경 그리기 (그리드 라인)
    function drawBackground() {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i - (frame % 40), 0);
            ctx.lineTo(i - (frame % 40), canvas.height);
            ctx.stroke();
        }
        
        // 바닥 그리기
        ctx.fillStyle = '#222';
        ctx.fillRect(0, floorY, canvas.width, groundHeight);
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, floorY);
        ctx.lineTo(canvas.width, floorY);
        ctx.stroke();
    }

    // 플레이어 그리기 (회전 로직 포함)
    function drawPlayer() {
        ctx.save();
        // 회전 중심점을 플레이어의 중앙으로 이동
        ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
        
        // 공중에 있을 때 회전, 바닥에 닿으면 90도 각도로 스냅
        if (!player.grounded) {
            player.rotation += 6; // 회전 속도
        } else {
            player.rotation = Math.round(player.rotation / 90) * 90; 
        }
        
        ctx.rotate((player.rotation * Math.PI) / 180);
        
        // 큐브 그리기
        ctx.fillStyle = '#00ffcc';
        ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
        
        // 큐브 안의 작은 사각형 (디테일)
        ctx.fillStyle = '#16213e';
        ctx.fillRect(-player.size / 4, -player.size / 4, player.size / 2, player.size / 2);
        
        ctx.restore();
    }

    // 게임 루프
    function animate() {
        if (!isPlaying) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawBackground();

        // 플레이어 물리 적용
        player.dy += player.gravity;
        player.y += player.dy;

        // 바닥 충돌 처리
        if (player.y + player.size >= floorY) {
            player.y = floorY - player.size;
            player.dy = 0;
            player.grounded = true;
        }

        drawPlayer();

        // 장애물 생성 (일정 프레임마다)
        if (frame % Math.floor(Math.random() * 40 + 60) === 0) {
            obstacles.push(new Obstacle());
        }

        // 장애물 업데이트 및 충돌 검사
        for (let i = 0; i < obstacles.length; i++) {
            let obs = obstacles[i];
            obs.update();

            // 충돌 시 게임 오버
            if (checkCollision(player, obs)) {
                gameOver();
                return;
            }

            // 화면 밖으로 나간 장애물 제거 및 점수 획득
            if (obs.x + obs.width < 0) {
                obstacles.splice(i, 1);
                score += 10;
                i--;
            }
        }

        // 점수 표시
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.font = '20px "Press Start 2P"';
        ctx.fillText(`SCORE: ${score}`, 20, 40);

        // 시간이 지날수록 난이도(속도) 증가
        if (frame % 500 === 0 && gameSpeed < 12) {
            gameSpeed += 0.5;
        }

        frame++;
        animationId = requestAnimationFrame(animate);
    }

    // 게임 시작
    function startGame() {
        lobby.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        initGame();
        isPlaying = true;
        animate();
    }

    // 게임 오버
    function gameOver() {
        isPlaying = false;
        cancelAnimationFrame(animationId);
        finalScoreText.innerText = `Score: ${score}`;
        gameOverScreen.classList.remove('hidden');
    }

    // 이벤트 리스너 등록
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // 초기 화면용 배경만 렌더링
    drawBackground();

</script>
</body>
    </html>
