<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초고퀄리티 온라인 끝말잇기 (체력전)</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap');

        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --secondary: #10b981;
            --secondary-hover: #059669;
            --danger: #ef4444;
            --admin-color: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            height: 100vh; display: flex; overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
        }

        /* 👑 어드민 사이드바 */
        #admin-sidebar {
            width: 300px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            border-right: 1px solid rgba(245, 158, 11, 0.4);
            display: none; flex-direction: column; padding: 20px;
            box-shadow: 5px 0 20px rgba(0,0,0,0.5); transition: all 0.3s ease; z-index: 100;
        }
        #admin-sidebar h2 { color: var(--admin-color); font-size: 1.2rem; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .db-status { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        #cheat-word-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        #cheat-word-list::-webkit-scrollbar { width: 6px; }
        #cheat-word-list::-webkit-scrollbar-thumb { background: var(--admin-color); border-radius: 3px; }
        
        .cheat-word-btn {
            background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--text-main); padding: 10px; border-radius: 8px; cursor: pointer; text-align: left;
            transition: all 0.2s; font-size: 1rem;
        }
        .cheat-word-btn:hover { background: rgba(245, 158, 11, 0.4); transform: translateX(5px); }

        /* 메인 컨텐츠 영역 */
        #main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .screen {
            background: var(--panel-bg); backdrop-filter: blur(15px); padding: 40px;
            border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 500px;
            text-align: center; display: none;
        }
        .screen.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); margin-bottom: 25px; }

        input[type="text"] {
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: white; font-size: 1.1rem; margin-bottom: 15px;
            outline: none; transition: border 0.3s; text-align: center;
        }
        input[type="text"]:focus { border-color: var(--primary); }
        input[type="text"]:disabled { background: rgba(0,0,0,0.5); color: #666; cursor: not-allowed; }

        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 10px; color: white;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; margin-bottom: 10px;
        }
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--secondary); }
        .btn-secondary:hover { background: var(--secondary-hover); }
        .btn:disabled { background: #475569; cursor: not-allowed; transform: none; }
        .button-group { display: flex; gap: 10px; margin-top: 10px; }
        .button-group .btn { margin-bottom: 0; }

        .room-code-box {
            background: rgba(0,0,0,0.4); padding: 20px; border-radius: 10px; margin: 20px 0;
            font-size: 1.5rem; letter-spacing: 2px; font-weight: bold; color: #fbbf24; border: 1px dashed #fbbf24;
        }

        /* 🎮 게임 화면 전용 (체력 UI 추가) */
        .status-header {
            display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.3);
            padding: 15px; border-radius: 10px; margin-bottom: 20px;
        }
        .player-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .player-info { font-weight: bold; color: #f8fafc; display: flex; align-items: center; gap: 10px; }
        
        .hp-bar { color: #ef4444; font-size: 1.2rem; letter-spacing: 2px; }
        .hp-bar span { opacity: 0.3; } /* 잃은 체력 */
        .hp-bar span.active { opacity: 1; } /* 남은 체력 */

        .turn-badge { padding: 5px 12px; border-radius: 15px; font-size: 0.9rem; font-weight: bold; }
        .turn-mine { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .turn-opponent { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

        .word-display { font-size: 4rem; font-weight: 700; margin: 30px 0; letter-spacing: 5px; text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .history-box {
            margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px;
            height: 120px; overflow-y: auto; text-align: left; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px;
        }
        .history-tag { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; color: var(--text-muted); }

        #message { margin-top: 10px; height: 20px; color: var(--danger); font-weight: 500; font-size: 0.9rem; }
        
        .loader {
            border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary);
            border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
        .shake-anim { animation: shake 0.3s; }

    </style>
</head>
<body>

    <!-- 👑 어드민 치트 사이드바 (Endloki17 전용) -->
    <div id="admin-sidebar">
        <h2>👑 GOD MODE</h2>
        <div class="db-status">내장 사전 데이터베이스 연동<br>입력 가능한 실제 단어만 필터링합니다.</div>
        <div id="cheat-word-list"></div>
    </div>

    <div id="main-wrapper">
        <!-- 1. 로그인 & 로비 화면 -->
        <div id="login-screen" class="screen active">
            <h1>온라인 끝말잇기</h1>
            <div class="subtitle">체력을 관리하며 끝까지 살아남으세요!</div>
            <input type="text" id="username" placeholder="사용할 닉네임을 입력하세요">
            <div class="button-group">
                <button class="btn btn-primary" onclick="hostGame()">방 만들기</button>
                <button class="btn btn-secondary" onclick="showJoinMenu()">방 참가하기</button>
            </div>
            <div id="join-menu" style="display: none; margin-top: 15px;">
                <input type="text" id="room-code-input" placeholder="초대 코드 (예: AB12C)" style="text-transform: uppercase;">
                <button class="btn btn-secondary" onclick="joinGame()">입장하기</button>
            </div>
            <div id="login-msg" style="color: var(--danger); margin-top: 10px; font-size: 0.9rem;"></div>
        </div>

        <!-- 2. 방 대기 화면 -->
        <div id="waiting-screen" class="screen">
            <h1>대기실</h1>
            <div class="subtitle">친구에게 아래 코드를 공유하세요.</div>
            <div class="loader"></div>
            <div class="room-code-box" id="display-room-code">로딩중...</div>
            <div style="color: var(--text-muted); font-size: 0.9rem;">상대방의 접속을 기다리고 있습니다...</div>
        </div>

        <!-- 3. 게임 화면 -->
        <div id="game-screen" class="screen">
            <div class="status-header">
                <!-- 상대방 정보 -->
                <div class="player-row">
                    <div class="player-info" id="opponent-name-ui">상대방</div>
                    <div class="hp-bar" id="opponent-hp-ui">❤️❤️❤️</div>
                </div>
                <!-- 내 정보 -->
                <div class="player-row" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                    <div class="player-info">
                        <span id="my-name-ui">나</span>
                        <span class="turn-badge" id="turn-indicator">대기 중</span>
                    </div>
                    <div class="hp-bar" id="my-hp-ui">❤️❤️❤️</div>
                </div>
            </div>
            
            <div class="word-display" id="current-word">끝말잇기</div>
            
            <div style="display: flex; gap: 10px;">
                <input type="text" id="word-input" placeholder="단어 입력..." onkeypress="if(event.key === 'Enter') attemptSubmitWord()">
                <button class="btn btn-primary" id="submit-btn" onclick="attemptSubmitWord()" style="width: 100px; margin: 0;">전송</button>
            </div>
            
            <div id="message"></div>
            <div class="history-box" id="history-box"></div>
        </div>
    </div>

    <script>
        // --- 📖 내장 미니 사전 DB (테스트용 실제 단어 모음) ---
        // 본 게임은 이 배열 안에 있는 단어만 '존재하는 단어'로 인정합니다.
        const VALID_DICTIONARY = [
            "끝말잇기", "기차", "차표", "표범", "범인", "인간", "간식", "식사", "사람", "람보", "보석", "석양", "양말", "말벌", 
            "벌집", "집안", "안경", "경찰", "찰흙", "물고기", "기러기", "기상", "상자", "자동차", "차도", "도로", "로봇", "물방울", 
            "울음", "음표", "표지판", "판사", "사과", "과일", "일정", "정답", "답안지", "지우개", "개미", "미로", "로마", "마술", 
            "술잔", "잔치", "치과", "과학", "학교", "교실", "실내화", "화장실", "실패", "패배", "배추", "추리", "이유", "유리", 
            "리본", "본드", "드럼", "주전자", "자전거", "거미", "미술", "술래", "퍼즐", "즐거움", "음악", "악기", "기분", "분수", 
            "수박", "박수", "수영", "영웅", "이빨", "빨대", "대문", "문지기", "기둥", "둥지", "지구", "구두", "두부", "부자", 
            "자석", "석판", "판결", "결투", "투구", "구슬", "슬픔", "가구", "구역", "역사", "사전", "전기", "기사", "사자", "자기",
            "기구", "구름", "름름", "나무", "무기", "기계", "계단", "단어", "어부", "부모", "모자", "자연", "연기", "기록", "녹음",
            "음식", "식물", "물건", "건물", "물수건", "건강", "강아지", "지갑", "갑옷", "옷장", "장갑", "갑부", "부록", "녹차"
        ];

        let peer = null;
        let conn = null;
        
        let myName = "";
        let opponentName = "상대방";
        let isHost = false;
        let isMyTurn = false;
        let isAdmin = false;

        const MAX_HP = 3;
        let myHP = MAX_HP;
        let opponentHP = MAX_HP;

        let currentWord = "끝말잇기";
        let usedWords = ["끝말잇기"];

        const ROOM_PREFIX = "KOREANWORD-"; 

        function renderHP(elementId, hp) {
            const el = document.getElementById(elementId);
            el.innerHTML = "";
            for (let i = 0; i < MAX_HP; i++) {
                const heart = document.createElement("span");
                heart.innerText = "❤️";
                if (i < hp) heart.className = "active";
                el.appendChild(heart);
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function checkUsername() {
            const name = document.getElementById('username').value.trim();
            if (!name) { document.getElementById('login-msg').innerText = "닉네임을 입력해주세요."; return null; }
            if (name === "Endloki17") { isAdmin = true; document.getElementById('admin-sidebar').style.display = 'flex'; }
            return name;
        }

        function showJoinMenu() {
            if (checkUsername()) {
                document.getElementById('join-menu').style.display = 'block';
                document.getElementById('room-code-input').focus();
            }
        }

        // 호스트 방 생성
        function hostGame() {
            myName = checkUsername(); if (!myName) return;
            isHost = true; showScreen('waiting-screen');

            const roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
            peer = new Peer(ROOM_PREFIX + roomCode);

            peer.on('open', () => document.getElementById('display-room-code').innerText = roomCode);
            peer.on('connection', (connection) => {
                conn = connection; setupConnectionEventHandlers();
                isMyTurn = true; // 호스트 선공
            });
            peer.on('error', (err) => { alert("오류: " + err.type); showScreen('login-screen'); });
        }

        // 게스트 방 참가
        function joinGame() {
            myName = checkUsername(); if (!myName) return;
            const inputCode = document.getElementById('room-code-input').value.trim().toUpperCase();
            if (!inputCode) return;

            isHost = false; peer = new Peer();
            peer.on('open', () => {
                document.getElementById('login-msg').innerText = "연결 중...";
                conn = peer.connect(ROOM_PREFIX + inputCode);
                conn.on('open', () => {
                    setupConnectionEventHandlers();
                    conn.send({ type: 'join', name: myName });
                    isMyTurn = false;
                });
                conn.on('error', () => alert("연결 실패! 코드를 확인해주세요."));
            });
        }

        // 네트워크 통신 핸들러
        function setupConnectionEventHandlers() {
            conn.on('data', (data) => {
                if (data.type === 'join') {
                    opponentName = data.name;
                    conn.send({ type: 'start', name: myName, word: currentWord, used: usedWords });
                    initGameUI();
                } else if (data.type === 'start') {
                    opponentName = data.name; currentWord = data.word; usedWords = data.used;
                    initGameUI();
                } else if (data.type === 'word_success') {
                    // 상대가 단어 맞춤
                    applyNewWord(data.word, false);
                } else if (data.type === 'hp_update') {
                    // 상대 체력 깎임 (턴은 유지됨)
                    opponentHP = data.hp;
                    renderHP('opponent-hp-ui', opponentHP);
                    triggerShake('opponent-hp-ui');
                } else if (data.type === 'game_over') {
                    alert(`상대방의 체력이 0이 되었습니다! 🎉 ${myName} 승리!`);
                    location.reload();
                }
            });

            conn.on('close', () => { alert("상대방이 도망갔거나 연결이 끊어졌습니다."); location.reload(); });
        }

        function initGameUI() {
            showScreen('game-screen');
            document.getElementById('my-name-ui').innerText = myName;
            document.getElementById('opponent-name-ui').innerText = opponentName;
            renderHP('my-hp-ui', myHP);
            renderHP('opponent-hp-ui', opponentHP);
            updateBoardUI();
        }

        function triggerShake(elementId) {
            const el = document.getElementById(elementId);
            el.classList.remove('shake-anim');
            void el.offsetWidth; // 리플로우 강제 트리거
            el.classList.add('shake-anim');
        }

        // 체력 감소 로직
        function takeDamage(msg) {
            myHP -= 1;
            renderHP('my-hp-ui', myHP);
            triggerShake('my-hp-ui');
            document.getElementById('message').innerText = `${msg} (체력 -1)`;
            document.getElementById('word-input').value = "";
            
            if (myHP <= 0) {
                conn.send({ type: 'game_over' });
                setTimeout(() => { alert("체력을 모두 잃었습니다. 💀 게임 오버!"); location.reload(); }, 100);
            } else {
                conn.send({ type: 'hp_update', hp: myHP });
            }
        }

        // 입력 유효성 검사
        function attemptSubmitWord(forcedWord = null) {
            if (!isMyTurn) return;

            const inputField = document.getElementById('word-input');
            const newWord = forcedWord ? forcedWord : inputField.value.trim();

            if (newWord.length < 2) {
                takeDamage("2글자 이상 입력해야 합니다."); return;
            }

            const lastChar = currentWord.charAt(currentWord.length - 1);
            if (lastChar !== newWord.charAt(0)) {
                takeDamage(`'${lastChar}'(으)로 시작해야 합니다.`); return;
            }

            if (usedWords.includes(newWord)) {
                takeDamage("이미 사용한 단어입니다."); return;
            }

            // 🛑 실제 단어인지 확인 (딕셔너리 검사)
            if (!VALID_DICTIONARY.includes(newWord)) {
                takeDamage("사전에 없는 단어입니다!"); return;
            }

            // 통과 처리
            document.getElementById('message').innerText = "";
            applyNewWord(newWord, true);
            conn.send({ type: 'word_success', word: newWord });
        }

        function applyNewWord(word, isItMyWord) {
            currentWord = word;
            usedWords.push(currentWord);
            isMyTurn = !isItMyWord; // 턴 교체
            updateBoardUI();
        }

        function updateBoardUI() {
            const inputField = document.getElementById('word-input');
            const submitBtn = document.getElementById('submit-btn');
            const turnIndicator = document.getElementById('turn-indicator');
            const msgBox = document.getElementById('message');

            document.getElementById('current-word').innerText = currentWord;
            inputField.value = ""; msgBox.innerText = "";

            if (isMyTurn) {
                turnIndicator.innerText = "나의 차례!"; turnIndicator.className = "turn-badge turn-mine";
                inputField.disabled = false; submitBtn.disabled = false; inputField.focus();
            } else {
                turnIndicator.innerText = "상대방 차례"; turnIndicator.className = "turn-badge turn-opponent";
                inputField.disabled = true; submitBtn.disabled = true;
            }

            const historyBox = document.getElementById('history-box');
            historyBox.innerHTML = "";
            usedWords.forEach((word, index) => {
                const span = document.createElement('span');
                span.className = 'history-tag';
                if (index === usedWords.length - 1) {
                    span.style.background = 'rgba(59, 130, 246, 0.2)'; span.style.color = '#60a5fa'; span.style.border = '1px solid rgba(59, 130, 246, 0.5)';
                }
                span.innerText = word;
                historyBox.appendChild(span);
            });
            historyBox.scrollTop = historyBox.scrollHeight;

            if (isAdmin) generateCheatWords();
        }

        // 👑 어드민 치트: 내장 사전에서만 단어 필터링
        function generateCheatWords() {
            const cheatList = document.getElementById('cheat-word-list');
            cheatList.innerHTML = ""; 
            const targetChar = currentWord.charAt(currentWord.length - 1);

            // DB에서 해당 글자로 시작하면서 아직 안 쓴 단어 추출
            const availableWords = VALID_DICTIONARY.filter(w => w.startsWith(targetChar) && !usedWords.includes(w));

            if (availableWords.length === 0) {
                cheatList.innerHTML = "<div style='color:red; font-size:0.9rem;'>⚠️ DB에 이을 단어가 없습니다!</div>";
                return;
            }

            availableWords.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'cheat-word-btn';
                btn.innerText = word;
                if (!isMyTurn) { btn.style.opacity = '0.3'; btn.style.cursor = 'not-allowed'; }
                btn.onclick = () => { if(isMyTurn) attemptSubmitWord(word); };
                cheatList.appendChild(btn);
            });
        }
    </script>
</body>
</html>
