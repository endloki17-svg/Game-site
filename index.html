<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모던 노트 플랫폼</title>
    <style>
        /* 기본 스타일 초기화 및 웹 폰트 적용 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        * {
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            background-color: #f5f5f7;
            color: #333;
        }

        /* 사이드바 스타일 */
        #sidebar {
            width: 320px;
            background-color: #f9f9f9;
            border-right: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.02);
        }

        #sidebar-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e5e5;
        }

        #sidebar-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #1d1d1f;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #007aff;
            color: white;
        }

        .btn-primary:hover { background-color: #005bb5; }

        .btn-danger {
            background-color: #ff3b30;
            color: white;
        }

        .btn-danger:hover { background-color: #cc2f26; }

        /* 노트 리스트 스타일 */
        #note-list {
            flex: 1;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .note-item {
            padding: 15px 20px;
            border-bottom: 1px solid #efefef;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .note-item:hover {
            background-color: #f0f0f0;
        }

        .note-item.active {
            background-color: #e8f0fe;
            border-left: 4px solid #007aff;
        }

        .note-item-title {
            margin: 0 0 5px 0;
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-item-preview {
            margin: 0;
            font-size: 0.85rem;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 메인 에디터 영역 스타일 */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        #editor-header {
            padding: 20px 40px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #note-title-input {
            width: 70%;
            border: none;
            outline: none;
            font-size: 1.8rem;
            font-weight: 700;
            color: #1d1d1f;
        }

        #note-title-input::placeholder {
            color: #cccccc;
        }

        #editor-body {
            flex: 1;
            padding: 20px 40px;
            display: flex;
        }

        #note-content-input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;
        }

        #note-content-input::placeholder {
            color: #cccccc;
        }

        /* 빈 상태(Empty State) 디자인 */
        #empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }

        #empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- 왼쪽 사이드바: 노트 목록 -->
    <div id="sidebar">
        <div id="sidebar-header">
            <h2>내 노트</h2>
            <button class="btn btn-primary" onclick="createNewNote()">+ 새 노트</button>
        </div>
        <ul id="note-list">
            <!-- 자바스크립트로 노트 목록이 렌더링 됩니다 -->
        </ul>
    </div>

    <!-- 오른쪽 메인: 노트 편집기 -->
    <div id="main">
        <div id="empty-state">
            <h3>선택된 노트가 없습니다.</h3>
            <p>왼쪽에서 노트를 선택하거나 새 노트를 작성해보세요.</p>
        </div>

        <div id="editor-container" style="display: none; height: 100%; flex-direction: column;">
            <div id="editor-header">
                <input type="text" id="note-title-input" placeholder="제목을 입력하세요..." oninput="autoSave()">
                <button class="btn btn-danger" onclick="deleteCurrentNote()">삭제</button>
            </div>
            <div id="editor-body">
                <textarea id="note-content-input" placeholder="내용을 작성하세요..." oninput="autoSave()"></textarea>
            </div>
        </div>
    </div>

    <script>
        // 상태 관리
        let notes = JSON.parse(localStorage.getItem('my_notes')) || [];
        let currentNoteId = null;

        // DOM 요소
        const noteListEl = document.getElementById('note-list');
        const emptyStateEl = document.getElementById('empty-state');
        const editorContainerEl = document.getElementById('editor-container');
        const titleInput = document.getElementById('note-title-input');
        const contentInput = document.getElementById('note-content-input');

        // 초기 렌더링
        renderNoteList();

        // 새 노트 생성
        function createNewNote() {
            const newNote = {
                id: Date.now().toString(),
                title: '',
                content: '',
                updatedAt: new Date().toISOString()
            };
            notes.unshift(newNote); // 맨 앞에 추가
            saveNotes();
            selectNote(newNote.id);
        }

        // 노트 선택
        function selectNote(id) {
            currentNoteId = id;
            const note = notes.find(n => n.id === id);
            
            if (note) {
                // UI 전환
                emptyStateEl.style.display = 'none';
                editorContainerEl.style.display = 'flex';
                
                // 데이터 채우기
                titleInput.value = note.title;
                contentInput.value = note.content;
                
                renderNoteList(); // 활성화된 스타일 적용을 위해 재렌더링
            }
        }

        // 자동 저장 (입력할 때마다 호출)
        function autoSave() {
            if (!currentNoteId) return;

            const noteIndex = notes.findIndex(n => n.id === currentNoteId);
            if (noteIndex !== -1) {
                notes[noteIndex].title = titleInput.value;
                notes[noteIndex].content = contentInput.value;
                notes[noteIndex].updatedAt = new Date().toISOString();
                
                saveNotes();
                renderNoteList();
            }
        }

        // 현재 노트 삭제
        function deleteCurrentNote() {
            if (!currentNoteId) return;
            if (confirm('정말로 이 노트를 삭제하시겠습니까?')) {
                notes = notes.filter(n => n.id !== currentNoteId);
                saveNotes();
                currentNoteId = null;
                
                // UI 초기화
                emptyStateEl.style.display = 'flex';
                editorContainerEl.style.display = 'none';
                titleInput.value = '';
                contentInput.value = '';
                
                renderNoteList();
            }
        }

        // 로컬 스토리지에 저장
        function saveNotes() {
            localStorage.setItem('my_notes', JSON.stringify(notes));
        }

        // 왼쪽 사이드바 리스트 렌더링
        function renderNoteList() {
            noteListEl.innerHTML = '';
            
            notes.forEach(note => {
                const li = document.createElement('li');
                li.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
                li.onclick = () => selectNote(note.id);

                const displayTitle = note.title.trim() === '' ? '새 노트' : note.title;
                const displayContent = note.content.trim() === '' ? '내용이 없습니다.' : note.content;

                li.innerHTML = `
                    <h4 class="note-item-title">${displayTitle}</h4>
                    <p class="note-item-preview">${displayContent}</p>
                `;
                
                noteListEl.appendChild(li);
            });
        }
    </script>
</body>
</html>
