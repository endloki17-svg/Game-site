<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초고퀄리티 온라인 끝말잇기 (Ultimate Edition)</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700;900&display=swap');

        :root {
            --bg-color: #0f172a; --panel-bg: rgba(30, 41, 59, 0.85);
            --primary: #3b82f6; --primary-hover: #2563eb;
            --secondary: #10b981; --secondary-hover: #059669;
            --danger: #ef4444; --warning: #f59e0b; --hint-color: #a855f7;
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); }

        .screen { background: var(--panel-bg); backdrop-filter: blur(15px); padding: 35px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 450px; text-align: center; display: none; max-height: 95vh; overflow-y: auto; }
        .screen::-webkit-scrollbar { width: 5px; } .screen::-webkit-scrollbar-thumb { background: #475569; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 2rem; margin-bottom: 5px; font-weight: 900; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); margin-bottom: 25px; font-size: 0.9rem; }

        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-size: 1rem; margin-bottom: 12px; outline: none; transition: border 0.3s; }
        input:focus { border-color: var(--primary); }
        input:disabled { background: rgba(0,0,0,0.5); color: #666; cursor: not-allowed; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; margin-bottom: 8px; }
        .btn-primary { background: var(--primary); } .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--secondary); } .btn-secondary:hover { background: var(--secondary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); }
        .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; }
        .flex-row { display: flex; gap: 10px; } .flex-row .btn { margin-bottom: 0; }

        .text-link { color: var(--primary); cursor: pointer; font-size: 0.85rem; text-decoration: underline; margin-top: 10px; display: inline-block; }

        /* 프로필 & 로비 */
        .profile-card { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; border: 1px solid rgba(255,255,255,0.1); }
        .profile-card h3 { color: var(--warning); margin-bottom: 5px; }
        .stat-badges { display: flex; gap: 10px; margin-top: 5px; font-size: 0.85rem; }
        .badge { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 5px; }
        .coin-text { color: #fbbf24; font-weight: bold; }

        /* 대기실 QR */
        .room-code-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px; margin: 15px 0; font-size: 1.5rem; font-weight: bold; color: #fbbf24; border: 1px dashed #fbbf24; letter-spacing: 2px; }
        #qr-code { margin: 10px auto; width: 150px; height: 150px; background: white; padding: 10px; border-radius: 10px; }

        /* 게임 UI */
        .timer-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
        .timer-bar-fill { height: 100%; background: var(--secondary); width: 100%; transition: width 1s linear, background 0.3s; }
        .timer-text { font-size: 0.85rem; color: var(--text-muted); text-align: right; margin-bottom: 5px; }

        .player-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 8px 0; }
        .player-info { font-weight: bold; color: #f8fafc; display: flex; align-items: center; gap: 10px; }
        .hp-bar { color: #ef4444; font-size: 1.1rem; } .hp-bar span { opacity: 0.3; } .hp-bar span.active { opacity: 1; }
        .turn-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        .turn-mine { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; } .turn-opponent { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

        .word-display { font-size: 3.5rem; font-weight: 900; margin: 20px 0; letter-spacing: 3px; text-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .history-box { margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; height: 80px; overflow-y: auto; text-align: left; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
        .history-tag { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 15px; font-size: 0.85rem; color: var(--text-muted); }
        #message { margin-top: 10px; height: 20px; color: var(--danger); font-weight: bold; font-size: 0.9rem; }

        /* 힌트 시스템 */
        .hint-btn { background: rgba(168, 85, 247, 0.1); border: 1px solid var(--hint-color); color: var(--hint-color); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; margin-top: 10px; width: 100%; transition: all 0.2s; font-weight: bold; }
        .hint-btn:hover:not(:disabled) { background: var(--hint-color); color: white; }
        #hint-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .hint-word { background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 5px; font-size: 0.85rem; cursor: pointer; }
        .hint-word:hover { background: var(--primary); }

        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .shake-anim { animation: shake 0.3s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
    </style>
</head>
<body>

    <!-- 1. 로그인 / 회원가입 화면 -->
    <div id="auth-screen" class="screen active">
        <h1>끝말잇기 <span style="font-size:1rem; color:var(--text-muted);">Ultimate</span></h1>
        <div class="subtitle">계정을 만들고 전적과 코인을 모아보세요!</div>
        
        <div id="login-form">
            <input type="text" id="login-id" placeholder="닉네임 (아이디)">
            <input type="password" id="login-pw" placeholder="비밀번호" onkeypress="if(event.key==='Enter') login()">
            <button class="btn btn-primary" onclick="login()">로그인</button>
            <span class="text-link" onclick="toggleAuth('register')">계정이 없으신가요? 회원가입</span>
        </div>

        <div id="register-form" style="display:none;">
            <input type="text" id="reg-id" placeholder="사용할 닉네임">
            <input type="password" id="reg-pw" placeholder="비밀번호 설정" onkeypress="if(event.key==='Enter') register()">
            <button class="btn btn-secondary" onclick="register()">계정 생성 (코인 50개 지급)</button>
            <span class="text-link" onclick="toggleAuth('login')">이미 계정이 있습니다. 로그인</span>
        </div>
        <div id="auth-msg" style="color:var(--danger); margin-top:10px; font-size:0.85rem;"></div>
    </div>

    <!-- 2. 게임 로비 화면 -->
    <div id="lobby-screen" class="screen">
        <h1>게임 로비</h1>
        
        <div class="profile-card">
            <h3 id="lobby-username">닉네임</h3>
            <div class="stat-badges">
                <span class="badge">승리: <span id="lobby-wins" style="color:var(--secondary)">0</span></span>
                <span class="badge">패배: <span id="lobby-losses" style="color:var(--danger)">0</span></span>
                <span class="badge">코인: <span id="lobby-coins" class="coin-text">0</span> 🪙</span>
            </div>
        </div>

        <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <p style="font-size:0.8rem; color:#94a3b8; text-align:left; margin-bottom:5px;">[방장 전용] Gemini 3.6 Flash API 키</p>
            <input type="password" id="api-key-input" placeholder="방을 만들려면 키를 입력하세요" style="margin-bottom:0;">
        </div>

        <div class="flex-row">
            <button class="btn btn-primary" onclick="createRoom()">새 방 만들기</button>
        </div>
        
        <div style="margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px; text-align:left;">친구의 코드로 참가하기</p>
            <div class="flex-row">
                <input type="text" id="room-code-input" placeholder="초대 코드" style="margin-bottom:0; text-transform:uppercase;">
                <button class="btn btn-secondary" onclick="joinRoom()" style="width: 100px;">입장</button>
            </div>
        </div>
        <button class="btn btn-outline" onclick="logout()" style="margin-top:10px;">로그아웃</button>
    </div>

    <!-- 3. 대기실 화면 -->
    <div id="waiting-screen" class="screen">
        <h1>대기실</h1>
        <div class="subtitle">상대방이 오기를 기다리고 있습니다...</div>
        <div class="room-code-box" id="display-room-code">로딩중...</div>
        <p style="font-size:0.85rem; color:var(--text-muted);">초대 QR 코드</p>
        <img id="qr-code" src="" alt="QR Code" style="display:none;">
        <br><br>
        <button class="btn btn-outline" onclick="location.reload()">방 폭파하고 나가기</button>
    </div>

    <!-- 4. 게임 화면 -->
    <div id="game-screen" class="screen">
        <div class="timer-text" id="timer-text">남은 시간: 30초</div>
        <div class="timer-bar-bg"><div class="timer-bar-fill" id="timer-bar"></div></div>

        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 15px;">
            <div class="player-row">
                <div class="player-info" id="opponent-name-ui">상대방</div>
                <div class="hp-bar" id="opponent-hp-ui">❤️❤️❤️</div>
            </div>
            <div class="player-row" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                <div class="player-info">
                    <span id="my-name-ui">나</span>
                    <span class="turn-badge" id="turn-indicator">대기 중</span>
                </div>
                <div class="hp-bar" id="my-hp-ui">❤️❤️❤️</div>
            </div>
        </div>
        
        <div class="word-display" id="current-word">시작</div>
        
        <div class="flex-row">
            <input type="text" id="word-input" placeholder="단어 입력..." onkeypress="if(event.key === 'Enter') attemptSubmitWord()">
            <button class="btn btn-primary" id="submit-btn" onclick="attemptSubmitWord()" style="width: 80px;">전송</button>
        </div>
        <div id="message"></div>
        
        <!-- 코인 소모 힌트 -->
        <button class="hint-btn" onclick="buyAIHint()" id="hint-btn">✨ AI 힌트 (비용: 10 🪙)</button>
        <div id="hint-list"></div>

        <div class="history-box" id="history-box"></div>
    </div>

    <script>
        // ==========================================
        // 1. 데이터베이스 및 계정 시스템 (Mock)
        // ==========================================
        let db = JSON.parse(localStorage.getItem('wordgame_users')) || {};
        let currentUser = null;
        let activeApiKey = localStorage.getItem('gemini_api_key') || "";

        function saveDB() { localStorage.setItem('wordgame_users', JSON.stringify(db)); }
        function saveApiKey(key) { localStorage.setItem('gemini_api_key', key); activeApiKey = key; }

        function toggleAuth(mode) {
            document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('auth-msg').innerText = "";
        }

        function msg(id, text) { document.getElementById(id).innerText = text; }

        function register() {
            const id = document.getElementById('reg-id').value.trim();
            const pw = document.getElementById('reg-pw').value.trim();
            if(!id || !pw) return msg('auth-msg', "닉네임과 비밀번호를 모두 입력하세요.");
            if(db[id]) return msg('auth-msg', "이미 존재하는 닉네임입니다.");
            
            db[id] = { pw: pw, coins: 50, wins: 0, losses: 0 };
            saveDB();
            msg('auth-msg', "가입 완료! 로그인해주세요.");
            toggleAuth('login');
        }

        function login() {
            const id = document.getElementById('login-id').value.trim();
            const pw = document.getElementById('login-pw').value.trim();
            if(!id || !pw) return msg('auth-msg', "닉네임과 비밀번호를 입력하세요.");
            if(!db[id] || db[id].pw !== pw) return msg('auth-msg', "정보가 일치하지 않습니다.");
            
            currentUser = { id: id, ...db[id] };
            sessionStorage.setItem('current_user', id);
            enterLobby();
        }

        function logout() {
            sessionStorage.removeItem('current_user');
            currentUser = null;
            showScreen('auth-screen');
        }

        function enterLobby() {
            showScreen('lobby-screen');
            document.getElementById('lobby-username').innerText = currentUser.id;
            document.getElementById('lobby-wins').innerText = currentUser.wins;
            document.getElementById('lobby-losses').innerText = currentUser.losses;
            document.getElementById('lobby-coins').innerText = currentUser.coins;
            if(activeApiKey) document.getElementById('api-key-input').value = activeApiKey;
        }

        // ==========================================
        // 2. 네트워크 (PeerJS) 및 로비 시스템
        // ==========================================
        let peer = null, conn = null;
        let isHost = false, isMyTurn = false, isThinking = false;
        const MAX_HP = 3;
        let myHP = MAX_HP, opponentHP = MAX_HP;
        let currentWord = "시작", usedWords = ["시작"];
        
        // 타이머 관련
        let turnTimer = null;
        const TURN_TIME_LIMIT = 30; 
        let timeLeft = TURN_TIME_LIMIT;

        function showScreen(id) { 
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active')); 
            document.getElementById(id).classList.add('active'); 
        }

        function createRoom() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) { alert("방장은 API 키를 입력해야 합니다."); return; }
            saveApiKey(key);
            
            isHost = true; 
            showScreen('waiting-screen');
            const roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
            
            peer = new Peer("GMN-" + roomCode);
            peer.on('open', () => {
                document.getElementById('display-room-code').innerText = roomCode;
                // QR 코드 생성 (무료 API 활용)
                const qrImg = document.getElementById('qr-code');
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${roomCode}&bgcolor=ffffff`;
                qrImg.style.display = 'block';
            });
            peer.on('connection', (connection) => { conn = connection; setupEvents(); isMyTurn = true; });
        }

        function joinRoom() {
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if(!code) return alert("코드를 입력하세요.");
            
            isHost = false; 
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect("GMN-" + code);
                conn.on('open', () => { setupEvents(); conn.send({ type: 'join', name: currentUser.id }); isMyTurn = false; });
            });
        }

        function setupEvents() {
            conn.on('data', (data) => {
                if (data.type === 'join') { 
                    conn.send({ type: 'start', name: currentUser.id, word: currentWord, used: usedWords, apiKey: activeApiKey }); 
                    startGameUI(data.name); 
                }
                else if (data.type === 'start') { 
                    activeApiKey = data.apiKey; currentWord = data.word; usedWords = data.used; 
                    startGameUI(data.name); 
                }
                else if (data.type === 'word') { applyNewWord(data.word, false); }
                else if (data.type === 'hp') { opponentHP = data.hp; renderHP('opponent-hp-ui', opponentHP); triggerShake('opponent-hp-ui'); }
                else if (data.type === 'over') { handleGameOver(true); }
            });
            conn.on('close', () => { alert("연결이 끊어졌습니다."); location.reload(); });
        }

        // ==========================================
        // 3. 게임 메인 로직 & AI (Timeout 적용)
        // ==========================================
        function startGameUI(oppName) {
            showScreen('game-screen');
            document.getElementById('my-name-ui').innerText = currentUser.id; 
            document.getElementById('opponent-name-ui').innerText = oppName;
            renderHP('my-hp-ui', myHP); renderHP('opponent-hp-ui', opponentHP); 
            updateBoardUI();
        }

        function getGeminiEndpoint() {
            // 사용자가 명시한 모델명: gemini-3.6-flash
            return `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${activeApiKey}`;
        }

        // Fetch with Timeout Helper
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 8000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            const response = await fetch(resource, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        }

        async function validateWordWithAI(prevWord, newWord) {
            const prompt = `한국어 끝말잇기 심판. '${newWord}'가 국어사전 명사이고, '${prevWord}' 끝글자로 시작(두음법칙 허용)하면 'O', 아니면 'X'만 출력.`;
            try {
                const res = await fetchWithTimeout(getGeminiEndpoint(), {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                if(data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text.trim().includes('O');
            } catch (e) {
                console.error("AI Error:", e);
                return null;
            }
        }

        async function buyAIHint() {
            if(!isMyTurn || isThinking) return;
            if(currentUser.coins < 10) return alert("코인이 부족합니다! (10 🪙 필요)");
            
            isThinking = true;
            const hintBtn = document.getElementById('hint-btn');
            hintBtn.innerHTML = '<span class="loader"></span> AI 검색 중...';
            document.getElementById('hint-list').innerHTML = "";

            const targetChar = currentWord.charAt(currentWord.length - 1);
            const prompt = `'${targetChar}'로 시작하는 한국어 명사 5개만 쉼표로 구분해 출력.`;

            try {
                const res = await fetchWithTimeout(getGeminiEndpoint(), {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                if(data.error) throw new Error(data.error.message);
                
                // 코인 차감 로직
                currentUser.coins -= 10;
                db[currentUser.id].coins = currentUser.coins;
                saveDB();

                const text = data.candidates[0].content.parts[0].text.trim();
                const words = text.split(',').map(w => w.replace(/[^가-힣]/g, '')).filter(w => w && !usedWords.includes(w));

                const list = document.getElementById('hint-list');
                words.forEach(w => {
                    const btn = document.createElement('span'); btn.className = 'hint-word'; btn.innerText = w;
                    btn.onclick = () => { document.getElementById('word-input').value = w; attemptSubmitWord(); };
                    list.appendChild(btn);
                });
            } catch (e) {
                alert("힌트 생성 실패. 코인은 차감되지 않았습니다.");
            } finally {
                isThinking = false;
                hintBtn.innerText = `✨ AI 힌트 (남은 코인: ${currentUser.coins} 🪙)`;
            }
        }

        async function attemptSubmitWord() {
            if (!isMyTurn || isThinking) return;
            const inputField = document.getElementById('word-input');
            const newWord = inputField.value.trim();
            const msgBox = document.getElementById('message');

            if (newWord.length < 2) { takeDamage("2글자 이상 입력하세요."); return; }
            if (usedWords.includes(newWord)) { takeDamage("이미 사용한 단어입니다."); return; }

            isThinking = true; inputField.disabled = true; stopTimer();
            msgBox.innerHTML = '<span class="loader"></span> AI 분석 중 (최대 8초)...';

            const isValid = await validateWordWithAI(currentWord, newWord);
            
            isThinking = false; inputField.disabled = false; inputField.focus();

            if (isValid === null) { msgBox.innerText = "API 연결 에러 (시간 초과 또는 모델명 오류)"; startTimer(); return; }
            if (isValid === false) { takeDamage(`'${newWord}'은(는) 규칙위반/사전미등록!`); } 
            else { msgBox.innerText = ""; applyNewWord(newWord, true); conn.send({ type: 'word', word: newWord }); }
        }

        function applyNewWord(word, isItMyWord) { 
            currentWord = word; usedWords.push(word); isMyTurn = !isItMyWord; 
            updateBoardUI(); 
        }

        function takeDamage(reason) {
            myHP -= 1; renderHP('my-hp-ui', myHP); triggerShake('my-hp-ui');
            document.getElementById('message').innerText = `${reason} (체력 -1)`; 
            document.getElementById('word-input').value = "";
            if (myHP <= 0) { conn.send({ type: 'over' }); handleGameOver(false); }
            else { conn.send({ type: 'hp', hp: myHP }); if(isMyTurn) startTimer(); }
        }

        // ==========================================
        // 4. 타이머 및 UI 업데이트
        // ==========================================
        function startTimer() {
            stopTimer();
            timeLeft = TURN_TIME_LIMIT;
            const fill = document.getElementById('timer-bar');
            const txt = document.getElementById('timer-text');
            
            fill.style.width = '100%'; fill.style.background = 'var(--secondary)';
            txt.innerText = `남은 시간: ${timeLeft}초`;
            txt.style.color = 'var(--text-muted)';

            turnTimer = setInterval(() => {
                timeLeft--;
                const percent = (timeLeft / TURN_TIME_LIMIT) * 100;
                fill.style.width = `${percent}%`;
                txt.innerText = `남은 시간: ${timeLeft}초`;
                
                if (timeLeft <= 10) { fill.style.background = 'var(--danger)'; txt.style.color = 'var(--danger)'; triggerShake('timer-text'); }
                if (timeLeft <= 0) { stopTimer(); takeDamage("시간 초과!"); }
            }, 1000);
        }

        function stopTimer() { clearInterval(turnTimer); }

        function updateBoardUI() {
            const inputField = document.getElementById('word-input'), submitBtn = document.getElementById('submit-btn'), indicator = document.getElementById('turn-indicator');
            document.getElementById('current-word').innerText = currentWord; inputField.value = ""; document.getElementById('message').innerText = "";
            document.getElementById('hint-list').innerHTML = ""; 
            document.getElementById('hint-btn').innerText = `✨ AI 힌트 (비용: 10 🪙)`;

            if (isMyTurn) { 
                indicator.innerText = "나의 차례!"; indicator.className = "turn-badge turn-mine"; 
                inputField.disabled = false; submitBtn.disabled = false; inputField.focus(); 
                document.getElementById('hint-btn').style.display = 'block'; 
                startTimer();
            } else { 
                indicator.innerText = "상대방 턴..."; indicator.className = "turn-badge turn-opponent"; 
                inputField.disabled = true; submitBtn.disabled = true; 
                document.getElementById('hint-btn').style.display = 'none';
                stopTimer(); document.getElementById('timer-text').innerText = "상대방이 생각 중...";
            }

            const historyBox = document.getElementById('history-box'); historyBox.innerHTML = "";
            usedWords.forEach((w, i) => {
                const span = document.createElement('span'); span.className = 'history-tag';
                if (i === usedWords.length - 1) { span.style.background = 'rgba(59, 130, 246, 0.2)'; span.style.color = '#60a5fa'; span.style.border = '1px solid rgba(59, 130, 246, 0.5)'; }
                span.innerText = w; historyBox.appendChild(span);
            });
            historyBox.scrollTop = historyBox.scrollHeight;
        }

        function renderHP(id, hp) {
            const el = document.getElementById(id); el.innerHTML = "";
            for (let i = 0; i < MAX_HP; i++) { const heart = document.createElement("span"); heart.innerText = "❤️"; if (i < hp) heart.className = "active"; el.appendChild(heart); }
        }
        function triggerShake(id) { const el = document.getElementById(id); el.classList.remove('shake-anim'); void el.offsetWidth; el.classList.add('shake-anim'); }

        function handleGameOver(isWin) {
            stopTimer();
            if(isWin) {
                alert(`🎉 승리했습니다! (+20 코인)`);
                db[currentUser.id].wins += 1;
                db[currentUser.id].coins += 20;
            } else {
                alert(`💀 패배했습니다... (-5 코인)`);
                db[currentUser.id].losses += 1;
                db[currentUser.id].coins = Math.max(0, db[currentUser.id].coins - 5);
            }
            saveDB();
            location.reload();
        }

        // 초기 실행 로직 (세션 복구)
        window.onload = () => {
            const savedId = sessionStorage.getItem('current_user');
            if(savedId && db[savedId]) { currentUser = { id: savedId, ...db[savedId] }; enterLobby(); }
        };
    </script>
</body>
</html>
