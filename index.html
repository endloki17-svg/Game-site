<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초고퀄리티 온라인 끝말잇기 (God Tier)</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;500;700;900&display=swap');

        :root {
            --bg-color: #050505; --panel-bg: rgba(20, 20, 25, 0.7);
            --primary: #4f46e5; --primary-hover: #6366f1;
            --secondary: #10b981; --secondary-hover: #059669;
            --danger: #f43f5e; --warning: #fbbf24; --hint-color: #d946ef;
            --text-main: #ffffff; --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; 
               background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #000000 100%); }

        .screen { background: var(--panel-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 40px; border-radius: 24px; 
                  box-shadow: 0 0 40px rgba(79, 70, 229, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.1); 
                  width: 100%; max-width: 480px; text-align: center; display: none; max-height: 90vh; overflow-y: auto; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; transform: scale(0.95); }
        .screen::-webkit-scrollbar { width: 4px; } .screen::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .screen.active { display: block; opacity: 1; transform: scale(1); animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        h1 { font-size: 2.4rem; margin-bottom: 8px; font-weight: 900; background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        .subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; font-weight: 300; }

        input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: white; font-size: 1.05rem; margin-bottom: 12px; outline: none; transition: all 0.3s ease; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2), inset 0 2px 4px rgba(0,0,0,0.5); }
        input:disabled { background: rgba(255,255,255,0.05); color: #52525b; cursor: not-allowed; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; color: white; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); margin-bottom: 10px; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #818cf8); box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); } 
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4); filter: brightness(1.1); }
        .btn-secondary { background: linear-gradient(135deg, var(--secondary), #34d399); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); } 
        .btn-secondary:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text-main); }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }
        .btn:disabled { background: #27272a; cursor: not-allowed; opacity: 0.5; transform: none; box-shadow: none; }
        .flex-row { display: flex; gap: 12px; } .flex-row .btn { margin-bottom: 0; }

        .text-link { color: #818cf8; cursor: pointer; font-size: 0.9rem; text-decoration: none; margin-top: 15px; display: inline-block; transition: color 0.2s; font-weight: 500; }
        .text-link:hover { color: #c084fc; text-decoration: underline; }

        /* 프로필 & 로비 */
        .profile-card { background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.2)); padding: 20px; border-radius: 16px; margin-bottom: 25px; text-align: left; border: 1px solid rgba(255,255,255,0.05); position: relative; overflow: hidden; }
        .profile-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%); }
        .profile-card h3 { color: var(--text-main); margin-bottom: 12px; font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
        .stat-badges { display: flex; gap: 8px; font-size: 0.9rem; font-weight: 600; }
        .badge { background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .coin-text { color: #fcd34d; text-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }

        /* 대기실 QR */
        .room-code-box { background: rgba(0,0,0,0.6); padding: 20px; border-radius: 16px; margin: 20px 0; font-size: 2rem; font-weight: 900; color: #fcd34d; border: 2px dashed rgba(251, 191, 36, 0.5); letter-spacing: 4px; text-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }
        #qr-code { margin: 15px auto; width: 160px; height: 160px; background: white; padding: 12px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: transform 0.3s; }
        #qr-code:hover { transform: scale(1.05); }

        /* 게임 UI */
        .timer-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .timer-bar-fill { height: 100%; background: linear-gradient(90deg, #34d399, #10b981); width: 100%; transition: width 1s linear, background 0.3s; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .timer-text { font-size: 0.85rem; color: var(--text-muted); text-align: right; margin-bottom: 8px; font-weight: 600; font-variant-numeric: tabular-nums; }

        .battle-hud { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 16px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .player-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 0; }
        .player-info { font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 12px; font-size: 1.1rem; }
        .hp-bar { color: var(--danger); font-size: 1.2rem; filter: drop-shadow(0 0 5px rgba(244, 63, 94, 0.4)); } 
        .hp-bar span { opacity: 0.2; transition: all 0.3s; display: inline-block; } 
        .hp-bar span.active { opacity: 1; transform: scale(1.1); }
        .turn-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
        .turn-mine { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); animation: pulse 2s infinite; } 
        .turn-opponent { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(251, 113, 133, 0.3); }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } }

        .word-display { font-size: 4rem; font-weight: 900; margin: 30px 0; letter-spacing: 5px; background: linear-gradient(to bottom, #ffffff, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 10px 30px rgba(255,255,255,0.1); position: relative; }
        .word-display::after { content: attr(data-text); position: absolute; left: 0; top: 0; z-index: -1; text-shadow: 0 0 40px rgba(79, 70, 229, 0.6); -webkit-text-fill-color: transparent; }

        .history-box { margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 12px; height: 90px; overflow-y: auto; text-align: left; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; border: 1px solid rgba(255,255,255,0.02); }
        .history-tag { background: rgba(255,255,255,0.05); padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; color: var(--text-muted); transition: all 0.3s; font-weight: 500; }
        #message { margin-top: 12px; height: 24px; color: var(--danger); font-weight: 700; font-size: 0.95rem; text-shadow: 0 0 10px rgba(244, 63, 94, 0.3); }

        /* 힌트 시스템 */
        .hint-btn { background: linear-gradient(135deg, rgba(217, 70, 239, 0.1), rgba(168, 85, 247, 0.1)); border: 1px solid rgba(217, 70, 239, 0.3); color: #e879f9; padding: 14px; border-radius: 12px; cursor: pointer; font-size: 0.95rem; margin-top: 15px; width: 100%; transition: all 0.2s; font-weight: 700; text-shadow: 0 0 10px rgba(217, 70, 239, 0.3); }
        .hint-btn:hover:not(:disabled) { background: linear-gradient(135deg, rgba(217, 70, 239, 0.2), rgba(168, 85, 247, 0.2)); border-color: rgba(217, 70, 239, 0.6); transform: translateY(-1px); }
        #hint-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .hint-word { background: rgba(217, 70, 239, 0.15); border: 1px solid rgba(217, 70, 239, 0.3); color: #f0abfc; padding: 6px 14px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; font-weight: 600; }
        .hint-word:hover { background: var(--hint-color); color: white; transform: scale(1.05); }

        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); border-radius: 50%; width: 18px; height: 18px; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .shake-anim { animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }
        
        .hit-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: radial-gradient(circle, rgba(244,63,94,0.2) 0%, transparent 100%); pointer-events: none; opacity: 0; z-index: 999; }
        .hit-anim { animation: flashRed 0.3s ease-out; }
        @keyframes flashRed { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="hit-screen" class="hit-overlay"></div>

    <!-- 1. 로그인 화면 -->
    <div id="auth-screen" class="screen active">
        <h1>끝말잇기 <span style="font-size:1.2rem; color:var(--text-muted); font-weight:300;">God Tier</span></h1>
        <div class="subtitle">계정을 만들고 압도적인 퀄리티를 경험하세요.</div>
        
        <div id="login-form">
            <input type="text" id="login-id" placeholder="닉네임 (아이디)">
            <input type="password" id="login-pw" placeholder="비밀번호" onkeypress="if(event.key==='Enter') login()">
            <button class="btn btn-primary" onclick="login()">게임 접속</button>
            <span class="text-link" onclick="toggleAuth('register')">계정이 없으신가요? 회원가입</span>
        </div>

        <div id="register-form" style="display:none;">
            <input type="text" id="reg-id" placeholder="멋진 닉네임 입력">
            <input type="password" id="reg-pw" placeholder="비밀번호 설정" onkeypress="if(event.key==='Enter') register()">
            <button class="btn btn-secondary" onclick="register()">계정 생성 (+50 🪙)</button>
            <span class="text-link" onclick="toggleAuth('login')">이미 계정이 있습니다. 로그인</span>
        </div>
        <div id="auth-msg" style="color:var(--danger); margin-top:15px; font-size:0.9rem; font-weight:600;"></div>
    </div>

    <!-- 2. 게임 로비 -->
    <div id="lobby-screen" class="screen">
        <h1>멀티플레이 로비</h1>
        
        <div class="profile-card">
            <h3><span id="lobby-username">닉네임</span> 님</h3>
            <div class="stat-badges">
                <span class="badge" style="color:#34d399">승리 <span id="lobby-wins">0</span></span>
                <span class="badge" style="color:#fb7185">패배 <span id="lobby-losses">0</span></span>
                <span class="badge coin-text">보유 <span id="lobby-coins">0</span> 🪙</span>
            </div>
        </div>

        <div style="background: rgba(0,0,0,0.3); padding: 18px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05);">
            <p style="font-size:0.85rem; color:#a1a1aa; text-align:left; margin-bottom:8px; font-weight:600;">🔑 방장 전용 API 키 입력 (Gemini)</p>
            <input type="password" id="api-key-input" placeholder="Google Gemini API 키" style="margin-bottom:0;">
        </div>

        <button class="btn btn-primary" onclick="createRoom()">🔥 새 방 만들기</button>
        
        <div style="margin: 25px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 25px;">
            <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px; text-align:left; font-weight:600;">친구의 코드로 참가하기</p>
            <div class="flex-row">
                <input type="text" id="room-code-input" placeholder="초대 코드 입력" style="margin-bottom:0; text-transform:uppercase;">
                <button class="btn btn-secondary" onclick="joinRoom()" style="width: 120px;">입장</button>
            </div>
        </div>
        <button class="btn btn-outline" onclick="logout()" style="margin-top:10px; font-size:0.9rem; padding:12px;">로그아웃</button>
    </div>

    <!-- 3. 대기실 -->
    <div id="waiting-screen" class="screen">
        <h1>방어선 구축 완료</h1>
        <div class="subtitle">도전자가 코드를 입력하기를 기다립니다.</div>
        <div class="room-code-box" id="display-room-code">로딩중</div>
        <p style="font-size:0.85rem; color:var(--text-muted); font-weight:600;">초대 QR 코드</p>
        <img id="qr-code" src="" alt="QR Code" style="display:none;">
        <br><br>
        <button class="btn btn-outline" onclick="location.reload()">방 폭파하고 나가기</button>
    </div>

    <!-- 4. 게임 씬 -->
    <div id="game-screen" class="screen">
        <div class="timer-text" id="timer-text">TIME: 30.0s</div>
        <div class="timer-bar-bg"><div class="timer-bar-fill" id="timer-bar"></div></div>

        <div class="battle-hud">
            <div class="player-row">
                <div class="player-info" id="opponent-name-ui">상대방</div>
                <div class="hp-bar" id="opponent-hp-ui">❤️❤️❤️</div>
            </div>
            <div class="player-row" style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; margin-top:5px;">
                <div class="player-info">
                    <span id="my-name-ui">나</span>
                    <span class="turn-badge" id="turn-indicator">대기 중</span>
                </div>
                <div class="hp-bar" id="my-hp-ui">❤️❤️❤️</div>
            </div>
        </div>
        
        <div class="word-display" id="current-word" data-text="시작">시작</div>
        
        <div class="flex-row" style="margin-top: 30px;">
            <input type="text" id="word-input" placeholder="단어를 입력하세요..." onkeypress="if(event.key === 'Enter') attemptSubmitWord()">
            <button class="btn btn-primary" id="submit-btn" onclick="attemptSubmitWord()" style="width: 100px;">공격</button>
        </div>
        <div id="message"></div>
        
        <button class="hint-btn" onclick="buyAIHint()" id="hint-btn">✨ AI 힌트 구하기 (10 🪙)</button>
        <div id="hint-list"></div>

        <div class="history-box" id="history-box"></div>
    </div>

    <script>
        // ==========================================
        // 1. 데이터베이스 및 계정 시스템
        // ==========================================
        let db = JSON.parse(localStorage.getItem('wordgame_users')) || {};
        let currentUser = null;
        let activeApiKey = localStorage.getItem('gemini_api_key') || "";

        function saveDB() { localStorage.setItem('wordgame_users', JSON.stringify(db)); }
        function saveApiKey(key) { localStorage.setItem('gemini_api_key', key); activeApiKey = key; }

        function toggleAuth(mode) {
            document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('auth-msg').innerText = "";
        }
        function msg(id, text) { document.getElementById(id).innerText = text; }

        function register() {
            const id = document.getElementById('reg-id').value.trim();
            const pw = document.getElementById('reg-pw').value.trim();
            if(!id || !pw) return msg('auth-msg', "닉네임과 비밀번호를 모두 입력하세요.");
            if(db[id]) return msg('auth-msg', "이미 존재하는 닉네임입니다.");
            
            db[id] = { pw: pw, coins: 50, wins: 0, losses: 0 };
            saveDB();
            msg('auth-msg', "가입 성공! 로그인해주세요.");
            toggleAuth('login');
        }

        function login() {
            const id = document.getElementById('login-id').value.trim();
            const pw = document.getElementById('login-pw').value.trim();
            if(!id || !pw) return msg('auth-msg', "정보를 입력하세요.");
            if(!db[id] || db[id].pw !== pw) return msg('auth-msg', "계정 정보가 틀렸습니다.");
            
            currentUser = { id: id, ...db[id] };
            sessionStorage.setItem('current_user', id);
            enterLobby();
        }

        function logout() { sessionStorage.removeItem('current_user'); location.reload(); }

        function enterLobby() {
            showScreen('lobby-screen');
            document.getElementById('lobby-username').innerText = currentUser.id;
            document.getElementById('lobby-wins').innerText = currentUser.wins;
            document.getElementById('lobby-losses').innerText = currentUser.losses;
            document.getElementById('lobby-coins').innerText = currentUser.coins;
            if(activeApiKey) document.getElementById('api-key-input').value = activeApiKey;
        }

        // ==========================================
        // 2. 네트워크 & 로비
        // ==========================================
        let peer = null, conn = null, isHost = false, isMyTurn = false, isThinking = false;
        const MAX_HP = 3; let myHP = MAX_HP, opponentHP = MAX_HP;
        let currentWord = "시작", usedWords = ["시작"];
        let turnTimer = null, timeLeft = 30;
        const TURN_LIMIT = 30;

        function showScreen(id) { 
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active')); 
            setTimeout(() => document.getElementById(id).classList.add('active'), 50);
        }

        function createRoom() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) return alert("방장은 API 키를 필수로 입력해야 합니다.");
            saveApiKey(key);
            isHost = true; showScreen('waiting-screen');
            const roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
            
            peer = new Peer("GMN-" + roomCode);
            peer.on('open', () => {
                document.getElementById('display-room-code').innerText = roomCode;
                const qrImg = document.getElementById('qr-code');
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${roomCode}&bgcolor=ffffff`;
                qrImg.style.display = 'block';
            });
            peer.on('connection', (c) => { conn = c; setupEvents(); isMyTurn = true; });
        }

        function joinRoom() {
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if(!code) return alert("코드를 입력하세요.");
            isHost = false; peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect("GMN-" + code);
                conn.on('open', () => { setupEvents(); conn.send({ type: 'join', name: currentUser.id }); isMyTurn = false; });
            });
        }

        function setupEvents() {
            conn.on('data', (data) => {
                if (data.type === 'join') { conn.send({ type: 'start', name: currentUser.id, word: currentWord, used: usedWords, apiKey: activeApiKey }); startGameUI(data.name); }
                else if (data.type === 'start') { activeApiKey = data.apiKey; currentWord = data.word; usedWords = data.used; startGameUI(data.name); }
                else if (data.type === 'word') { applyNewWord(data.word, false); }
                else if (data.type === 'hp') { opponentHP = data.hp; renderHP('opponent-hp-ui', opponentHP); hitEffect('opponent-hp-ui'); }
                else if (data.type === 'over') { handleGameOver(true); }
            });
            conn.on('close', () => { alert("상대방이 도망갔습니다."); location.reload(); });
        }

        function startGameUI(oppName) {
            showScreen('game-screen');
            document.getElementById('my-name-ui').innerText = currentUser.id; 
            document.getElementById('opponent-name-ui').innerText = oppName;
            renderHP('my-hp-ui', myHP); renderHP('opponent-hp-ui', opponentHP); updateBoardUI();
        }

        // ==========================================
        // 3. 초강력 AI 판별 시스템 (Fallback 로직 포함)
        // ==========================================
        async function fetchWithRetryAndFallback(prompt, isHint = false) {
            // 사용자가 원했던 3.6-flash 우선 시도 -> 실패시 실제 존재하는 1.5-flash로 폴백
            const models = ['gemini-3.6-flash', 'gemini-1.5-flash']; 
            let lastError = null;

            for (const model of models) {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${activeApiKey}`;
                try {
                    const controller = new AbortController();
                    const id = setTimeout(() => controller.abort(), 8000); // 8초 타임아웃
                    const res = await fetch(endpoint, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
                        signal: controller.signal
                    });
                    clearTimeout(id);
                    const data = await res.json();
                    
                    if(data.error) throw new Error(data.error.message);
                    return data.candidates[0].content.parts[0].text.trim(); // 성공시 반환
                } catch (e) {
                    console.warn(`[${model}] 실패:`, e.message);
                    lastError = e;
                    // 다음 모델로 루프 계속
                }
            }
            throw lastError; // 모든 모델 실패시 에러 던짐
        }

        async function validateWordWithAI(prevWord, newWord) {
            const prompt = `한국어 끝말잇기 심판입니다. '${newWord}'가 국어사전에 등재된 명사이고, '${prevWord}'의 끝글자로 시작(두음법칙 허용)하면 오직 'O', 아니면 'X'만 출력하세요.`;
            try {
                const resultText = await fetchWithRetryAndFallback(prompt);
                return resultText.includes('O');
            } catch (e) { return null; }
        }

        async function buyAIHint() {
            if(!isMyTurn || isThinking) return;
            if(currentUser.coins < 10) return hitEffect('hint-btn', true), msg('message', "코인이 부족합니다!");
            
            isThinking = true;
            const hintBtn = document.getElementById('hint-btn');
            hintBtn.innerHTML = '<span class="loader"></span> 초지능 AI 검색 중...';
            document.getElementById('hint-list').innerHTML = "";

            const char = currentWord.charAt(currentWord.length - 1);
            const prompt = `'${char}'로 시작하는 한국어 명사 5개만 쉼표로 구분해서 출력하세요. 설명은 빼주세요.`;

            try {
                const resultText = await fetchWithRetryAndFallback(prompt, true);
                
                currentUser.coins -= 10; db[currentUser.id].coins = currentUser.coins; saveDB();
                const words = resultText.split(',').map(w => w.replace(/[^가-힣]/g, '')).filter(w => w && !usedWords.includes(w));

                const list = document.getElementById('hint-list');
                words.forEach(w => {
                    const btn = document.createElement('span'); btn.className = 'hint-word'; btn.innerText = w;
                    btn.onclick = () => { document.getElementById('word-input').value = w; attemptSubmitWord(); };
                    list.appendChild(btn);
                });
            } catch (e) { msg('message', "API 네트워크 오류! 코인은 차감되지 않았습니다."); } 
            finally { isThinking = false; hintBtn.innerText = `✨ AI 힌트 구하기 (${currentUser.coins} 🪙 남아있음)`; }
        }

        async function attemptSubmitWord() {
            if (!isMyTurn || isThinking) return;
            const input = document.getElementById('word-input');
            const word = input.value.trim();
            const msgBox = document.getElementById('message');

            if (word.length < 2) return takeDamage("단어는 2글자 이상이어야 합니다.");
            if (usedWords.includes(word)) return takeDamage("이미 사용된 단어입니다.");

            isThinking = true; input.disabled = true; stopTimer();
            msgBox.innerHTML = '<span class="loader"></span> AI가 단어의 유효성을 검증 중입니다...';

            const isValid = await validateWordWithAI(currentWord, word);
            
            isThinking = false; input.disabled = false; input.focus();

            if (isValid === null) { msgBox.innerText = "서버 연결 불안정! 다시 시도하세요."; startTimer(); return; }
            if (isValid === false) { takeDamage(`'${word}'는 사전에 없거나 규칙 위반입니다!`); } 
            else { msgBox.innerText = ""; applyNewWord(word, true); conn.send({ type: 'word', word: word }); }
        }

        function applyNewWord(word, isMine) { 
            currentWord = word; usedWords.push(word); isMyTurn = !isMine; 
            updateBoardUI(); 
        }

        function takeDamage(reason) {
            myHP -= 1; renderHP('my-hp-ui', myHP); hitEffect('my-hp-ui');
            document.getElementById('message').innerText = `${reason} (체력 -1)`; 
            document.getElementById('word-input').value = "";
            
            const hitOverlay = document.getElementById('hit-screen');
            hitOverlay.classList.remove('hit-anim'); void hitOverlay.offsetWidth; hitOverlay.classList.add('hit-anim');

            if (myHP <= 0) { conn.send({ type: 'over' }); handleGameOver(false); }
            else { conn.send({ type: 'hp', hp: myHP }); if(isMyTurn) startTimer(); }
        }

        // ==========================================
        // 4. 연출 및 타이머 로직
        // ==========================================
        function startTimer() {
            stopTimer(); timeLeft = TURN_LIMIT;
            const fill = document.getElementById('timer-bar'), txt = document.getElementById('timer-text');
            fill.style.width = '100%'; fill.style.background = 'linear-gradient(90deg, #34d399, #10b981)'; txt.style.color = 'var(--text-muted)';
            updateTimerText();

            turnTimer = setInterval(() => {
                timeLeft -= 0.1; 
                fill.style.width = `${(timeLeft / TURN_LIMIT) * 100}%`;
                updateTimerText();
                
                if (timeLeft <= 5) { fill.style.background = 'linear-gradient(90deg, #fb7185, #f43f5e)'; txt.style.color = 'var(--danger)'; }
                if (timeLeft <= 0) { stopTimer(); takeDamage("타임 오버!"); }
            }, 100);
        }
        function stopTimer() { clearInterval(turnTimer); }
        function updateTimerText() { document.getElementById('timer-text').innerText = `TIME: ${Math.max(0, timeLeft).toFixed(1)}s`; }

        function updateBoardUI() {
            const input = document.getElementById('word-input'), btn = document.getElementById('submit-btn'), ind = document.getElementById('turn-indicator');
            const cw = document.getElementById('current-word'); cw.innerText = currentWord; cw.setAttribute('data-text', currentWord);
            input.value = ""; document.getElementById('message').innerText = ""; document.getElementById('hint-list').innerHTML = ""; 
            document.getElementById('hint-btn').innerText = `✨ AI 힌트 구하기 (10 🪙)`;

            if (isMyTurn) { 
                ind.innerText = "YOUR TURN"; ind.className = "turn-badge turn-mine"; 
                input.disabled = false; btn.disabled = false; input.focus(); 
                document.getElementById('hint-btn').style.display = 'block'; startTimer();
            } else { 
                ind.innerText = "ENEMY TURN"; ind.className = "turn-badge turn-opponent"; 
                input.disabled = true; btn.disabled = true; document.getElementById('hint-btn').style.display = 'none';
                stopTimer(); document.getElementById('timer-text').innerText = "상대방 고민 중...";
            }

            const box = document.getElementById('history-box'); box.innerHTML = "";
            usedWords.forEach((w, i) => {
                const sp = document.createElement('span'); sp.className = 'history-tag';
                if (i === usedWords.length - 1) { sp.style.background = 'rgba(79, 70, 229, 0.2)'; sp.style.color = '#818cf8'; sp.style.borderColor = 'rgba(79, 70, 229, 0.5)'; }
                sp.innerText = w; box.appendChild(sp);
            });
            box.scrollTop = box.scrollHeight;
        }

        function renderHP(id, hp) {
            const el = document.getElementById(id); el.innerHTML = "";
            for (let i = 0; i < MAX_HP; i++) { const h = document.createElement("span"); h.innerText = "❤️"; if (i < hp) h.className = "active"; el.appendChild(h); }
        }
        function hitEffect(id, forceShake=false) { 
            const el = document.getElementById(id); 
            el.classList.remove('shake-anim'); void el.offsetWidth; el.classList.add('shake-anim'); 
        }

        function handleGameOver(isWin) {
            stopTimer();
            if(isWin) { alert(`🎉 대승리! (+30 코인)`); db[currentUser.id].wins++; db[currentUser.id].coins += 30; } 
            else { alert(`💀 패배... (-10 코인)`); db[currentUser.id].losses++; db[currentUser.id].coins = Math.max(0, db[currentUser.id].coins - 10); }
            saveDB(); location.reload();
        }

        window.onload = () => {
            const id = sessionStorage.getItem('current_user');
            if(id && db[id]) { currentUser = { id: id, ...db[id] }; enterLobby(); }
        };
    </script>
