<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceText Meet - 무음성 실시간 STT 회의실</title>
  <!-- PeerJS SDK -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: rgba(22, 30, 49, 0.75);
      --border-glow: rgba(99, 102, 241, 0.25);
      --accent-primary: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
    }

    /* Ambient Background Glow */
    .glow-sphere {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-pink));
      filter: blur(140px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
      animation: float 12s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translate(-50px, -50px) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.1); }
    }

    /* Entry Modal */
    #login-modal {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(20px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px var(--border-glow);
      text-align: center;
      position: relative;
    }

    .brand-logo {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .input-group {
      margin: 20px 0;
      text-align: left;
    }

    .input-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
    }

    .input-field {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
      color: #fff;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Main App Layout */
    .app-container {
      width: 95vw;
      height: 92vh;
      max-width: 1400px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      display: grid;
      grid-template-columns: 320px 1fr;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    /* Sidebar */
    .sidebar {
      background: rgba(15, 23, 42, 0.6);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .room-info-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .room-id-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 8px;
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--accent-cyan);
    }

    .copy-btn {
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .copy-btn:hover { color: #fff; }

    .participant-list {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .participant-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 8px;
      animation: fadeIn 0.3s ease;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    /* Main Chat Area */
    .main-chat {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    .chat-header {
      padding: 20px 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meeting-status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--success);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .meeting-timer {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .chat-messages {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* Speech Bubble Styling */
    .message-card {
      max-width: 70%;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .message-card.me {
      align-self: flex-end;
    }

    .message-card.other {
      align-self: flex-start;
    }

    .message-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
    }

    .message-card.me .message-meta { justify-content: flex-end; }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.98rem;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }

    .message-card.me .message-bubble {
      background: linear-gradient(135deg, var(--accent-primary), #4338ca);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
    }

    .message-card.other .message-bubble {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Live Voice Preview Indicator */
    .live-preview-container {
      padding: 15px 30px;
      background: rgba(15, 23, 42, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 60px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .speech-wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 20px;
    }

    .wave-bar {
      width: 3px;
      height: 100%;
      background: var(--accent-cyan);
      border-radius: 3px;
      animation: wave 1.2s ease-in-out infinite;
    }

    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.6s; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 20px; }
    }

    .live-text {
      font-size: 0.95rem;
      color: var(--accent-cyan);
      font-style: italic;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Disabled Input Bar Notification */
    .input-disabled-banner {
      padding: 16px 30px;
      background: rgba(239, 68, 68, 0.08);
      border-top: 1px solid rgba(239, 68, 68, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fca5a5;
      font-size: 0.88rem;
    }

    .input-lock-tag {
      background: rgba(239, 68, 68, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    /* Controls Panel */
    .control-panel {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .icon-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .icon-btn.active-mic {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.5);
      color: var(--success);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }

    .icon-btn.active-mic i {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--accent-primary);
      padding: 12px 20px;
      border-radius: 12px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 200;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="glow-sphere"></div>

  <!-- Entry Modal -->
  <div id="login-modal">
    <div class="modal-card">
      <div class="brand-logo"><i class="fa-solid fa-microphone-slash"></i> VoiceText</div>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">
        내 목소리는 들리지 않는 실시간 음성-텍스트 변환 회의실
      </p>

      <div class="input-group">
        <label>사용자 닉네임</label>
        <input type="text" id="nickname-input" class="input-field" placeholder="닉네임을 입력하세요" value="참가자1">
      </div>

      <button class="btn btn-primary" onclick="createRoom()">
        <i class="fa-solid fa-plus"></i> 새 회의 생성하기
      </button>

      <div style="margin: 20px 0; color: var(--text-muted); font-size: 0.8rem;">또는</div>

      <div class="input-group" style="margin-top: 0;">
        <input type="text" id="room-id-input" class="input-field" placeholder="참여할 회의 ID 입력">
      </div>

      <button class="btn btn-secondary" onclick="joinRoom()">
        <i class="fa-solid fa-right-to-bracket"></i> 회의 참가하기
      </button>
    </div>
  </div>

  <!-- Main Meeting UI -->
  <div class="app-container">
    
    <!-- Sidebar -->
    <div class="sidebar">
      <div>
        <div class="brand-logo" style="font-size: 1.5rem; margin-bottom: 20px;">
          <i class="fa-solid fa-waveform"></i> VoiceText
        </div>

        <div class="room-info-card">
          <div style="font-size: 0.75rem; color: var(--text-muted);">회의 ID (초대 코드)</div>
          <div class="room-id-badge">
            <span id="display-room-id">생성 중...</span>
            <i class="fa-regular fa-copy copy-btn" onclick="copyRoomId()" title="코드 복사"></i>
          </div>
        </div>

        <div class="section-title">참가자 목록 (<span id="user-count">1</span>)</div>
        <div class="participant-list" id="participant-list">
          <!-- Dynamic Participant list -->
        </div>
      </div>

      <!-- Left Controls -->
      <div>
        <div class="control-panel">
          <button id="mic-btn" class="icon-btn active-mic" onclick="toggleMic()">
            <i class="fa-solid fa-microphone"></i> 마이크 On
          </button>
          <button class="icon-btn" onclick="exportTranscript()" title="대화 내용 다운로드">
            <i class="fa-solid fa-download"></i> 저장
          </button>
        </div>
      </div>
    </div>

    <!-- Main Chat Workspace -->
    <div class="main-chat">
      <!-- Header -->
      <div class="chat-header">
        <div class="meeting-status-pill">
          <div class="status-dot"></div>
          <span id="status-text">회의 진행 중</span>
        </div>
        <div class="meeting-timer" id="meeting-timer">00:00:00</div>
      </div>

      <!-- Chat Feed -->
      <div class="chat-messages" id="chat-messages">
        <!-- System Welcome Message -->
        <div class="message-card other" style="align-self: center; max-width: 90%;">
          <div class="message-bubble" style="background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.3); text-align: center; color: #a5b4fc;">
            <i class="fa-solid fa-shield-halved" style="margin-right: 6px;"></i>
            <b>보안 대화 모드 활성화됨:</b> 마이크로 말씀하시면 내 실제 목소리는 송출되지 않고 텍스트로만 실시간 전달됩니다.
          </div>
        </div>
      </div>

      <!-- Live Speech Preview Bar -->
      <div class="live-preview-container">
        <div class="speech-wave">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <div id="live-speech-preview" class="live-text">음성을 인식하고 있습니다. 말씀해 보세요...</div>
      </div>

      <!-- Text Input Blocked Warning Banner -->
      <div class="input-disabled-banner">
        <span><i class="fa-solid fa-keyboard" style="margin-right: 8px;"></i> 키보드 직접 입력은 비활성화되어 있습니다. 오직 <b>음성</b>으로만 발언할 수 있습니다.</span>
        <span class="input-lock-tag"><i class="fa-solid fa-lock"></i> CHAT LOCKED</span>
      </div>
    </div>

  </div>

  <!-- Toast Element -->
  <div id="toast" class="toast">알림 메시지</div>

  <script>
    // Global State Variables
    let peer = null;
    let myPeerId = '';
    let myNickname = '참가자';
    let connections = []; // PeerJS DataConnections
    let recognition = null;
    let isMicActive = true;
    let isMeetingActive = false;
    let timerInterval = null;
    let secondsElapsed = 0;

    // Speech Recognition Setup (Web Speech API)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("현재 브라우저가 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 이용해 주세요.");
    }

    // Initialize Meeting App
    function initPeer(customRoomId = null) {
      peer = customRoomId ? new Peer(customRoomId) : new Peer();

      peer.on('open', (id) => {
        myPeerId = id;
        document.getElementById('display-room-id').innerText = id;
        document.getElementById('login-modal').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('login-modal').style.visibility = 'hidden';
        }, 500);

        addParticipant(myNickname, true);
        startMeetingTimer();
        startSpeechRecognition();
        showToast("회의실에 입장하였습니다.");
      });

      // Handle Incoming Connections (Host side or Peer Mesh)
      peer.on('connection', (conn) => {
        setupConnectionListeners(conn);
      });

      peer.on('error', (err) => {
        console.error("PeerJS Error:", err);
        showToast("연결 오류가 발생했습니다: " + err.type);
      });
    }

    // Setup Listeners for DataConnection
    function setupConnectionListeners(conn) {
      conn.on('open', () => {
        connections.push(conn);
        // Handshake: Send My Nickname
        conn.send({ type: 'handshake', nickname: myNickname });
      });

      conn.on('data', (data) => {
        handleIncomingData(data, conn);
      });

      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        updateUserCount();
        showToast("참가자가 퇴장했습니다.");
      });
    }

    // Handle Incoming P2P Data Packets
    function handleIncomingData(data, conn) {
      if (data.type === 'handshake') {
        conn.peerNickname = data.nickname;
        addParticipant(data.nickname, false, conn.peer);
        showToast(`${data.nickname} 님이 입장하셨습니다.`);
      } else if (data.type === 'chat') {
        appendChatMessage(data.sender, data.text, false, data.time);
      }
    }

    // Create New Room
    function createRoom() {
      const nickInput = document.getElementById('nickname-input').value.trim();
      if (nickInput) myNickname = nickInput;
      initPeer();
    }

    // Join Existing Room
    function joinRoom() {
      const nickInput = document.getElementById('nickname-input').value.trim();
      const roomIdInput = document.getElementById('room-id-input').value.trim();

      if (!roomIdInput) {
        alert("참여할 회의 ID를 입력해 주세요.");
        return;
      }

      if (nickInput) myNickname = nickInput;

      peer = new Peer();
      peer.on('open', (id) => {
        myPeerId = id;
        document.getElementById('display-room-id').innerText = roomIdInput;
        
        // Connect to Target Host
        const conn = peer.connect(roomIdInput);
        setupConnectionListeners(conn);

        document.getElementById('login-modal').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('login-modal').style.visibility = 'hidden';
        }, 500);

        addParticipant(myNickname, true);
        startMeetingTimer();
        startSpeechRecognition();
        showToast("회의에 참가했습니다.");
      });

      peer.on('error', (err) => {
        alert("회의실을 찾을 수 없거나 연결할 수 없습니다.");
      });
    }

    // Web Speech API Integration
    function startSpeechRecognition() {
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'ko-KR'; // 한국어 설정

      const livePreview = document.getElementById('live-speech-preview');

      recognition.onresult = (event) => {
        if (!isMicActive) return;

        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        // Update Real-time Live Preview
        if (interimTranscript) {
          livePreview.innerText = interimTranscript;
        }

        // Finalized Sentence -> Send to Chat
        if (finalTranscript.trim()) {
          const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          // Render Locally
          appendChatMessage(myNickname, finalTranscript, true, currentTime);

          // Broadcast to Peers via PeerJS Data Channels
          broadcastData({
            type: 'chat',
            sender: myNickname,
            text: finalTranscript,
            time: currentTime
          });

          livePreview.innerText = "음성을 인식하고 있습니다. 말씀해 보세요...";
        }
      };

      recognition.onerror = (event) => {
        console.warn("Speech recognition error:", event.error);
        if (event.error !== 'no-speech' && isMicActive) {
          restartSpeechRecognition();
        }
      };

      recognition.onend = () => {
        // Auto Restart if mic is active
        if (isMicActive) {
          try { recognition.start(); } catch(e) {}
        }
      };

      try {
        recognition.start();
        isMeetingActive = true;
      } catch (e) {
        console.error("Mic start failed:", e);
      }
    }

    function restartSpeechRecognition() {
      try {
        recognition.stop();
      } catch(e) {}
      setTimeout(() => {
        if (isMicActive) try { recognition.start(); } catch(e) {}
      }, 300);
    }

    // Toggle Microphone Mute/Unmute
    function toggleMic() {
      isMicActive = !isMicActive;
      const micBtn = document.getElementById('mic-btn');

      if (isMicActive) {
        micBtn.classList.add('active-mic');
        micBtn.innerHTML = `<i class="fa-solid fa-microphone"></i> 마이크 On`;
        document.getElementById('live-speech-preview').innerText = "음성을 인식하고 있습니다. 말씀해 보세요...";
        try { recognition.start(); } catch(e) {}
        showToast("마이크가 켜졌습니다.");
      } else {
        micBtn.classList.remove('active-mic');
        micBtn.innerHTML = `<i class="fa-solid fa-microphone-slash" style="color:var(--danger)"></i> 마이크 Off`;
        document.getElementById('live-speech-preview').innerText = "마이크가 음소거 되었습니다.";
        try { recognition.stop(); } catch(e) {}
        showToast("마이크가 음소거 되었습니다.");
      }
    }

    // Broadcast Packet to All Connected Peers
    function broadcastData(data) {
      connections.forEach(conn => {
        if (conn.open) {
          conn.send(data);
        }
      });
    }

    // Render Chat Message Bubble
    function appendChatMessage(sender, text, isMe, time) {
      const chatContainer = document.getElementById('chat-messages');
      const messageCard = document.createElement('div');
      messageCard.className = `message-card ${isMe ? 'me' : 'other'}`;

      messageCard.innerHTML = `
        <div class="message-meta">
          <span>${escapeHtml(sender)}</span>
          <span>•</span>
          <span>${time}</span>
        </div>
        <div class="message-bubble">${escapeHtml(text)}</div>
      `;

      chatContainer.appendChild(messageCard);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Add Participant to Sidebar UI
    function addParticipant(name, isMe = false, peerId = '') {
      const list = document.getElementById('participant-list');
      const item = document.createElement('div');
      item.className = 'participant-item';
      item.id = `user-${peerId || 'me'}`;

      item.innerHTML = `
        <div class="avatar">${name.charAt(0).toUpperCase()}</div>
        <div style="flex:1;">
          <div style="font-weight:600; font-size:0.9rem;">${escapeHtml(name)} ${isMe ? '(나)' : ''}</div>
          <div style="font-size:0.75rem; color:var(--text-muted);">실시간 STT 음성 연결됨</div>
        </div>
        <div class="status-dot"></div>
      `;

      list.appendChild(item);
      updateUserCount();
    }

    function updateUserCount() {
      const count = document.querySelectorAll('.participant-item').length;
      document.getElementById('user-count').innerText = count;
    }

    // Timer Logic
    function startMeetingTimer() {
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const hrs = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
        const mins = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('meeting-timer').innerText = `${hrs}:${mins}:${secs}`;
      }, 1000);
    }

    // Utility: Copy Room ID
    function copyRoomId() {
      const roomId = document.getElementById('display-room-id').innerText;
      navigator.clipboard.writeText(roomId).then(() => {
        showToast("회의 ID가 클립보드에 복사되었습니다!");
      });
    }

    // Utility: Export Transcript
    function exportTranscript() {
      const messages = document.querySelectorAll('.message-card');
      if (messages.length === 0) {
        showToast("저장할 대화 내용이 없습니다.");
        return;
      }

      let transcriptText = `=== VoiceText 회의록 (${new Date().toLocaleDateString()}) ===\n\n`;
      messages.forEach(msg => {
        const meta = msg.querySelector('.message-meta')?.innerText.replace(/\n/g, ' ') || '';
        const body = msg.querySelector('.message-bubble')?.innerText || '';
        if (body) {
          transcriptText += `[${meta}] ${body}\n`;
        }
      });

      const blob = new Blob([transcriptText], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `회의록_${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
      showToast("회의록 파일이 다운로드되었습니다.");
    }

    // Toast Alert Helper
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // XSS Sanitizer
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
    }
  </script>
</body>
