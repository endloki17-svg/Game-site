<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끝말잇기 (Universe Edition)</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;500;700;900&display=swap');

        :root {
            --bg-color: #050505; --panel-bg: rgba(20, 20, 25, 0.85);
            --primary: #4f46e5; --secondary: #10b981; --danger: #f43f5e; --warning: #fbbf24;
            --text-main: #ffffff; --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #000000 100%); }

        .screen { background: var(--panel-bg); backdrop-filter: blur(20px); padding: 35px; border-radius: 24px; box-shadow: 0 0 40px rgba(79, 70, 229, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.1); width: 100%; max-width: 500px; text-align: center; display: none; max-height: 90vh; overflow-y: auto; transition: all 0.3s; opacity: 0; transform: translateY(20px); }
        .screen::-webkit-scrollbar { width: 4px; } .screen::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .screen.active { display: block; opacity: 1; transform: translateY(0); }

        h1 { font-size: 2.2rem; margin-bottom: 8px; font-weight: 900; background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; }

        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white; font-size: 1.05rem; margin-bottom: 12px; outline: none; transition: border 0.2s; user-select: text; }
        input:focus { border-color: var(--primary); } input:disabled { background: rgba(255,255,255,0.05); color: #52525b; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; color: white; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #818cf8); box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); } .btn-primary:active { transform: scale(0.97); }
        .btn-secondary { background: linear-gradient(135deg, var(--secondary), #34d399); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); } .btn-secondary:active { transform: scale(0.97); }
        .btn:disabled { filter: grayscale(1); cursor: not-allowed; opacity: 0.5; }
        .flex-row { display: flex; gap: 10px; } .flex-row .btn { margin-bottom: 0; }

        /* 로비 & 상점 */
        .profile-card { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: left; }
        .stat-badges { display: flex; gap: 8px; font-size: 0.9rem; font-weight: 600; margin-top:10px; }
        .badge { background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .coin-text { color: #fcd34d; }
        
        .shop-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .item-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 12px; cursor: pointer; color: white; transition: 0.2s; font-size:0.9rem; }
        .item-btn:hover { background: rgba(255,255,255,0.1); } .item-btn span { display:block; color:var(--warning); font-weight:bold; margin-top:5px; }

        /* 게임 UI */
        .timer-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
        .timer-bar-fill { height: 100%; background: var(--secondary); width: 100%; transition: width 0.1s linear, background 0.3s; }
        
        .battle-hud { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
        .hp-bar { font-size: 1.3rem; } .hp-bar span { opacity: 0.2; transition: 0.3s; } .hp-bar span.active { opacity: 1; filter: drop-shadow(0 0 5px red); }
        .shield-icon { font-size: 1rem; margin-left: 5px; filter: drop-shadow(0 0 5px #3b82f6); display:none; }
        
        .combo-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 2.5rem; font-weight: 900; color: #fcd34d; text-shadow: 0 0 20px #d97706; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity:0; pointer-events: none; z-index:10; }
        .combo-text.pop { transform: translate(-50%, -50%) scale(1); opacity: 1; }

        .word-display { font-size: 4rem; font-weight: 900; margin: 20px 0; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        #message { margin-top: 10px; height: 20px; color: var(--danger); font-weight: 700; font-size: 0.95rem; }

        .history-box { margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 12px; height: 80px; overflow-y: auto; text-align: left; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
        .history-tag { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; color: var(--text-muted); }

        .shake-anim { animation: shake 0.3s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
        .hit-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(244,63,94,0.3); pointer-events: none; opacity: 0; z-index: 999; transition: opacity 0.3s; }
    </style>
</head>
<body onclick="initAudio()"> <!-- 첫 클릭 시 오디오 활성화 -->
    <div id="hit-screen" class="hit-overlay"></div>

    <!-- 로그인 -->
    <div id="auth-screen" class="screen active">
        <h1>끝말잇기 <span style="font-size:1rem; color:var(--warning);">Universe</span></h1>
        <div class="subtitle">아이템, 콤보, 효과음까지 모든 것을 갖췄습니다.</div>
        <div id="login-form">
            <input type="text" id="login-id" placeholder="닉네임 입력">
            <input type="password" id="login-pw" placeholder="비밀번호" onkeypress="if(event.key==='Enter') login()">
            <button class="btn btn-primary" onclick="login()">접속하기</button>
            <p onclick="toggleAuth('register')" style="color:#818cf8; cursor:pointer; font-size:0.9rem; margin-top:10px;">계정 생성하기</p>
        </div>
        <div id="register-form" style="display:none;">
            <input type="text" id="reg-id" placeholder="새 닉네임">
            <input type="password" id="reg-pw" placeholder="비밀번호" onkeypress="if(event.key==='Enter') register()">
            <button class="btn btn-secondary" onclick="register()">가입 (100코인 지급)</button>
            <p onclick="toggleAuth('login')" style="color:#818cf8; cursor:pointer; font-size:0.9rem; margin-top:10px;">뒤로가기</p>
        </div>
        <div id="auth-msg" style="color:var(--danger); margin-top:10px;"></div>
    </div>

    <!-- 로비 -->
    <div id="lobby-screen" class="screen">
        <h1>멀티플레이 로비</h1>
        <div class="profile-card">
            <h3><span id="lobby-username">닉네임</span></h3>
            <div class="stat-badges">
                <span class="badge" style="color:#34d399">승 <span id="lobby-wins">0</span></span>
                <span class="badge" style="color:#fb7185">패 <span id="lobby-losses">0</span></span>
                <span class="badge coin-text"><span id="lobby-coins">0</span> 🪙</span>
            </div>
            <div class="stat-badges" style="margin-top:5px; color:#60a5fa;">
                보유 아이템: 🛡️ 방어막 <span id="lobby-shield">0</span>개
            </div>
        </div>

        <div class="shop-box">
            <button class="item-btn" onclick="buyItem('shield')">🛡️ 방어막 구매 <span>20 🪙</span></button>
        </div>

        <input type="password" id="api-key-input" placeholder="🔑 방장용 Gemini API 키 (필수)">
        <button class="btn btn-primary" onclick="createRoom()">🔥 새 방 만들기</button>
        
        <div class="flex-row" style="margin-top:20px;">
            <input type="text" id="room-code-input" placeholder="초대 코드 입력" style="margin-bottom:0;">
            <button class="btn btn-secondary" onclick="joinRoom()" style="width: 100px;">입장</button>
        </div>
    </div>

    <!-- 대기실 -->
    <div id="waiting-screen" class="screen">
        <h1>대기 중...</h1>
        <div style="font-size: 2.5rem; color:#fcd34d; font-weight:900; margin:20px 0; letter-spacing:5px;" id="display-room-code">로딩중</div>
        <button class="btn btn-outline" onclick="location.reload()" style="background:transparent; border:1px solid #fff;">나가기</button>
    </div>

    <!-- 게임 씬 -->
    <div id="game-screen" class="screen">
        <div style="font-size:0.85rem; color:#a1a1aa; text-align:right; margin-bottom:5px;" id="timer-text">TIME: 30.0s</div>
        <div class="timer-bar-bg"><div class="timer-bar-fill" id="timer-bar"></div></div>

        <div class="battle-hud">
            <div id="combo-ui" class="combo-text">2 COMBO!</div>
            <div class="player-row">
                <div style="font-weight:bold;" id="opponent-name-ui">상대방</div>
                <div><span id="opp-shield-ui" class="shield-icon">🛡️</span><span class="hp-bar" id="opponent-hp-ui">❤️❤️❤️</span></div>
            </div>
            <div class="player-row" style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; margin-top:5px;">
                <div style="font-weight:bold;"><span id="my-name-ui">나</span> <span id="turn-indicator" style="font-size:0.8rem; padding:3px 8px; border-radius:10px; background:#3f3f46;">대기</span></div>
                <div><span id="my-shield-ui" class="shield-icon">🛡️</span><span class="hp-bar" id="my-hp-ui">❤️❤️❤️</span></div>
            </div>
        </div>
        
        <div class="word-display" id="current-word">시작</div>
        
        <div class="flex-row">
            <input type="text" id="word-input" placeholder="단어 입력 (엔터)" onkeypress="if(event.key === 'Enter') attemptSubmitWord()">
            <button class="btn btn-primary" id="submit-btn" onclick="attemptSubmitWord()" style="width: 80px;">공격</button>
        </div>
        <div id="message"></div>
        <div class="history-box" id="history-box"></div>
    </div>

    <script>
        // ==========================================
        // 0. 레트로 8비트 오디오 시스템 (자동생성)
        // ==========================================
        let audioCtx = null;
        function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSfx(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if(type === 'attack') { // 뾰로롱 (공격)
                osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if(type === 'hit') { // 콰직 (피격)
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if(type === 'shield') { // 팅! (방어)
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if(type === 'buy') { // 코인 소리
                osc.type = 'square'; osc.frequency.setValueAtTime(1200, now); osc.frequency.setValueAtTime(1600, now + 0.1);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        // ==========================================
        // 1. 계정 및 상점 시스템
        // ==========================================
        let db = JSON.parse(localStorage.getItem('wordgame_db_v2')) || {};
        let currentUser = null;
        let activeApiKey = localStorage.getItem('gemini_key_v2') || "";

        function saveDB() { localStorage.setItem('wordgame_db_v2', JSON.stringify(db)); }
        function msg(id, txt) { document.getElementById(id).innerText = txt; }
        function toggleAuth(mode) {
            document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
        }

        function register() {
            const id = document.getElementById('reg-id').value.trim(), pw = document.getElementById('reg-pw').value.trim();
            if(!id || !pw) return msg('auth-msg', "입력해주세요."); if(db[id]) return msg('auth-msg', "존재하는 닉네임.");
            db[id] = { pw: pw, coins: 100, wins: 0, losses: 0, shield: 0 }; saveDB();
            msg('auth-msg', "가입 완료! 로그인하세요."); toggleAuth('login'); playSfx('buy');
        }
        function login() {
            const id = document.getElementById('login-id').value.trim(), pw = document.getElementById('login-pw').value.trim();
            if(!db[id] || db[id].pw !== pw) return msg('auth-msg', "정보 불일치.");
            currentUser = { id: id, ...db[id] }; enterLobby(); playSfx('attack');
        }
        function enterLobby() {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('lobby-screen').classList.add('active');
            document.getElementById('lobby-username').innerText = currentUser.id;
            ['wins', 'losses', 'coins', 'shield'].forEach(k => document.getElementById(`lobby-${k}`).innerText = currentUser[k]);
            if(activeApiKey) document.getElementById('api-key-input').value = activeApiKey;
        }

        function buyItem(type) {
            if(type === 'shield' && currentUser.coins >= 20) {
                currentUser.coins -= 20; currentUser.shield += 1;
                db[currentUser.id] = { ...currentUser }; saveDB(); enterLobby(); playSfx('buy');
            } else alert("코인이 부족합니다.");
        }

        // ==========================================
        // 2. 네트워크 및 게임 상태
        // ==========================================
        let peer = null, conn = null, isMyTurn = false, isThinking = false;
        let myHP = 3, opponentHP = 3, currentWord = "시작", usedWords = ["시작"];
        let turnTimer = null, timeLeft = 30, comboCount = 0;

        function createRoom() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) return alert("방장은 API 키 필수!"); localStorage.setItem('gemini_key_v2', key); activeApiKey = key;
            
            document.getElementById('lobby-screen').classList.remove('active'); document.getElementById('waiting-screen').classList.add('active');
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            peer = new Peer("WD-" + code);
            peer.on('open', () => document.getElementById('display-room-code').innerText = code);
            peer.on('connection', (c) => { conn = c; setupEvents(); isMyTurn = true; });
        }
        function joinRoom() {
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if(!code) return;
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect("WD-" + code);
                conn.on('open', () => { setupEvents(); conn.send({ type: 'join', name: currentUser.id, shield: currentUser.shield }); isMyTurn = false; });
            });
        }

        function setupEvents() {
            conn.on('data', (data) => {
                if (data.type === 'join') { 
                    document.getElementById('opp-shield-ui').style.display = data.shield > 0 ? 'inline' : 'none';
                    conn.send({ type: 'start', name: currentUser.id, shield: currentUser.shield, word: currentWord, key: activeApiKey }); startGameUI(data.name); 
                }
                else if (data.type === 'start') { 
                    activeApiKey = data.key; currentWord = data.word; 
                    document.getElementById('opp-shield-ui').style.display = data.shield > 0 ? 'inline' : 'none';
                    startGameUI(data.name); 
                }
                else if (data.type === 'word') { applyNewWord(data.word, false); }
                else if (data.type === 'hp') { opponentHP = data.hp; renderHP('opponent-hp-ui', opponentHP); playSfx('hit'); }
                else if (data.type === 'shield_break') { document.getElementById('opp-shield-ui').style.display = 'none'; playSfx('shield'); }
                else if (data.type === 'over') { handleGameOver(true); }
            });
        }

        function startGameUI(oppName) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('my-name-ui').innerText = currentUser.id; document.getElementById('opponent-name-ui').innerText = oppName;
            document.getElementById('my-shield-ui').style.display = currentUser.shield > 0 ? 'inline' : 'none';
            renderHP('my-hp-ui', myHP); renderHP('opponent-hp-ui', opponentHP); updateBoardUI();
        }

        // ==========================================
        // 3. 뇌수술 완료된 AI 판별 로직 (진짜 에러만 잡음)
        // ==========================================
        async function validateWordWithAI(prevWord, newWord) {
            // 강제로 1.5-flash 호출. Timeout 5초. 프롬프트 극단적 통제.
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${activeApiKey}`;
            const prompt = `너는 냉혹한 한국어 끝말잇기 심판이다.
이전 단어: "${prevWord}"
제시 단어: "${newWord}"
조건 1. 제시 단어가 표준국어대사전에 등재된 명사인가? (신조어, 오타 기각)
조건 2. 제시 단어가 이전 단어의 끝 글자로 시작하는가? (두음법칙 완벽 허용: 녀->여, 류->유 등)
두 조건이 완벽히 맞으면 대문자 알파벳 "O", 하나라도 틀리면 대문자 알파벳 "X" 딱 1글자만 출력해라. 부연설명 절대 금지.`;

            const controller = new AbortController(); const id = setTimeout(() => controller.abort(), 6000);
            try {
                const res = await fetch(endpoint, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.1 } }),
                    signal: controller.signal
                });
                clearTimeout(id);
                if(!res.ok) throw new Error("API Limit/Auth");
                const data = await res.json();
                const text = data.candidates[0].content.parts[0].text.trim().toUpperCase();
                return text.includes('O'); // O나 X만 나오므로 확실함
            } catch (e) {
                console.error(e);
                return null; // 진짜 네트워크/키 에러일 때만 null
            }
        }

        async function attemptSubmitWord() {
            if (!isMyTurn || isThinking) return;
            const input = document.getElementById('word-input'), word = input.value.trim(), msgBox = document.getElementById('message');
            if (word.length < 2) return handleFail("2글자 이상 입력하세요.");
            if (usedWords.includes(word)) return handleFail("이미 사용된 단어입니다.");

            isThinking = true; input.disabled = true; stopTimer();
            msgBox.innerText = 'AI 심판이 국어사전을 뒤지는 중...';

            const isValid = await validateWordWithAI(currentWord, word);
            isThinking = false; input.disabled = false; input.focus();

            if (isValid === null) { 
                msgBox.innerText = "API 서버 불안정! 체력 차감 안됨. 다시 보내주세요."; 
                startTimer(); // 시간 초기화 없이 이어서
            }
            else if (isValid === false) { handleFail(`'${word}'는 사전에 없거나 이어지지 않습니다!`); } 
            else { 
                msgBox.innerText = ""; 
                playSfx('attack');
                // 콤보 계산 (5초 안에 치면 콤보)
                if(timeLeft >= 25) { 
                    comboCount++; 
                    const comboUi = document.getElementById('combo-ui');
                    comboUi.innerText = `${comboCount} COMBO!`;
                    comboUi.classList.add('pop'); setTimeout(()=>comboUi.classList.remove('pop'), 500);
                } else comboCount = 0;

                applyNewWord(word, true); conn.send({ type: 'word', word: word }); 
            }
        }

        function handleFail(reason) {
            document.getElementById('message').innerText = reason; document.getElementById('word-input').value = "";
            if(currentUser.shield > 0) {
                currentUser.shield--; db[currentUser.id].shield = currentUser.shield; saveDB();
                document.getElementById('my-shield-ui').style.display = 'none';
                conn.send({ type: 'shield_break' }); playSfx('shield');
                document.getElementById('message').innerText += " (🛡️ 방어막이 깨졌습니다!)";
                if(isMyTurn) startTimer();
            } else {
                myHP--; renderHP('my-hp-ui', myHP); document.getElementById('my-hp-ui').classList.add('shake-anim'); setTimeout(()=>document.getElementById('my-hp-ui').classList.remove('shake-anim'),300);
                document.getElementById('hit-screen').style.opacity = '1'; setTimeout(()=>document.getElementById('hit-screen').style.opacity = '0', 200);
                playSfx('hit'); comboCount = 0;
                if (myHP <= 0) { conn.send({ type: 'over' }); handleGameOver(false); }
                else { conn.send({ type: 'hp', hp: myHP }); if(isMyTurn) startTimer(); }
            }
        }

        function applyNewWord(word, isMine) { currentWord = word; usedWords.push(word); isMyTurn = !isMine; updateBoardUI(); }

        // ==========================================
        // 4. 타이머 및 UI
        // ==========================================
        function startTimer() {
            stopTimer(); timeLeft = 30;
            const fill = document.getElementById('timer-bar'), txt = document.getElementById('timer-text');
            fill.style.background = 'var(--secondary)';
            
            turnTimer = setInterval(() => {
                timeLeft -= 0.1; fill.style.width = `${(timeLeft / 30) * 100}%`; txt.innerText = `TIME: ${Math.max(0, timeLeft).toFixed(1)}s`;
                if (timeLeft <= 5) fill.style.background = 'var(--danger)';
                if (timeLeft <= 0) { stopTimer(); handleFail("타임 오버!"); }
            }, 100);
        }
        function stopTimer() { clearInterval(turnTimer); }

        function updateBoardUI() {
            const input = document.getElementById('word-input'), btn = document.getElementById('submit-btn'), ind = document.getElementById('turn-indicator');
            document.getElementById('current-word').innerText = currentWord; input.value = ""; document.getElementById('message').innerText = "";

            if (isMyTurn) { 
                ind.innerText = "내 차례!"; ind.style.background = "#10b981"; input.disabled = false; btn.disabled = false; input.focus(); startTimer();
            } else { 
                ind.innerText = "상대 턴"; ind.style.background = "#f43f5e"; input.disabled = true; btn.disabled = true; stopTimer(); document.getElementById('timer-text').innerText = "상대방 뇌 풀가동 중...";
            }
            const box = document.getElementById('history-box'); box.innerHTML = "";
            usedWords.forEach(w => { const sp = document.createElement('span'); sp.className = 'history-tag'; sp.innerText = w; box.appendChild(sp); });
            box.scrollTop = box.scrollHeight;
        }

        function renderHP(id, hp) {
            const el = document.getElementById(id); el.innerHTML = "";
            for(let i=0; i<3; i++) el.innerHTML += `<span class="${i<hp ? 'active' : ''}">❤️</span>`;
        }

        function handleGameOver(isWin) {
            stopTimer();
            const bonus = comboCount * 5; // 콤보 1당 5코인 보너스
            if(isWin) { alert(`🎉 대승리! 기본상금 30 + 콤보보너스 ${bonus} 🪙`); db[currentUser.id].wins++; db[currentUser.id].coins += (30 + bonus); } 
            else { alert(`💀 패배... (-10 코인)`); db[currentUser.id].losses++; db[currentUser.id].coins = Math.max(0, db[currentUser.id].coins - 10); }
            saveDB(); location.reload();
        }
    </script>
</body>
